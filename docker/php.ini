; Alles melden, nichts anzeigen, alles ins Log (stderr -> docker compose logs).
; Zweck: Deprecations unter 8.3 und echte Fehler unter 7.4 sichtbar machen,
; ohne sie in die JSON-Antworten der API zu spuelen.
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
