<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLEYCAT DISPATCH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/sql-wasm.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --asphalt:#17191a;
    --asphalt-2:#212425;
    --asphalt-3:#2b2f31;
    --paper:#eee5cd;
    --paper-2:#e4d9bb;
    --paper-line:#c9bc95;
    --ink:#241f18;
    --hivis:#ff5f1f;
    --hivis-2:#ff8a3d;
    --stamp:#b23a2e;
    --steel:#7c8388;
    --chalk:#f3f1e8;
    --ok:#5c8a5c;
  }
  :root[data-theme="hell"]{
    --asphalt:#f4f1ea; --asphalt-2:#ffffff; --asphalt-3:#e3ddc9;
    --paper:#fffdf7; --paper-2:#f7f2e4; --paper-line:#d8cdae;
    --ink:#241f18; --hivis:#e0551c; --hivis-2:#ff7a33; --stamp:#b23a2e;
    --steel:#8c8371; --chalk:#241f18; --ok:#3f7a3f;
  }
  :root[data-theme="dunkel"]{
    --asphalt:#121212; --asphalt-2:#1a1a1a; --asphalt-3:#262626;
    --paper:#1e1e1e; --paper-2:#252525; --paper-line:#3a3a3a;
    --ink:#e8e6df; --hivis:#5b8cff; --hivis-2:#7ea5ff; --stamp:#e05a4e;
    --steel:#8a8f93; --chalk:#f0efe9; --ok:#5c8a5c;
  }
  :root[data-theme="dracula"]{
    --asphalt:#282a36; --asphalt-2:#21222c; --asphalt-3:#383a4c;
    --paper:#2b2d3a; --paper-2:#323445; --paper-line:#44475a;
    --ink:#f8f8f2; --hivis:#ff79c6; --hivis-2:#bd93f9; --stamp:#ff5555;
    --steel:#6272a4; --chalk:#f8f8f2; --ok:#50fa7b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--asphalt);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{height:100vh; display:flex; flex-direction:column;}

  ::selection{background:var(--hivis); color:var(--ink);}
  :focus-visible{outline:2px solid var(--hivis); outline-offset:2px;}

  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:14px 20px;
    background:var(--asphalt-2);
    border-bottom:3px solid var(--hivis);
    flex-shrink:0;
    z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--stamp);
    border:2px solid var(--chalk);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; font-weight:700; font-size:14px;
    transform:rotate(-6deg);
    flex-shrink:0;
  }
  .brand h1{font-size:20px; font-weight:700; color:var(--chalk);}
  .brand span.sub{display:block; font-family:'JetBrains Mono'; font-size:10px; color:var(--steel); letter-spacing:0.12em; text-transform:uppercase; margin-top:1px;}
  .topbar-spacer{flex:1;}
  .topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .bottom-nav{display:none;}
  .save-status{
    font-family:'JetBrains Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    white-space:nowrap; opacity:0; transition:opacity .15s;
  }
  .save-status.pending{opacity:1; color:var(--steel);}
  .save-status.saving{opacity:1; color:var(--steel);}
  .save-status.saved{opacity:1; color:var(--ok);}
  .save-status.error{opacity:1; color:var(--stamp); font-weight:700;}

  #toast-root{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px; z-index:2000;
    width:min(420px, calc(100vw - 32px)); pointer-events:none;
  }
  .toast{
    pointer-events:auto;
    display:flex; align-items:center; gap:12px;
    background:var(--asphalt-3); border:1px solid var(--paper-line);
    border-left:3px solid var(--hivis); border-radius:6px;
    padding:11px 12px 11px 14px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:toast-in .18s ease-out;
  }
  .toast.toast-out{animation:toast-out .18s ease-in forwards;}
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes toast-out{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(8px);}}
  .toast-msg{flex:1; font-family:'Inter'; font-size:13.5px; color:var(--chalk); min-width:0;}
  .toast-action{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em; font-size:12.5px; font-weight:600;
    background:none; border:none; color:var(--hivis-2); cursor:pointer; padding:4px 6px; white-space:nowrap;
  }
  .toast-action:hover{color:var(--hivis);}
  .toast-close{
    background:none; border:none; color:var(--steel); font-size:16px; line-height:1; cursor:pointer;
    padding:2px 4px;
  }
  .toast-close:hover{color:var(--chalk);}

  .btn{
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em;
    font-size:13px; font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid var(--steel);
    background:transparent;
    color:var(--chalk);
    cursor:pointer;
    transition:background .12s, color .12s, border-color .12s, transform .05s;
  }
  .btn:hover{border-color:var(--hivis); color:var(--hivis-2);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--hivis); border-color:var(--hivis); color:var(--ink);}
  .btn-primary:hover{background:var(--hivis-2); border-color:var(--hivis-2); color:var(--ink);}
  .btn-ghost{border-color:transparent; color:var(--steel);}
  .btn-ghost:hover{color:var(--chalk); border-color:var(--steel);}
  .btn-danger{border-color:var(--stamp); color:var(--stamp);}
  .btn-danger:hover{background:var(--stamp); color:var(--chalk);}
  .btn-sm{padding:5px 10px; font-size:11px;}
  .btn[disabled]{opacity:0.35; cursor:default; pointer-events:none;}

  .btn-toggle{border-color:var(--steel);}
  .btn-toggle.active{background:var(--hivis); border-color:var(--hivis); color:var(--ink);}

  /* ---------- Settings ---------- */
  #view-settings{flex-direction:column; overflow:auto; padding:36px 40px;}
  .settings-section{margin-bottom:32px;}
  .settings-section h3{font-size:16px; color:var(--chalk); margin-bottom:4px;}
  .settings-section-desc{color:var(--steel); font-family:'JetBrains Mono'; font-size:11.5px; margin-bottom:16px; max-width:640px; line-height:1.5;}
  .option-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px;}
  .option-card{
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-left:4px solid transparent;
    border-radius:4px; padding:16px; cursor:pointer; text-align:left; color:inherit; font:inherit;
    transition:border-color .12s, transform .08s;
  }
  .option-card:hover{transform:translateY(-2px); border-color:var(--steel);}
  .option-card.active{border-left-color:var(--hivis); border-color:var(--hivis);}
  .option-swatch{display:flex; gap:4px; margin-bottom:12px;}
  .option-swatch span{width:20px; height:20px; border-radius:3px; border:1px solid rgba(127,127,127,0.35); display:inline-block;}
  .icon-preview-row{display:flex; flex-wrap:wrap; overflow:hidden; gap:10px; margin-bottom:12px; font-size:19px; color:var(--hivis-2); align-items:center; min-height:22px;}
  .icon-preview-row .material-symbols-outlined{font-size:19px;}
  .option-card-label{display:block; font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; font-size:14px; color:var(--chalk); margin-bottom:4px;}
  .option-card-desc{display:block; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--steel); line-height:1.4;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; vertical-align:middle;}

  .type-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .type-row{display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px;}
  .type-row .type-icon{font-size:18px; width:24px; text-align:center; flex-shrink:0;}
  .type-row .type-info{flex:1; min-width:0;}
  .type-row .type-name{font-family:'Oswald'; text-transform:uppercase; font-weight:600; font-size:13px; color:var(--chalk);}
  .type-row .type-meta{font-family:'JetBrains Mono'; font-size:10px; color:var(--steel); margin-top:2px;}
  .type-row .type-badge{font-family:'JetBrains Mono'; font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:var(--steel); border:1px solid var(--asphalt-3); border-radius:3px; padding:2px 6px; flex-shrink:0;}
  .settings-form{margin-top:4px; padding:16px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px; display:flex; flex-direction:column; gap:12px; max-width:520px;}
  .settings-form label{font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); display:block; margin-bottom:3px;}
  .settings-form input[type=text], .settings-form input[type=number]{
    width:100%; font-family:'Inter'; font-size:13px;
    border:1px solid var(--asphalt-3); background:var(--asphalt); color:var(--chalk);
    border-radius:2px; padding:7px 9px;
  }
  .settings-form .row2{display:flex; gap:10px; flex-wrap:wrap;}
  .settings-form .row2 > div{flex:1; min-width:140px;}
  .settings-form .icon-input{width:72px; text-align:center; font-size:18px;}
  .settings-form .checkbox-row{display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono'; font-size:11px; color:var(--steel);}
  .settings-form .form-actions{display:flex; gap:8px; margin-top:2px;}

  /* ---------- Main area ---------- */
  #main{flex:1; min-height:0; position:relative;}
  .view{display:none; height:100%;}
  .view.active{display:flex;}

  /* ---------- Dashboard ---------- */
  #view-dashboard{flex-direction:column; overflow:auto; padding:36px 40px;}
  .dash-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
  .dash-head h2{font-size:30px; color:var(--chalk);}
  .dash-head p{color:var(--steel); font-family:'JetBrains Mono'; font-size:12px; margin-top:6px;}
  .event-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px;}
  .event-card{
    background:var(--asphalt-2);
    border:1px solid var(--asphalt-3);
    border-left:4px solid var(--hivis);
    border-radius:4px;
    padding:18px;
    cursor:pointer;
    transition:border-color .12s, transform .08s;
  }
  .event-card:hover{border-left-color:var(--hivis-2); transform:translateY(-2px);}
  .event-card h3{font-size:18px; color:var(--chalk); margin-bottom:6px;}
  .event-card .meta{font-family:'JetBrains Mono'; font-size:11px; color:var(--steel); letter-spacing:0.04em;}
  .event-card .count{margin-top:14px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--hivis-2); font-family:'JetBrains Mono';}
  .event-card-actions{display:flex; gap:8px; margin-top:14px;}

  .empty-state{
    border:1px dashed var(--asphalt-3);
    border-radius:6px;
    padding:60px 20px;
    text-align:center;
    color:var(--steel);
  }
  .empty-state .display{font-size:22px; color:var(--chalk); margin-bottom:8px;}

  .new-event-card{
    background:transparent;
    border:2px dashed var(--steel);
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    min-height:120px;
    cursor:pointer;
    color:var(--steel);
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    transition:border-color .12s, color .12s;
  }
  .new-event-card:hover{border-color:var(--hivis); color:var(--hivis-2);}

  /* ---------- Editor ---------- */
  #view-editor{flex-direction:row;}
  .map-wrap{flex:1; position:relative; display:flex; min-width:0;}
  #map{flex:1; background:#111;}

  .map-search{
    position:absolute; top:14px; left:14px; z-index:1000; width:300px;
    font-family:'Inter';
  }
  .map-search-box{display:flex; align-items:center; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:3px; box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .map-search-box svg{flex-shrink:0; margin-left:10px; opacity:0.6;}
  .map-search-box input{
    flex:1; background:transparent; border:none; color:var(--chalk);
    font-family:'Inter'; font-size:13px; padding:11px 10px;
  }
  .map-search-box input::placeholder{color:var(--steel);}
  .map-search-box .search-clear{
    background:none; border:none; color:var(--steel); cursor:pointer; padding:4px 10px; font-size:15px;
  }
  .map-search-box .search-clear:hover{color:var(--hivis-2);}
  .map-search-results{
    margin-top:4px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:3px;
    max-height:240px; overflow:auto; display:none; box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .map-search-result{
    padding:9px 12px; font-size:12.5px; color:var(--chalk); cursor:pointer; border-bottom:1px solid var(--asphalt-3);
    line-height:1.4;
  }
  .map-search-result:last-child{border-bottom:none;}
  .map-search-result:hover{background:var(--asphalt-3); color:var(--hivis-2);}
  .map-search-loading{padding:9px 12px; font-size:11.5px; color:var(--steel); font-family:'JetBrains Mono';}

  .map-legend{
    position:absolute; bottom:14px; left:14px; z-index:900;
    background:rgba(23,25,26,0.88); border:1px solid var(--asphalt-3); border-radius:3px;
    padding:8px 12px; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--steel);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .map-legend .item{display:flex; align-items:center; gap:6px;}
  .map-legend .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .map-legend .dot.mandatory{background:var(--stamp);}
  .map-legend .dot.optional{background:var(--steel); border:1px dashed var(--chalk);}
  .map-legend .line{width:16px; height:0; border-top:2px dashed var(--hivis);}
  .cp-marker{
    width:32px; height:32px; border-radius:50%;
    background:var(--stamp);
    border:2px solid var(--chalk);
    color:var(--chalk);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono'; font-weight:700; font-size:13px;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
    position:relative;
  }
  .cp-marker.optional{background:var(--steel); border-style:dashed;}
  .cp-marker-type{
    position:absolute; bottom:-5px; right:-5px;
    width:17px; height:17px; border-radius:50%;
    background:var(--chalk); border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; line-height:1;
  }
  .leaflet-tooltip.cp-time-tooltip{
    background:var(--asphalt-2); color:var(--hivis-2); border:1px solid var(--hivis);
    font-family:'JetBrains Mono'; font-size:10px; font-weight:700; padding:3px 7px; border-radius:3px;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .leaflet-tooltip.cp-time-tooltip::before{border-top-color:var(--hivis);}

  .sidebar-resize-handle{
    width:7px; flex-shrink:0; cursor:col-resize; background:var(--asphalt-3);
    position:relative; touch-action:none;
  }
  .sidebar-resize-handle:hover, .sidebar-resize-handle.dragging{background:var(--hivis);}
  .sidebar-resize-handle::after{
    content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:3px; height:34px; border-radius:2px;
    background:repeating-linear-gradient(var(--steel) 0 2px, transparent 2px 5px);
  }
  .sidebar-resize-handle:hover::after, .sidebar-resize-handle.dragging::after{
    background:repeating-linear-gradient(var(--ink) 0 2px, transparent 2px 5px);
  }

  .sidebar{
    width:340px; flex-shrink:0;
    max-width:min(640px, 80vw);
    background:var(--paper);
    color:var(--ink);
    display:flex; flex-direction:column;
    background-image:repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px);
    overflow:hidden;
  }
  .sidebar-head{
    padding:16px 18px 10px;
    border-bottom:1px solid var(--paper-line);
    flex-shrink:0;
  }
  .sidebar-head input[type=text], .sidebar-head input[type=date]{
    width:100%; margin-bottom:6px;
  }
  .sidebar-head .event-title-input{
    font-family:'Oswald'; font-size:19px; font-weight:600; text-transform:uppercase;
    border:none; background:transparent; color:var(--ink); padding:2px 0; width:100%;
  }
  .sidebar-head .event-date-input{
    font-family:'JetBrains Mono'; font-size:12px; border:none; background:transparent; color:#5b5340; padding:2px 0;
  }

  .addmode-row{padding:10px 18px; border-bottom:1px solid var(--paper-line); flex-shrink:0;}
  .addmode-row .btn{width:100%;}
  .addmode-hint{font-family:'JetBrains Mono'; font-size:10.5px; color:#6b6248; margin-top:6px; line-height:1.4;}

  .settings-section{border-bottom:1px solid var(--paper-line); flex-shrink:0;}
  .settings-toggle{
    width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    padding:10px 18px; font-family:'JetBrains Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color:#4a4432; display:flex; align-items:center; gap:6px;
  }
  .settings-toggle:hover{color:var(--stamp);}
  .settings-body{padding:2px 18px 14px; display:flex; flex-direction:column; gap:8px;}
  .settings-body label{font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#6b6248; display:block; margin-bottom:3px;}
  .settings-body select, .settings-body input[type=datetime-local], .settings-body input[type=text]{
    width:100%; font-family:'Inter'; font-size:12.5px;
    border:1px solid var(--paper-line); background:#faf6ea; color:var(--ink);
    border-radius:2px; padding:6px 8px;
  }
  .settings-row2{display:flex; gap:8px;}
  .settings-row2 > div{flex:1;}
  .settings-hint{font-family:'JetBrains Mono'; font-size:9.5px; color:#8a8065; line-height:1.4;}

  .cp-list{flex:1; overflow:auto; padding:8px 0;}
  .cp-row{
    padding:10px 18px;
    border-bottom:1px solid var(--paper-line);
    cursor:pointer;
  }
  .cp-row:hover{background:rgba(0,0,0,0.04);}
  .cp-row.editing{background:rgba(255,95,31,0.14);}
  .cp-row.dragging{opacity:0.55; background:rgba(255,95,31,0.1);}
  .cp-row-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .cp-drag-handle{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width:16px; height:22px; color:#8a8065; cursor:grab; touch-action:none;
  }
  .cp-drag-handle:hover{color:var(--stamp);}
  .cp-drag-handle:active{cursor:grabbing;}
  .cp-no{
    font-family:'JetBrains Mono'; font-weight:700; font-size:12px;
    background:var(--stamp); color:var(--chalk);
    border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cp-row.optional .cp-no{background:var(--steel);}
  .cp-name{font-family:'Oswald'; font-weight:600; font-size:14px; text-transform:uppercase; flex:1; min-width:0;}
  .tag-type{
    font-family:'JetBrains Mono'; font-size:8.5px; text-transform:uppercase; letter-spacing:0.04em;
    border:1px solid #8a8065; color:#5b5340; padding:2px 5px; border-radius:2px; flex-shrink:0;
  }
  .cp-order-btns{display:flex; gap:2px;}
  .cp-order-btns button{
    border:none; background:transparent; cursor:pointer; color:#6b6248; font-size:12px; padding:2px 4px;
  }
  .cp-order-btns button:hover{color:var(--stamp);}

  .cp-quick-toggle{
    display:flex; align-items:center; gap:5px;

  .cp-edit{margin-top:10px; display:flex; flex-direction:column; gap:8px;}

  .cp-edit input[type=text], .cp-edit textarea, .cp-edit select{
    width:100%; font-family:'Inter'; font-size:13px;
    border:1px solid var(--paper-line); background:#faf6ea; color:var(--ink);
    border-radius:2px; padding:6px 8px;
  }
  .cp-edit textarea{resize:vertical; min-height:44px;}
  .cp-edit .row2{display:flex; gap:8px;}
  .cp-edit .row2 > div{flex:1;}
  .cp-edit .checkbox-row{display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono'; font-size:11px; color:#4a4432;}
  .cp-edit .edit-actions{display:flex; gap:8px; margin-top:2px;}
  .coord-readout{font-family:'JetBrains Mono'; font-size:10.5px; color:#8a8065;}

  .cp-list-empty{padding:40px 18px; text-align:center; color:#8a8065; font-family:'JetBrains Mono'; font-size:11.5px; line-height:1.5;}

  .sidebar-foot{padding:12px 18px; border-top:1px solid var(--paper-line); flex-shrink:0; display:flex; gap:8px;}
  .sidebar-foot .btn{flex:1;}

  .confirm-row{background:rgba(178,58,46,0.12); padding:8px; border-radius:3px; margin-top:8px; font-family:'JetBrains Mono'; font-size:11px;}
  .confirm-row .row2{margin-top:6px;}

  /* ---------- Manifest ---------- */
  #view-manifest{flex-direction:column; overflow:auto; background:var(--asphalt); align-items:center; padding:36px 20px;}
  .manifest-toolbar{width:100%; max-width:760px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .manifest-settings-panel{
    width:100%; max-width:760px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px;
    padding:14px 16px; margin-bottom:18px;
  }
  .manifest-settings-cols{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed var(--asphalt-3);}
  .manifest-settings-cols label{
    display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono'; font-size:11px;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--chalk); cursor:pointer;
  }
  .manifest-settings-cols input{accent-color:var(--hivis); cursor:pointer;}
  .manifest-settings-image label{
    display:block; font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--steel); margin-bottom:8px;
  }
  .manifest-settings-image input[type=file]{color:var(--chalk); font-family:'Inter'; font-size:12px; max-width:220px;}
  .manifest-image-preview{width:70px; height:44px; object-fit:cover; border-radius:3px; border:1px solid var(--asphalt-3);}
  .manifest-header-image{width:100%; border-radius:2px; margin-bottom:18px; display:block;}
  .waybill{
    width:100%; max-width:760px;
    background:var(--paper);
    background-image:repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px);
    color:var(--ink);
    padding:36px 40px 30px;
    border-radius:2px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
    position:relative;
  }
  .waybill::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg, transparent 0 10px, var(--asphalt) 10px 11px);
    opacity:0.5;
  }
  .waybill-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px;}
  .waybill-head h2{font-size:26px;}
  .waybill-head .stamp-tag{
    border:2px solid var(--stamp); color:var(--stamp);
    font-family:'JetBrains Mono'; font-weight:700; font-size:11px;
    padding:5px 10px; border-radius:3px; transform:rotate(4deg);
    letter-spacing:0.08em;
  }
  .waybill-meta{font-family:'JetBrains Mono'; font-size:12px; color:#5b5340; margin-bottom:14px; display:flex; gap:24px; flex-wrap:wrap;}
  .waybill-timing{
    display:flex; gap:0; margin-bottom:20px; border:1px solid var(--ink); border-radius:2px; overflow:hidden;
  }
  .waybill-timing > div{flex:1; padding:8px 12px; font-family:'JetBrains Mono';}
  .waybill-timing > div:first-child{border-right:1px dashed var(--paper-line);}
  .waybill-timing .t-label{font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:#8a8065; margin-bottom:2px;}
  .waybill-timing .t-value{font-size:12.5px; font-weight:700; color:var(--ink);}
  .waybill-timing .t-sub{font-size:10px; color:#8a8065; margin-top:1px;}
  table.manifest-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.manifest-table th{
    text-align:left; font-family:'JetBrains Mono'; font-size:10px; letter-spacing:0.08em;
    text-transform:uppercase; color:#5b5340; border-bottom:1px solid var(--ink); padding:0 8px 8px 0;
  }
  table.manifest-table td{padding:10px 8px 10px 0; border-bottom:1px solid var(--paper-line); vertical-align:top;}
  .m-no{font-family:'JetBrains Mono'; font-weight:700;}
  .m-name{font-family:'Oswald'; font-weight:600; text-transform:uppercase; font-size:14px;}
  .m-type{font-family:'JetBrains Mono'; font-size:10px; color:#5b5340;}
  .m-coord{font-family:'JetBrains Mono'; font-size:11.5px; color:#5b5340; white-space:nowrap;}
  .tag-bonus{font-family:'JetBrains Mono'; font-size:9.5px; background:var(--steel); color:var(--chalk); padding:1px 5px; border-radius:2px; margin-left:6px;}
  .punch-box{width:26px; height:26px; border:2px solid var(--ink); border-radius:2px;}
  .answer-line{width:100%; min-width:80px; border-bottom:1px solid var(--ink); height:20px;}
  .score-line{font-family:'JetBrains Mono'; font-size:12px; color:#8a8065; white-space:nowrap;}
  .waybill-foot{margin-top:22px; padding-top:14px; border-top:1px dashed var(--paper-line); font-family:'JetBrains Mono'; font-size:10.5px; color:#8a8065; display:flex; justify-content:space-between;}

  .loading-row{padding:60px; text-align:center; color:var(--steel); font-family:'JetBrains Mono';}

  /* ---------- Riders ---------- */
  #view-riders{flex-direction:column; overflow:auto; background:var(--asphalt); padding:36px 40px;}
  .riders-toolbar{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:22px;}
  .riders-count-field{display:flex; align-items:flex-end; gap:8px;}
  .riders-count-field label{display:block; font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); margin-bottom:4px;}
  .riders-count-field input{
    width:90px; font-family:'JetBrains Mono'; font-size:14px; padding:8px 10px;
    border:1px solid var(--asphalt-3); background:var(--asphalt-2); color:var(--chalk); border-radius:3px;
  }
  .riders-hint{font-family:'JetBrains Mono'; font-size:10.5px; color:var(--steel); line-height:1.5; max-width:680px; margin:-6px 0 20px;}
  .riders-hint.warn{color:var(--hivis); font-weight:700;}
  .spokecard-design{
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px;
    padding:14px 16px; margin-bottom:22px; max-width:680px;
  }
  .spokecard-design label{
    display:block; font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--steel); margin-bottom:8px;
  }
  .spokecard-design-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .spokecard-design-row input[type=file]{color:var(--chalk); font-family:'Inter'; font-size:12px; max-width:220px;}
  .spokecard-design-preview{
    width:44px; height:62px; object-fit:cover; border-radius:3px; border:1px solid var(--asphalt-3); flex-shrink:0;
  }
  .rider-sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .rider-sheet-head h2{font-size:20px; color:var(--ink);}
  .rider-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px;}
  .rider-card{
    background:var(--paper); color:var(--ink); border:1px solid var(--paper-line); border-radius:3px;
    padding:12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .rider-qr{width:84px; height:84px; display:flex; align-items:center; justify-content:center;}
  .rider-bib{font-family:'JetBrains Mono'; font-weight:700; font-size:15px;}
  .rider-name-input{
    width:100%; text-align:center; font-family:'Inter'; font-size:12px;
    border:1px solid var(--paper-line); background:#faf6ea; color:var(--ink);
    border-radius:2px; padding:5px 6px;
  }
  .rider-emergency-input{
    width:100%; text-align:center; font-family:'JetBrains Mono'; font-size:10.5px;
    border:1px dashed var(--stamp); background:#faf6ea; color:#8a3a30;
    border-radius:2px; padding:4px 6px;
  }
  .rider-emergency-input::placeholder{color:#b28f86;}

  /* ---------- Check-in ---------- */
  #view-checkin{flex-direction:row; align-items:stretch; background:var(--asphalt);}
  .checkin-main{flex:1; min-width:0; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:32px 28px;}
  .checkin-main-inner{width:100%; max-width:600px; display:flex; flex-direction:column; gap:16px;}
  .checkin-side{
    width:320px; flex-shrink:0; overflow:auto; padding:24px 20px;
    background:var(--asphalt-2); border-left:1px solid var(--asphalt-3);
    display:flex; flex-direction:column;
  }
  .checkin-side-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; flex-shrink:0;
    font-family:'JetBrains Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel);
  }
  .checkin-side-count{color:var(--hivis-2); font-weight:700;}
  .checkin-side-empty{color:var(--steel); font-family:'JetBrains Mono'; font-size:11.5px; line-height:1.6; padding:20px 4px;}
  .checkin-search{background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px; padding:16px 18px;}
  .checkin-search label{display:block; font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); margin-bottom:5px;}
  .checkin-search-row{display:flex; gap:8px;}
  .checkin-search-row input{
    flex:1; min-width:0; font-family:'JetBrains Mono'; font-size:18px; padding:9px 10px;
    border:1px solid var(--asphalt-3); background:var(--asphalt); color:var(--chalk); border-radius:3px;
  }
  .checkin-search-hint{color:var(--steel); font-family:'JetBrains Mono'; font-size:12px; text-align:center; padding:30px 10px;}
  .checkin-card{background:var(--paper); color:var(--ink); border-radius:4px; padding:20px 22px; box-shadow:0 12px 40px rgba(0,0,0,.45);}
  .checkin-card-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .checkin-bib{
    font-family:'JetBrains Mono'; font-weight:700; font-size:20px;
    background:var(--stamp); color:var(--chalk); border-radius:3px; padding:6px 10px; flex-shrink:0;
  }
  .checkin-name-col{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .checkin-name-input{
    width:100%; font-family:'Inter'; font-size:14px; border:1px solid var(--paper-line);
    background:var(--paper-2); color:var(--ink); border-radius:2px; padding:7px 9px;
  }
  .checkin-emergency-input{
    width:100%; font-family:'JetBrains Mono'; font-size:11px; border:1px dashed var(--stamp);
    background:#faf6ea; color:#8a3a30; border-radius:2px; padding:5px 9px;
  }
  .checkin-emergency-input::placeholder{color:#b28f86;}
  .checkin-confirm-row{
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    margin-bottom:16px; padding:18px 10px; border-bottom:1px dashed var(--paper-line);
  }
  .checkin-confirm-btn{width:100%; max-width:340px; padding:14px 16px; font-size:14px;}
  .checkin-confirm-hint{font-family:'JetBrains Mono'; font-size:10.5px; color:#8a8065;}
  .checkin-timing{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:16px; border-bottom:1px dashed var(--paper-line);}
  .checkin-timing label{display:block; font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:#6b6248; margin-bottom:4px;}
  .checkin-timing input[type=datetime-local]{
    font-family:'Inter'; font-size:12.5px; border:1px solid var(--paper-line); background:var(--paper-2); color:var(--ink);
    border-radius:2px; padding:6px 8px;
  }
  .checkin-status{font-family:'JetBrains Mono'; font-size:11.5px; padding:6px 10px; border-radius:3px; font-weight:700;}
  .checkin-status.ok{background:rgba(92,138,92,0.16); color:var(--ok);}
  .checkin-status.warn{background:rgba(255,95,31,0.14); color:var(--hivis);}
  .checkin-status.danger{background:rgba(178,58,46,0.14); color:var(--stamp);}
  .checkin-cp-list{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .checkin-cp-row{
    padding:10px 4px; border-bottom:1px solid var(--paper-line);
  }
  .checkin-cp-head{
    display:flex; align-items:center; gap:10px; margin-bottom:7px;
    font-family:'Oswald'; font-weight:600; text-transform:uppercase; font-size:13px;
  }
  .checkin-cp-row .cp-no{
    font-family:'JetBrains Mono'; font-weight:700; font-size:11px; background:var(--stamp); color:var(--chalk);
    border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .checkin-cp-row.optional .cp-no{background:var(--steel);}
  .checkin-cp-head .cp-name{flex:1;}
  .checkin-cp-check{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-family:'JetBrains Mono'; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#4a4432;
  }
  .checkin-cp-check input{accent-color:var(--stamp); cursor:pointer; width:16px; height:16px;}
  .checkin-score-row{display:flex; gap:4px; flex-wrap:wrap;}
  .score-btn{
    width:26px; height:26px; border-radius:3px; border:1px solid var(--paper-line); background:var(--paper-2);
    color:var(--ink); font-family:'JetBrains Mono'; font-size:11px; font-weight:700; cursor:pointer;
  }
  .score-btn:hover{border-color:var(--stamp);}
  .score-btn.active{background:var(--stamp); border-color:var(--stamp); color:var(--chalk);}
  .checkin-timewindow{margin-top:8px; padding-top:8px; border-top:1px dashed var(--paper-line);}
  .checkin-timewindow label{
    display:block; font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em;
    color:#6b6248; margin-bottom:4px;
  }
  .checkin-timewindow input[type=datetime-local]{
    font-family:'Inter'; font-size:12px; border:1px solid var(--paper-line); background:var(--paper-2); color:var(--ink);
    border-radius:2px; padding:5px 7px;
  }
  .tw-badge{
    font-family:'JetBrains Mono'; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em;
    padding:3px 7px; border-radius:3px; font-weight:700;
  }
  .tw-badge.ok{background:rgba(92,138,92,0.16); color:var(--ok);}
  .tw-badge.warn{background:rgba(255,95,31,0.14); color:var(--hivis);}

  .live-countdown{
    font-family:'JetBrains Mono'; font-weight:700; font-size:15px; letter-spacing:0.04em;
    text-align:center; padding:9px; border-radius:3px; margin-bottom:12px;
  }
  .live-countdown:empty{display:none;}
  .live-countdown.start{background:rgba(124,131,136,0.16); color:var(--chalk);}
  .live-countdown.curfew{background:rgba(255,95,31,0.14); color:var(--hivis);}
  .live-countdown.over{background:rgba(178,58,46,0.18); color:var(--stamp);}

  .qr-scan-overlay{
    position:fixed; inset:0; background:rgba(10,10,10,0.9); z-index:2000;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:20px;
  }
  .qr-scan-video-wrap{
    position:relative; width:min(420px, 90vw); aspect-ratio:1; border-radius:8px; overflow:hidden;
    border:2px solid var(--hivis); background:#000;
  }
  .qr-scan-video-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
  .qr-scan-frame{position:absolute; inset:12%; border:2px dashed var(--chalk); border-radius:8px; pointer-events:none;}
  .qr-scan-status{font-family:'JetBrains Mono'; color:var(--chalk); font-size:12.5px; text-align:center; max-width:360px; line-height:1.5;}
  .qr-scan-status.error{color:var(--hivis-2); font-weight:700;}

  .checkin-overview-list{
    border:1px solid var(--asphalt-3); border-radius:4px; background:var(--asphalt);
  }
  .checkin-overview-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--asphalt-3); cursor:pointer;
  }
  .checkin-overview-row:last-child{border-bottom:none;}
  .checkin-overview-row:hover{background:var(--asphalt-3);}
  .checkin-overview-row.active{background:rgba(255,95,31,0.12);}
  .checkin-overview-row .lb-bib{font-family:'JetBrains Mono'; font-weight:700; color:var(--hivis-2); font-size:12px;}
  .checkin-overview-row .lb-name{flex:1; font-family:'Inter'; font-size:12.5px; color:var(--chalk); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- Leaderboard ---------- */
  #view-leaderboard{flex-direction:column; overflow:hidden; background:var(--asphalt); padding:28px 32px;}
  .leaderboard-page-head{display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-shrink:0;}
  .leaderboard-page-stamp{
    width:38px; height:38px; border-radius:50%; background:var(--stamp); border:2px solid var(--chalk);
    display:flex; align-items:center; justify-content:center; font-size:17px; transform:rotate(-6deg);
    flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .leaderboard-page-head h2{font-size:22px; color:var(--chalk); letter-spacing:0.02em;}
  .leaderboard-page-head p{font-family:'JetBrains Mono'; font-size:11px; color:var(--steel); margin-top:2px;}
  .leaderboard-toolbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px; flex-shrink:0;}
  .leaderboard-search{
    flex:1; min-width:220px; max-width:360px; display:flex; align-items:center; gap:8px;
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:3px; padding:9px 12px;
  }
  .leaderboard-search svg{flex-shrink:0; opacity:0.6;}
  .leaderboard-search input{flex:1; background:transparent; border:none; color:var(--chalk); font-family:'Inter'; font-size:13px;}
  .leaderboard-search input::placeholder{color:var(--steel);}
  .leaderboard-stats{font-family:'JetBrains Mono'; font-size:11px; color:var(--steel); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .leaderboard-stats b{color:var(--chalk);}
  .leaderboard-progress-bar{width:110px; height:6px; background:var(--asphalt-3); border-radius:3px; overflow:hidden; flex-shrink:0;}
  .leaderboard-progress-fill{height:100%; background:var(--hivis); border-radius:3px; transition:width .3s;}
  .leaderboard-scroll{flex:1; min-height:0; overflow:auto; border:1px solid var(--asphalt-3); border-radius:4px; background:var(--asphalt-2);}
  table.leaderboard-table{border-collapse:collapse; font-family:'JetBrains Mono'; font-size:11.5px; white-space:nowrap; width:100%;}
  table.leaderboard-table th, table.leaderboard-table td{padding:9px 12px; border-bottom:1px solid var(--asphalt-3); text-align:center;}
  table.leaderboard-table thead th{
    position:sticky; top:0; background:var(--asphalt-2); z-index:2;
    text-transform:uppercase; letter-spacing:0.06em; font-size:9.5px; color:var(--hivis-2); font-weight:700;
    border-bottom:2px solid var(--hivis);
  }
  table.leaderboard-table th.lb-cp.optional{color:var(--steel);}
  table.leaderboard-table td.lb-rider, table.leaderboard-table th.lb-rider{
    position:sticky; left:0; z-index:1; background:var(--asphalt-2); text-align:left; box-shadow:2px 0 0 var(--asphalt-3);
  }
  table.leaderboard-table thead th.lb-rider{z-index:3;}
  table.leaderboard-table tbody tr:hover td{background:rgba(255,95,31,0.05);}
  table.leaderboard-table tbody tr.missing{background:rgba(0,0,0,0.18);}
  table.leaderboard-table tbody tr.missing td.lb-rider{background:#1c1e1f;}
  .lb-rank{
    display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; border-radius:50%; font-family:'JetBrains Mono'; font-weight:700; font-size:10px;
    margin-right:8px; flex-shrink:0; vertical-align:middle;
    background:var(--asphalt-3); color:var(--steel);
  }
  .lb-rank.tier-1{background:var(--hivis); color:var(--ink);}

<script>
/* ---------------- state ---------------- */
let state = {
  view: 'dashboard',
  eventsIndex: [],
  currentEvent: null,
  addMode: false,
  editingId: null,
  confirmDeleteCpId: null,
  confirmDeleteEventId: null,

  loading: true,
  storageOk: true,
  checkinBibInput: '',
  checkinActiveBib: null,
  checkinNotFound: false,
  leaderboardSearch: '',
  spokeCardsGenerating: false,
  riderSheetGenerating: false,
  printPopupBlocked: false,
  saveStatus: 'idle',
  qrScannerActive: false,
  qrScanError: '',
  manifestSettingsOpen: false,
  appSettings: {theme: 'feldpost', iconPack: 'emoji'},
  settingsReturnView: 'dashboard',
  newTypeFormOpen: false,
};
let map, markersLayer, routeLine;
let qrScanStream = null;
let qrScanRAF = null;
let liveCountdownInterval = null;
let saveTimeout;
let searchDebounce;
let cpDragState = null;
let searchResultsData = [];

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- toast ---------------- */
function showToast({message, actionLabel, onAction, duration = 6000}){
  const root = document.getElementById('toast-root');
  if(!root) return;
  const toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.innerHTML = `
    <span class="toast-msg">${escapeHtml(message)}</span>
    ${actionLabel ? `<button type="button" class="toast-action"></button>` : ''}
    <button type="button" class="toast-close" aria-label="Schließen">&times;</button>
  `;
  root.appendChild(toastEl);
  let dismissed = false;
  let timer;
  const dismiss = () => {
    if(dismissed) return;
    dismissed = true;
    clearTimeout(timer);
    toastEl.classList.add('toast-out');
    setTimeout(() => toastEl.remove(), 180);
  };
  if(actionLabel && onAction){
    const actionBtn = toastEl.querySelector('.toast-action');
    actionBtn.textContent = actionLabel;
    actionBtn.onclick = () => { onAction(); dismiss(); };
  }
  toastEl.querySelector('.toast-close').onclick = dismiss;
  timer = setTimeout(dismiss, duration);
}

/* ---------------- storage ----------------
   Nutzt window.storage (geteilter Artifact-Speicher), sofern verfügbar.
   Fällt sonst auf eine lokale SQLite-Datenbank zurück (sql.js/WASM, als
   Binär-Blob in IndexedDB persistiert) — nur lokal im Browser, nicht
   geteilt, aber als echte .sqlite-Datei exportier- und importierbar.   */
const hasSharedStorage = !!(window.storage && typeof window.storage.get === 'function');
if(!hasSharedStorage){
  console.warn('window.storage nicht verfügbar — nutze lokalen SQLite-Fallback (nicht geteilt).');
}
let sqlJsModule = null;
let sqlDb = null;
const SQLITE_IDB_DB = 'alleycat-sqlite';
const SQLITE_IDB_STORE = 'files';
const SQLITE_IDB_KEY = 'main';
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SQLITE_IDB_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(SQLITE_IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbLoadBytes(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SQLITE_IDB_STORE, 'readonly');
      const req = tx.objectStore(SQLITE_IDB_STORE).get(SQLITE_IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ console.error('IndexedDB-Lesen fehlgeschlagen', e); return null; }
}
async function idbSaveBytes(bytes){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(SQLITE_IDB_STORE, 'readwrite');
      tx.objectStore(SQLITE_IDB_STORE).put(bytes, SQLITE_IDB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error('IndexedDB-Schreiben fehlgeschlagen', e); }
}
async function persistSqlDb(){
  if(!sqlDb) return;
  await idbSaveBytes(sqlDb.export());
}
async function initSqliteStorage(){
  if(hasSharedStorage || sqlDb) return;
  sqlJsModule = await initSqlJs({
    locateFile: file => 'https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/' + file
  });
  const existingBytes = await idbLoadBytes();
  sqlDb = existingBytes ? new sqlJsModule.Database(existingBytes) : new sqlJsModule.Database();
  sqlDb.run('CREATE TABLE IF NOT EXISTS kv (key TEXT PRIMARY KEY, value TEXT)');
  if(!existingBytes) await persistSqlDb();
}
async function storageGet(key){
  if(hasSharedStorage){
    try{ return await window.storage.get(key, true); }
    catch(e){ console.error('storage.get failed', e); return null; }
  }
  try{
    const stmt = sqlDb.prepare('SELECT value FROM kv WHERE key = ?');
    stmt.bind([key]);
    const row = stmt.step() ? stmt.getAsObject() : null;
    stmt.free();
    return row ? {value: row.value} : null;
  }catch(e){ console.error('sqlite get failed', e); return null; }
}
async function storageSet(key, value){
  if(hasSharedStorage){
    try{ await window.storage.set(key, value, true); return true; }
    catch(e){ console.error('storage.set failed', e); return false; }
  }
  try{
    sqlDb.run('INSERT INTO kv (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value', [key, value]);
    await persistSqlDb();
    return true;
  }catch(e){ console.error('sqlite set failed', e); return false; }
}
async function storageDelete(key){
  if(hasSharedStorage){
    try{ await window.storage.delete(key, true); return; }
    catch(e){ console.error('storage.delete failed', e); }
    return;
  }
  try{
    sqlDb.run('DELETE FROM kv WHERE key = ?', [key]);
    await persistSqlDb();
  }catch(e){ console.error('sqlite delete failed', e); }
}
function exportSqliteFile(){
  if(!sqlDb) return;
  const blob = new Blob([sqlDb.export()], {type: 'application/x-sqlite3'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'alleycat-dispatch.sqlite';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function onImportSqliteFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const bytes = new Uint8Array(await file.arrayBuffer());
    const db = new sqlJsModule.Database(bytes);
    db.run('CREATE TABLE IF NOT EXISTS kv (key TEXT PRIMARY KEY, value TEXT)');
    sqlDb = db;
    await persistSqlDb();
    input.value = '';
    await loadEventsIndex();
    goDashboard();
    render();
  }catch(e){
    console.error('sqlite import failed', e);
    alert('Import fehlgeschlagen: Die Datei ist keine gültige Alleycat-Dispatch-SQLite-Datenbank.');
    input.value = '';
  }
}
async function loadEventsIndex(){
  try{
    const res = await storageGet('events:index');
    state.eventsIndex = res ? JSON.parse(res.value) : [];
  }catch(e){ state.eventsIndex = []; }
}
async function saveEventsIndex(){
  setSaveStatus('saving');
  const ok = await storageSet('events:index', JSON.stringify(state.eventsIndex));
  setSaveStatus(ok ? 'saved' : 'error');
}
async function loadEvent(id){
  try{
    const res = await storageGet('event:' + id);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function saveCurrentEvent(){
  if(!state.currentEvent) return;
  setSaveStatus('saving');
  const ok = await storageSet('event:' + state.currentEvent.id, JSON.stringify(state.currentEvent));
  setSaveStatus(ok ? 'saved' : 'error');
}
function debouncedSave(){
  setSaveStatus('pending');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveCurrentEvent, 450);
}
function flushPendingSave(){
  if(saveTimeout){
    clearTimeout(saveTimeout);
    saveTimeout = null;
    saveCurrentEvent();
  }
  if(window.__idxSaveTimeout){
    clearTimeout(window.__idxSaveTimeout);
    window.__idxSaveTimeout = null;
    saveEventsIndex();
  }
}
window.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushPendingSave();
});
window.addEventListener('beforeunload', flushPendingSave);
function setSaveStatus(status){
  state.saveStatus = status;
  const el = document.getElementById('save-status');
  if(!el) return;
  el.className = 'save-status ' + status;
  el.textContent = status === 'pending' ? 'Ungespeicherte Änderungen…'
    : status === 'saving' ? 'Speichert…'
    : status === 'saved' ? 'Gespeichert'
    : status === 'error' ? 'Fehler beim Speichern — Änderung evtl. verloren'
    : '';
}

/* ---------------- init ---------------- */
async function init(){
  await initSqliteStorage();
  await loadAppSettings();
  applyAppSettings();
  await loadCustomCheckpointTypes();
  await loadEventsIndex();
  state.loading = false;
  render();
}

/* ---------------- navigation ---------------- */
function goDashboard(){
  state.view = 'dashboard';
  state.currentEvent = null;
  state.addMode = false;
  state.editingId = null;
  render();
}
async function openEditor(id){
  flushPendingSave();
  state.loading = true; state.view = 'editor'; render();
  const evt = await loadEvent(id);
  state.currentEvent = withEventDefaults(evt || {id, name:'Unbenanntes Event', date:'', checkpoints:[]});
  state.loading = false;
  render();
  setTimeout(() => { initMap(); initSidebarResize(); applySidebarWidth(); }, 30);
}
function openManifest(){
  state.view = 'manifest';
  render();
}
function openRiders(){
  state.view = 'riders';
  render();
}
function openCheckin(){
  state.view = 'checkin';
  state.checkinBibInput = '';
  state.checkinActiveBib = null;
  state.checkinNotFound = false;
  render();
  startLiveCountdown();
}
function openLeaderboard(){
  state.view = 'leaderboard';
  state.leaderboardSearch = '';
  render();
}
function withCheckpointDefaults(cp){
  return Object.assign({
    clue: '',
    mandatory: true,
    type: CHECKPOINT_TYPES[0].key,
    customQuestion: '',
    punchCode: '',
    timeWindowEnabled: false,
    timeWindowStart: '',
    timeWindowEnd: ''
  }, cp);
}
function withRiderDefaults(rider){
  return Object.assign({
    name: '',
    finishTime: '',
    completed: [],
    scores: {},
    checkpointTimes: {}
  }, rider);
}
function withManifestSettingsDefaults(ms){
  return Object.assign({
    showNr: true,
    showCheckpoint: true,
    showTyp: true,
    showClue: true,
    showKoordinaten: true,
    showPunch: true,
    headerImage: '',
    headerImageWidth: 0,
    headerImageHeight: 0
  }, ms);
}
function withEventDefaults(evt){
  const merged = Object.assign({
    startMode: 'manual',
    startTime: '',
    curfewMode: 'hard',
    curfewTime: '',
    curfewPenaltyPerMin: 1,
    expectedRiders: 0,
    checkpoints: [],
    riders: [],
    spokeCardImage: '',
    manifestSettings: {}
  }, evt);
  merged.checkpoints = (merged.checkpoints || []).map(withCheckpointDefaults);
  merged.riders = (merged.riders || []).map(withRiderDefaults);
  merged.manifestSettings = withManifestSettingsDefaults(merged.manifestSettings);
  return merged;
}

/* ---------------- events crud ---------------- */
async function createNewEvent(){
  const id = uid('evt');
  const evt = withEventDefaults({id, name:'Neues Alleycat', date:'', description:'', checkpoints:[]});
  state.eventsIndex.push({id, name:evt.name, date:evt.date});
  await saveEventsIndex();
  state.currentEvent = evt;
  await saveCurrentEvent();
  await loadEventsIndex();
  openEditor(id);
}
function askDeleteEvent(id){
  state.confirmDeleteEventId = id;
  render();
}
async function confirmDeleteEvent(id){
  state.eventsIndex = state.eventsIndex.filter(e => e.id !== id);
  await saveEventsIndex();
  await storageDelete('event:' + id);
  state.confirmDeleteEventId = null;
  render();
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exportEventJSON(id){
  const evt = state.currentEvent && state.currentEvent.id === id ? state.currentEvent : await loadEvent(id);
  if(!evt) return;
  const filename = (evt.name || 'event').replace(/\s+/g, '_').toLowerCase() + '-backup.json';
  downloadJSON(evt, filename);
}
async function onImportEventFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.checkpoints)){
      throw new Error('invalid shape');
    }
    const newId = uid('evt');
    const evt = withEventDefaults(Object.assign({}, parsed, {id: newId}));
    state.eventsIndex.push({id: newId, name: evt.name || 'Importiertes Event', date: evt.date || ''});
    await saveEventsIndex();
    setSaveStatus('saving');
    const ok = await storageSet('event:' + newId, JSON.stringify(evt));
    setSaveStatus(ok ? 'saved' : 'error');
    input.value = '';
    openEditor(newId);
  }catch(e){
    alert('Import fehlgeschlagen: Die Datei ist kein gültiges Alleycat-Dispatch-Event (JSON).');
    input.value = '';
  }
}

/* ---------------- map ---------------- */
function initMap(){
  const container = document.getElementById('map');
  if(!container) return;
  if(!map){
    map = L.map('map', {zoomControl:true}).setView([50.1109, 8.6821], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20,
      detectRetina: true
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
    map.on('click', onMapClick);
  } else {
    map.invalidateSize();
  }
  const legendTypes = document.getElementById('map-legend-types');
  if(legendTypes) legendTypes.innerHTML = CHECKPOINT_TYPES.map(t => `${typeIconHtml(t.key)} ${t.shortLabel}`).join(' &middot; ');
  redrawMarkers();
  fitToCheckpoints();
}
function fitToCheckpoints(){
  if(!map || !state.currentEvent || !state.currentEvent.checkpoints.length) return;
  const bounds = L.latLngBounds(state.currentEvent.checkpoints.map(c => [c.lat, c.lng]));
  map.fitBounds(bounds.pad(0.25));
}

/* ---------------- sidebar resize ---------------- */
const SIDEBAR_MIN = 280, SIDEBAR_MAX = 640, SIDEBAR_BREAKPOINT = 820;
function applySidebarWidth(){
  const sidebar = document.getElementById('sidebar');
  if(!sidebar) return;
  if(window.innerWidth <= SIDEBAR_BREAKPOINT){ sidebar.style.width = ''; return; }
  let saved = 340;
  try{
    const v = parseInt(localStorage.getItem('alleycat:sidebarWidth'), 10);
    if(!isNaN(v)) saved = v;
  }catch(e){}
  sidebar.style.width = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, saved)) + 'px';
}
function setSidebarWidth(px){
  const sidebar = document.getElementById('sidebar');
  if(!sidebar) return;
  const clamped = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, px));
  sidebar.style.width = clamped + 'px';
  try{ localStorage.setItem('alleycat:sidebarWidth', String(clamped)); }catch(e){}
  if(map) map.invalidateSize();
}
function initSidebarResize(){
  const handle = document.getElementById('sidebar-resize-handle');
  if(!handle || handle.dataset.bound) return;
  handle.dataset.bound = '1';
  let dragging = false;
  handle.addEventListener('pointerdown', (e) => {
    if(window.innerWidth <= SIDEBAR_BREAKPOINT) return;
    dragging = true;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  });
  handle.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const viewEditor = document.getElementById('view-editor');
    const rect = viewEditor.getBoundingClientRect();
    setSidebarWidth(rect.right - e.clientX);
  });
  function stopDrag(e){
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
  }
  handle.addEventListener('pointerup', stopDrag);
  handle.addEventListener('pointercancel', stopDrag);
  window.addEventListener('resize', () => {
    if(state.view === 'editor'){
      applySidebarWidth();
      if(map) map.invalidateSize();
    }
  });
}
function onMapClick(e){
  if(!state.addMode || !state.currentEvent) return;
  const order = state.currentEvent.checkpoints.length + 1;
  const cp = {
    id: uid('cp'),

async function loadCustomCheckpointTypes(){

    const res = await storageGet('checkpointTypes:custom');
    const custom = res ? JSON.parse(res.value) : [];
    CHECKPOINT_TYPES = [...CHECKPOINT_TYPES.filter(t => BUILTIN_CHECKPOINT_TYPE_KEYS.includes(t.key)), ...custom];
  }catch(e){ /* keep builtins only */ }
}
async function saveCustomCheckpointTypes(){
  const custom = CHECKPOINT_TYPES.filter(t => !BUILTIN_CHECKPOINT_TYPE_KEYS.includes(t.key));
  await storageSet('checkpointTypes:custom', JSON.stringify(custom));
}
function slugifyTypeKey(label){
  let base = 'custom-' + String(label).toLowerCase()
    .replace(/[\u00e4\u00f6\u00fc]/g, c => ({\u00e4: 'ae', \u00f6: 'oe', \u00fc: 'ue'}[c]))
    .replace(/\u00df/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
  if(base === 'custom-' || base === 'custom') base = 'custom-typ';
  let key = base, i = 2;
  while(CHECKPOINT_TYPES.some(t => t.key === key)){ key = base + '-' + i; i++; }
  return key;
}

  state.newTypeFormOpen = !state.newTypeFormOpen;

function addCustomCheckpointType(){
  const icon = (document.getElementById('newtype-icon').value || '').trim() || '\ud83d\udccd';
  const shortLabel = (document.getElementById('newtype-short').value || '').trim().toUpperCase();
  const label = (document.getElementById('newtype-label').value || '').trim();
  const hasCustomQuestion = document.getElementById('newtype-question').checked;
  const isScored = document.getElementById('newtype-scored').checked;
  const scoreMax = isScored ? (parseInt(document.getElementById('newtype-scoremax').value, 10) || 10) : 0;
  if(!label){ alert('Bitte einen Namen f\u00fcr den Checkpoint-Typ angeben.'); return; }
  const key = slugifyTypeKey(shortLabel || label);
  const manifestCell = isScored ? 'score-line' : (hasCustomQuestion ? 'answer-line' : 'punch-box');
  CHECKPOINT_TYPES.push({
    key, icon, shortLabel: (shortLabel || label.toUpperCase()).slice(0, 14), fullLabel: label,
    dropdownLabel: label, referenceFieldLabel: 'Referenz-Code',
    hasCustomQuestion, isScored, scoreMax, manifestCell
  });
  saveCustomCheckpointTypes();
  state.newTypeFormOpen = false;
  renderSettings();
}

  renderSettings();
}

function redrawMarkers(){
  if(!markersLayer || !state.currentEvent) return;
  markersLayer.clearLayers();
  // Leaflet 1.9.x leaves permanent-tooltip DOM nodes behind when their marker
  // is removed via a LayerGroup — clean them up explicitly to avoid duplicates.
  document.querySelectorAll('.leaflet-tooltip.cp-time-tooltip').forEach(el => el.remove());
  state.currentEvent.checkpoints.forEach((cp, idx) => {
    const rot = idx % 2 === 0 ? -5 : 4;
    const icon = L.divIcon({
      className:'',
      html: `<div class="cp-marker ${cp.mandatory ? '' : 'optional'}" style="transform:rotate(${rot}deg);">${cp.order}<span class="cp-marker-type">${typeIconHtml(cp.type)}</span></div>`,
      iconSize:[32,32], iconAnchor:[16,16]
    });
    const marker = L.marker([cp.lat, cp.lng], {icon, draggable:true});
    marker.on('click', () => { state.editingId = cp.id; renderSidebar(); });
    marker.on('dragend', (ev) => {
      const pos = ev.target.getLatLng();
      cp.lat = pos.lat; cp.lng = pos.lng;
      debouncedSave();
      renderSidebar();
    });
    if(cp.timeWindowEnabled){
      marker.bindTooltip(`${formatTimeOnly(cp.timeWindowStart)}–${formatTimeOnly(cp.timeWindowEnd)}`, {
        permanent: true, direction: 'top', offset: [0, -18], className: 'cp-time-tooltip'
      });
    }
    marker.addTo(markersLayer);
  });

  if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
  const ordered = [...state.currentEvent.checkpoints].sort((a,b) => a.order - b.order);
  if(ordered.length > 1){
    routeLine = L.polyline(ordered.map(c => [c.lat, c.lng]), {
      color: '#ff5f1f',
      weight: 3,
      dashArray: '7 7',
      opacity: 0.8,
      lineJoin: 'round'
    }).addTo(map);
    routeLine.bringToBack();
  }
}

function onSearchInput(value){
  clearTimeout(searchDebounce);
  document.getElementById('map-search-clear').style.display = value ? 'inline-block' : 'none';
  const q = value.trim();
  if(q.length < 3){
    searchResultsData = [];

    return;
  }
  renderSearchResults(true);

}
async function performSearch(query){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&q=' + encodeURIComponent(query);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    searchResultsData = Array.isArray(data) ? data : [];
  }catch(e){
    console.error('Ortssuche fehlgeschlagen', e);
    searchResultsData = [];
  }
  renderSearchResults(false);
}
function renderSearchResults(isLoading){
  const el = document.getElementById('map-search-results');
  if(!el) return;
  if(isLoading){
    el.style.display = 'block';
    el.innerHTML = `<div class="map-search-loading">Suche \u2026</div>`;
    return;
  }
  if(!searchResultsData.length){
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = searchResultsData.map((r, i) => `
    <div class="map-search-result" onclick="selectSearchResult(${i})">${escapeHtml(r.display_name)}</div>
  `).join('');
}

function onCpDragStart(e, id){
  e.stopPropagation();
  if(e.button) return;
  const row = e.target.closest('.cp-row');
  const list = document.querySelector('.cp-list');
  if(!row || !list) return;
  cpDragState = {row, list};
  row.classList.add('dragging');
  row.setPointerCapture(e.pointerId);
  row.addEventListener('pointermove', onCpDragMove);
  row.addEventListener('pointerup', onCpDragEnd);
  row.addEventListener('pointercancel', onCpDragEnd);
}
function onCpDragMove(e){
  if(!cpDragState) return;
  const {row, list} = cpDragState;
  const listRect = list.getBoundingClientRect();
  const edgeZone = 36;
  if(e.clientY < listRect.top + edgeZone) list.scrollTop -= 10;
  else if(e.clientY > listRect.bottom - edgeZone) list.scrollTop += 10;

  const siblings = Array.from(list.querySelectorAll('.cp-row')).filter(r => r !== row);
  let target = null;
  for(const sibling of siblings){
    const rect = sibling.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if(e.clientY < mid){ target = sibling; break; }
  }
  if(target){
    if(row.nextElementSibling !== target) list.insertBefore(row, target);
  } else if(list.lastElementChild !== row){
    list.appendChild(row);
  }
}
function onCpDragEnd(e){
  if(!cpDragState) return;
  const {row, list} = cpDragState;
  row.classList.remove('dragging');
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  row.removeEventListener('pointermove', onCpDragMove);
  row.removeEventListener('pointerup', onCpDragEnd);
  row.removeEventListener('pointercancel', onCpDragEnd);
  cpDragState = null;

  const newOrderIds = Array.from(list.querySelectorAll('.cp-row')).map(r => r.dataset.cpId);
  const cps = state.currentEvent.checkpoints;
  const byId = new Map(cps.map(c => [c.id, c]));
  const reordered = newOrderIds.map(id => byId.get(id)).filter(Boolean);
  if(reordered.length !== cps.length){ renderSidebar(); return; }
  reordered.forEach((c, i) => c.order = i + 1);
  state.currentEvent.checkpoints = reordered;
  debouncedSave();
  renderSidebar();
  redrawMarkers();
}

  const list = state.currentEvent.checkpoints;
  const idx = list.findIndex(c => c.id === id);
  const swap = idx + dir;
  if(swap < 0 || swap >= list.length) return;
  [list[idx], list[swap]] = [list[swap], list[idx]];
  list.forEach((c,i) => c.order = i+1);
  debouncedSave();
  renderSidebar();
  redrawMarkers();
}

function onSpokeCardImageUpload(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const targetAspect = 63.5 / 88.9;
      const srcAspect = img.width / img.height;
      let sx, sy, sw, sh;
      if(srcAspect > targetAspect){
        sh = img.height; sw = sh * targetAspect; sx = (img.width - sw) / 2; sy = 0;
      } else {
        sw = img.width; sh = sw / targetAspect; sx = 0; sy = (img.height - sh) / 2;
      }
      const outW = 750, outH = Math.round(outW / targetAspect);
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
      state.currentEvent.spokeCardImage = canvas.toDataURL('image/jpeg', 0.88);
      debouncedSave();
      renderRiders();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
}

function computeCardGrid(pageW, pageH, cardW, cardH, marginX, marginY, gapX, gapY){
  const cols = Math.max(1, Math.floor((pageW - marginX * 2 + gapX) / (cardW + gapX)));
  const rows = Math.max(1, Math.floor((pageH - marginY * 2 + gapY) / (cardH + gapY)));
  const perPage = cols * rows;
  const gridW = cols * cardW + (cols - 1) * gapX;
  const offsetX = marginX + Math.max(0, (pageW - marginX * 2 - gridW) / 2);
  const pos = (i) => {
    const idx = i % perPage;
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    return {x: offsetX + col * (cardW + gapX), y: marginY + row * (cardH + gapY)};
  };
  return {cols, rows, perPage, pos};
}
async function buildSpokeCardsDoc(evt){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const cardW = 63.5, cardH = 88.9;
  const {perPage, pos} = computeCardGrid(210, 297, cardW, cardH, 10, 8, 6, 5);

  const riders = evt.riders;
  riders.forEach((r, i) => {
    if(i > 0 && i % perPage === 0) doc.addPage();
    const {x, y} = pos(i);
    drawSpokeCardFront(doc, x, y, cardW, cardH, evt, r);
  });

  doc.addPage();
  for(let i = 0; i < riders.length; i++){
    if(i > 0 && i % perPage === 0) doc.addPage();
    const {x, y} = pos(i);
    const qr = await renderQrDataUrl(String(riders[i].bib), 300);
    drawSpokeCardBack(doc, x, y, cardW, cardH, evt, riders[i], qr);
  }
  return doc;
}

let audioCtx = null;
function playConfirmFeedback(){
  if(navigator.vibrate){ try{ navigator.vibrate(120); }catch(e){} }
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }catch(e){ /* Web Audio nicht verfügbar */ }
}

/* ---------------- live countdown ---------------- */
function formatCountdown(ms){
  const sign = ms < 0 ? '-' : '';
  ms = Math.abs(ms);
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return sign + (h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s));
}
function updateLiveCountdown(){
  if(state.view !== 'checkin'){ stopLiveCountdown(); return; }
  const el = document.getElementById('live-countdown');
  if(!el || !state.currentEvent) return;
  const evt = state.currentEvent;
  const now = new Date();
  let text = '', cls = '';

  if(evt.startMode === 'scheduled' && evt.startTime){
    const start = new Date(evt.startTime);
    if(!isNaN(start.getTime()) && now < start){
      text = 'Start in ' + formatCountdown(start - now);
      cls = 'start';
    }
  }
  if(!text && evt.curfewTime){
    const curfew = new Date(evt.curfewTime);
    if(!isNaN(curfew.getTime())){
      if(now < curfew){
        text = 'Curfew in ' + formatCountdown(curfew - now);
        cls = 'curfew';
      } else if(evt.curfewMode === 'soft'){
        text = formatCountdown(now - curfew) + ' über Curfew';
        cls = 'over';
      } else {
        text = 'Curfew erreicht — Rennen beendet';
        cls = 'over';
      }
    }
  }
  el.textContent = text;
  el.className = 'live-countdown' + (cls ? ' ' + cls : '');
}
function startLiveCountdown(){
  stopLiveCountdown();
  updateLiveCountdown();
  liveCountdownInterval = setInterval(updateLiveCountdown, 1000);
}
function stopLiveCountdown(){
  if(liveCountdownInterval){ clearInterval(liveCountdownInterval); liveCountdownInterval = null; }
}

/* ---------------- QR camera scan ---------------- */
async function startQrScan(){
  state.qrScanError = '';
  state.qrScannerActive = true;
  renderCheckin();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.qrScanError = 'Kamera-Zugriff wird von diesem Browser oder dieser Umgebung nicht unterstützt.';
    renderCheckin();
    return;
  }
  if(typeof jsQR !== 'function'){
    state.qrScanError = 'QR-Scan-Bibliothek konnte nicht geladen werden.';
    renderCheckin();
    return;
  }
  try{
    qrScanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
  }catch(e){
    state.qrScanError = 'Kein Zugriff auf die Kamera. Bitte Berechtigung erlauben und erneut versuchen, oder Bib-Nummer manuell eingeben.';
    renderCheckin();
    return;
  }
  const video = document.getElementById('qr-scan-video');
  if(!video){ stopQrScan(); return; }
  video.srcObject = qrScanStream;
  try{ await video.play(); }catch(e){}

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  function tick(){
    if(!qrScanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        onQrScanSuccess(code.data);
        return;
      }
    }
    qrScanRAF = requestAnimationFrame(tick);
  }
  qrScanRAF = requestAnimationFrame(tick);
}
function stopQrScan(){
  if(qrScanRAF){ cancelAnimationFrame(qrScanRAF); qrScanRAF = null; }
  if(qrScanStream){
    qrScanStream.getTracks().forEach(t => t.stop());
    qrScanStream = null;
  }
  state.qrScannerActive = false;
  state.qrScanError = '';
  renderCheckin();
}
function onQrScanSuccess(data){
  stopQrScan();
  state.checkinBibInput = String(data).trim();
  findCheckinRider();
}

function computeCurfewResult(evt, finishTimeValue){
  if(!evt.curfewTime || !finishTimeValue) return null;
  const finish = new Date(finishTimeValue);
  const curfew = new Date(evt.curfewTime);
  if(isNaN(finish.getTime()) || isNaN(curfew.getTime())) return null;
  const diffMin = Math.round((finish - curfew) / 60000);
  if(diffMin <= 0) return {onTime: true, diffMin: 0, penalty: 0};
  if(evt.curfewMode === 'soft') return {onTime: false, diffMin, penalty: Math.round(diffMin * (evt.curfewPenaltyPerMin ?? 1))};
  return {onTime: false, diffMin, penalty: null};
}
function riderStatusBadgeHtml(evt, rider){
  if(!rider.finishTime) return `<span class="lb-status missing">Fehlt</span>`;
  const curfew = computeCurfewResult(evt, rider.finishTime);
  if(!curfew || curfew.onTime) return `<span class="lb-status arrived">Im Ziel</span>`;
  if(evt.curfewMode === 'soft') return `<span class="lb-status warn">+${curfew.penalty} Strafmin.</span>`;
  return `<span class="lb-status danger">Cutoff</span>`;
}
function sortRidersForOverview(riders){
  return riders.slice().sort((a, b) => {
    if(!!a.finishTime !== !!b.finishTime) return a.finishTime ? -1 : 1;
    if(a.finishTime && b.finishTime) return new Date(a.finishTime) - new Date(b.finishTime);
    return a.bib - b.bib;
  });
}
function computeTimeWindowResult(cp, timeValue){
  if(!cp.timeWindowEnabled || !timeValue) return null;
  const t = new Date(timeValue);
  if(isNaN(t.getTime())) return null;
  const start = cp.timeWindowStart ? new Date(cp.timeWindowStart) : null;
  const end = cp.timeWindowEnd ? new Date(cp.timeWindowEnd) : null;
  if(start && !isNaN(start.getTime()) && t < start) return {ok: false, reason: 'early'};
  if(end && !isNaN(end.getTime()) && t > end) return {ok: false, reason: 'late'};
  return {ok: true};
}

function onManifestImageUpload(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const outW = Math.round(img.width * scale);
      const outH = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, outW, outH);
      const ms = state.currentEvent.manifestSettings;
      ms.headerImage = canvas.toDataURL('image/jpeg', 0.85);
      ms.headerImageWidth = outW;
      ms.headerImageHeight = outH;
      debouncedSave();
      renderManifest();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
}

      doc.text(String(cp.order).padStart(2,'0'), colX.nr, y);
    }
    if(colX.checkpoint !== undefined){
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.setTextColor(INK);
      doc.text(cp.name || '\u2014', colX.checkpoint, y, {maxWidth: colW.checkpoint - (cp.mandatory ? 6 : 38)});
      if(!cp.mandatory){
        const badgeW = 34, badgeX = colX.checkpoint + colW.checkpoint - badgeW - 2, badgeY = y - 8;
        doc.setDrawColor(STEEL); doc.setLineWidth(0.6);
        doc.roundedRect(badgeX, badgeY, badgeW, 11, 2, 2, 'S');
        doc.setFont('helvetica','bold'); doc.setFontSize(6);
        doc.setTextColor(STEEL);
        doc.text('BONUS', badgeX + badgeW / 2, badgeY + 7.5, {align: 'center'});
      }
    }
    if(colX.typ !== undefined){
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      const badgeW = Math.min(colW.typ - 4, Math.max(...typLines.map(l => doc.getTextWidth(l))) + 8);
      const badgeH = 8 * typLines.length + 4;
      doc.setDrawColor(LINE); doc.setLineWidth(0.5);
      doc.roundedRect(colX.typ, y - 8, badgeW, badgeH, 2, 2, 'S');
      doc.setTextColor(STEEL);
      doc.text(typLines, colX.typ + 4, y);
    }
    if(colX.clue !== undefined){
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.setTextColor(INK);
      doc.text(cp.clue || '\u2014', colX.clue, y, {maxWidth: colW.clue - 6});
    }
    if(colX.koordinaten !== undefined){
      doc.setFont('courier','normal'); doc.setFontSize(7.5);
      doc.setTextColor(STEEL);
      doc.text(cp.lat.toFixed(5) + ', ' + cp.lng.toFixed(5), colX.koordinaten, y);
    }
    if(colX.punch !== undefined){
      const px = colX.punch;
      const punchType = getCheckpointType(cp.type);
      doc.setDrawColor(INK);
      if(punchType.manifestCell === 'answer-line'){
        doc.setLineWidth(0.6); doc.setLineDash([1.5, 1.5], 0);
        doc.line(px, y + 5, px + Math.min(colW.punch - 6, 36), y + 5);
        doc.setLineDash([], 0);
      } else if(punchType.manifestCell === 'score-line'){
        doc.setFont('courier', 'normal'); doc.setFontSize(8);
        doc.setTextColor(INK);
        doc.text('___ / ' + punchType.scoreMax, px, y + 2);
      } else {
        doc.setLineWidth(0.8);
        doc.rect(px, y - 8, 13, 13);
      }
    }
    y += rowHeight + 6;
  });

  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.setTextColor(STEEL);
  doc.text('ALLEYCAT DISPATCH', marginX, 806);
  doc.text('Automatisch generiert aus den Checkpoints', pageRight, 806, {align: 'right'});

  doc.save((evt.name || 'manifest').replace(/\s+/g,'_').toLowerCase() + '-manifest.pdf');
}

  document.getElementById('view-checkin').classList.toggle('active', state.view === 'checkin');
  document.getElementById('view-leaderboard').classList.toggle('active', state.view === 'leaderboard');

  if(state.view === 'editor') renderSidebar();

function renderTopbar(){
  const sub = document.getElementById('topbar-sub');
  const actions = document.getElementById('topbar-actions');
  const bottomNav = document.getElementById('bottom-nav');

  if(state.view === 'settings'){
    sub.textContent = 'Einstellungen';
    actions.innerHTML = `<button class="btn btn-ghost" onclick="closeSettings()">&larr; Zurück</button>`;
    bottomNav.innerHTML = '';
    return;
  }

  if(state.view === 'dashboard' || !state.currentEvent){
    sub.textContent = 'Organizer Backend';
    actions.innerHTML = '';
    bottomNav.innerHTML = '';
    return;

  sub.textContent = state.currentEvent.name || 'Unbenanntes Event';

    `<button class="btn ${state.view === item.view ? 'btn-primary' : ''}" onclick="${item.onclick(evtId)}">${item.label}</button>`;

        ${state.addMode ? '\u25CF Checkpoint setzen (aktiv)' : 'Checkpoint setzen'}
      </button>
      <div class="addmode-hint">${state.addMode ? 'Klick auf die Karte, um einen Checkpoint zu platzieren. Marker sind verschiebbar.' : 'Aktivieren, dann per Klick auf die Karte Checkpoints anlegen.'}</div>
    </div>

function exportRouteGPX(){
  const evt = state.currentEvent;
  if(!evt || !evt.checkpoints.length){ alert('Keine Checkpoints zum Exportieren.'); return; }
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const cps = evt.checkpoints.slice().sort((a, b) => a.order - b.order);
  const wpts = cps.map(cp => `  <wpt lat="${cp.lat}" lon="${cp.lng}">
    <name>${esc(String(cp.order).padStart(2, '0') + ' ' + (cp.name || typeFullLabel(cp.type)))}</name>
    <desc>${esc((cp.mandatory ? 'Pflicht' : 'Bonus') + (cp.clue ? ' — ' + cp.clue : ''))}</desc>
    <sym>Flag</sym>
  </wpt>`).join('\n');
  const rtepts = cps.map(cp => `    <rtept lat="${cp.lat}" lon="${cp.lng}"><name>${esc(cp.name || String(cp.order))}</name></rtept>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Alleycat Dispatch" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><name>${esc(evt.name || 'Alleycat')}</name></metadata>
${wpts}
  <rte>
    <name>${esc(evt.name || 'Alleycat')} — Route</name>
${rtepts}
  </rte>
</gpx>`;
  const blob = new Blob([gpx], {type: 'application/gpx+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (evt.name || 'route').replace(/\s+/g, '_').toLowerCase() + '.gpx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
