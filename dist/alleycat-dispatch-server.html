<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLEYCAT DISPATCH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --asphalt:#17191a;
    --asphalt-2:#212425;
    --asphalt-3:#2b2f31;
    --paper:#eee5cd;
    --paper-2:#e4d9bb;
    --paper-line:#c9bc95;
    --paper-muted:#6b6248;
    --ink:#241f18;
    --hivis:#ff5f1f;
    --hivis-2:#ff8a3d;
    --stamp:#b23a2e;
    --steel:#7c8388;
    --chalk:#f3f1e8;
    --ok:#5c8a5c;
    --warn:#d9a406;
    --tile-underway-bg:#5a4334;
    --tile-finished-bg:#36433a;
    --tile-alert-bg:#4b3230;
  }
  :root[data-theme="hell"]{
    --asphalt:#f4f1ea; --asphalt-2:#ffffff; --asphalt-3:#e3ddc9;
    --paper:#fffdf7; --paper-2:#f7f2e4; --paper-line:#d8cdae; --paper-muted:#7d735a;
    --ink:#241f18; --hivis:#e0551c; --hivis-2:#ff7a33; --stamp:#b23a2e;
    --steel:#8c8371; --chalk:#241f18; --ok:#3f7a3f;
    --warn:#8a6404;
    --tile-underway-bg:#e9c7a8; --tile-finished-bg:#bfc7ab; --tile-alert-bg:#d7b6a4;
  }
  :root[data-theme="dunkel"]{
    --asphalt:#121212; --asphalt-2:#1a1a1a; --asphalt-3:#262626;
    --paper:#1e1e1e; --paper-2:#252525; --paper-line:#3a3a3a; --paper-muted:#a8a398;
    --ink:#e8e6df; --hivis:#5b8cff; --hivis-2:#7ea5ff; --stamp:#e05a4e;
    --steel:#8a8f93; --chalk:#f0efe9; --ok:#5c8a5c;
    --warn:#d9a406;
    --tile-underway-bg:#394256; --tile-finished-bg:#323c32; --tile-alert-bg:#533230;
  }
  :root[data-theme="dracula"]{
    --asphalt:#282a36; --asphalt-2:#21222c; --asphalt-3:#383a4c;
    --paper:#2b2d3a; --paper-2:#323445; --paper-line:#44475a; --paper-muted:#9a97b3;
    --ink:#f8f8f2; --hivis:#ff79c6; --hivis-2:#bd93f9; --stamp:#ff5555;
    --steel:#6272a4; --chalk:#f8f8f2; --ok:#50fa7b;
    --warn:#d9a406;
    --tile-underway-bg:#554e72; --tile-finished-bg:#3d6456; --tile-alert-bg:#68404e;
  }
  :root[data-theme="outdoor"]{
    --asphalt:#ffffff; --asphalt-2:#ffffff; --asphalt-3:#e6e6e6;
    --paper:#ffffff; --paper-2:#f2f2f2; --paper-line:#000000; --paper-muted:#595959;
    --ink:#000000; --hivis:#ffcc00; --hivis-2:#e0ac00; --stamp:#b30000;
    --steel:#4d4d4d; --chalk:#000000; --ok:#006600;
    --warn:#7a5c00;
    --tile-underway-bg:#ffe0b3; --tile-finished-bg:#c8f0c8; --tile-alert-bg:#ffd0d0;
  }

  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--asphalt);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{height:100vh; display:flex; flex-direction:column;}

  ::selection{background:var(--hivis); color:var(--ink);}
  :focus-visible{outline:2px solid var(--hivis); outline-offset:2px;}

  h1,h2,h3,.display{
    font-family:'Inter', 'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:14px 20px;
    background:var(--asphalt-2);
    border-bottom:3px solid var(--hivis);
    flex-shrink:0;
    z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--stamp);
    border:2px solid var(--chalk);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:14px;
    transform:rotate(-6deg);
    flex-shrink:0;
  }
  .brand h1{font-size:20px; font-weight:700; color:var(--chalk);}
  .brand span.sub{display:block; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--steel); letter-spacing:0.12em; text-transform:uppercase; margin-top:1px;}
  .topbar-spacer{flex:1;}
  .topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .bottom-nav{display:none;}
  .save-status{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    white-space:nowrap; opacity:0; transition:opacity .15s;
  }
  .save-status.pending{opacity:1; color:var(--steel);}
  .save-status.saving{opacity:1; color:var(--steel);}
  .save-status.saved{opacity:1; color:var(--ok);}
  .save-status.error{opacity:1; color:var(--stamp); font-weight:700;}

  #toast-root{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px; z-index:2000;
    width:min(420px, calc(100vw - 32px)); pointer-events:none;
  }
  .toast{
    pointer-events:auto;
    display:flex; align-items:center; gap:12px;
    background:var(--asphalt-3); border:1px solid var(--paper-line);
    border-left:3px solid var(--hivis); border-radius:6px;
    padding:11px 12px 11px 14px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:toast-in .18s ease-out;
  }
  .toast.toast-out{animation:toast-out .18s ease-in forwards;}
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes toast-out{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(8px);}}
  .toast-msg{flex:1; font-family:'Inter',sans-serif; font-size:13.5px; color:var(--chalk); min-width:0;}
  .toast-action{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:12.5px; font-weight:600;
    background:none; border:none; color:var(--hivis-2); cursor:pointer; padding:4px 6px; white-space:nowrap;
  }
  .toast-action:hover{color:var(--hivis);}
  .toast-close{
    background:none; border:none; color:var(--steel); font-size:16px; line-height:1; cursor:pointer;
    padding:2px 4px;
  }
  .toast-close:hover{color:var(--chalk);}

  .btn{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;
    font-size:13px; font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid var(--steel);
    background:transparent;
    color:var(--chalk);
    cursor:pointer;
    transition:background .12s, color .12s, border-color .12s, transform .05s;
  }
  .btn:hover{border-color:var(--hivis); color:var(--hivis-2);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--hivis); border-color:var(--hivis); color:var(--ink);}
  .btn-primary:hover{background:var(--hivis-2); border-color:var(--hivis-2); color:var(--ink);}
  .btn-ghost{border-color:transparent; color:var(--steel);}
  .btn-ghost:hover{color:var(--chalk); border-color:var(--steel);}
  .btn-danger{border-color:var(--stamp); color:var(--stamp);}
  .btn-danger:hover{background:var(--stamp); color:var(--chalk);}
  .btn-sm{padding:5px 10px; font-size:11px;}
  .btn[disabled]{opacity:0.35; cursor:default; pointer-events:none;}

  .btn-toggle{border-color:var(--steel);}
  .btn-toggle.active{background:var(--hivis); border-color:var(--hivis); color:var(--ink);}

  /* ---------- Settings ---------- */
  #view-settings{flex-direction:row; overflow:hidden; padding:0;}
  .settings-layout{display:flex; width:100%; height:100%; min-height:0;}
  .settings-sidebar{
    width:250px; flex-shrink:0; overflow-y:auto; padding:24px 12px;
    background:var(--asphalt-2); border-right:1px solid var(--asphalt-3);
  }
  .settings-sidebar-head{padding:0 10px 18px;}
  .settings-sidebar-head h2{font-size:19px; color:var(--chalk);}
  .settings-sidebar-head p{color:var(--steel); font-family:'JetBrains Mono',monospace; font-size:10.5px; margin-top:6px; line-height:1.5;}
  .settings-nav-group{margin-bottom:16px;}
  .settings-nav-group-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--steel); padding:0 10px 6px;
  }
  .settings-nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:9px 10px; border-radius:4px; border:none; border-left:3px solid transparent;
    background:transparent; color:var(--chalk); font:inherit; font-size:13.5px; cursor:pointer;
  }
  .settings-nav-item:hover{background:var(--asphalt-3);}
  .settings-nav-item.active{background:var(--asphalt-3); border-left-color:var(--hivis); color:var(--hivis-2);}
  .settings-nav-icon{font-size:15px; width:18px; text-align:center; flex-shrink:0;}
  .settings-content{flex:1; min-width:0; overflow-y:auto; padding:36px 40px;}
  .settings-mobile-back{display:none;}
  .settings-section{margin-bottom:32px;}
  .settings-section h3{font-size:16px; color:var(--chalk); margin-bottom:4px;}
  .settings-section-desc{color:var(--steel); font-family:'JetBrains Mono',monospace; font-size:11.5px; margin-bottom:16px; max-width:640px; line-height:1.5;}
  .settings-section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px;}
  .settings-section-head h3{margin-bottom:0;}
  .option-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px;}
  .option-card{
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-left:4px solid transparent;
    border-radius:4px; padding:16px; cursor:pointer; text-align:left; color:inherit; font:inherit;
    transition:border-color .12s, transform .08s;
  }
  .option-card:hover{transform:translateY(-2px); border-color:var(--steel);}
  .option-card.active{border-left-color:var(--hivis); border-color:var(--hivis);}
  .option-swatch{display:flex; gap:4px; margin-bottom:12px;}
  .option-swatch span{width:20px; height:20px; border-radius:3px; border:1px solid rgba(127,127,127,0.35); display:inline-block;}
  .icon-preview-row{display:flex; flex-wrap:wrap; overflow:hidden; gap:10px; margin-bottom:12px; font-size:19px; color:var(--hivis-2); align-items:center; min-height:22px;}
  .icon-preview-row .material-symbols-outlined{font-size:19px;}
  .option-card-label{display:block; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; font-size:14px; color:var(--chalk); margin-bottom:4px;}
  .option-card-desc{display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--steel); line-height:1.4;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; vertical-align:middle;}

  .type-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .type-row{display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px;}
  .type-row .type-icon{font-size:18px; width:24px; text-align:center; flex-shrink:0;}
  .type-row .type-info{flex:1; min-width:0;}
  .type-row .type-name{font-family:'Oswald',sans-serif; text-transform:uppercase; font-weight:600; font-size:13px; color:var(--chalk);}
  .type-row .type-meta{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--steel); margin-top:2px;}
  .type-row .type-badge{font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:var(--steel); border:1px solid var(--asphalt-3); border-radius:3px; padding:2px 6px; flex-shrink:0;}
  .settings-form{margin-top:4px; padding:16px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:4px; display:flex; flex-direction:column; gap:12px; max-width:520px;}
  .settings-form label{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); display:block; margin-bottom:3px;}
  .settings-form input[type=text], .settings-form input[type=number]{
    width:100%; font-family:'Inter',sans-serif; font-size:13px;
    border:1px solid var(--asphalt-3); background:var(--asphalt); color:var(--chalk);
    border-radius:2px; padding:7px 9px;
  }
  .settings-form .row2{display:flex; gap:10px; flex-wrap:wrap;}
  .settings-form .row2 > div{flex:1; min-width:140px;}
  .settings-form .icon-input{width:72px; text-align:center; font-size:18px;}
  .settings-form .checkbox-row{display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--steel);}
  .settings-form .form-actions{display:flex; gap:8px; margin-top:2px;}

  /* ---------- Main area ---------- */
  #main{flex:1; min-height:0; position:relative;}
  .view{display:none; height:100%;}
  .view.active{display:flex;}

  /* ---------- Dashboard ---------- */
  #view-dashboard{flex-direction:column; overflow:auto; padding:36px 40px;}
  .dash-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap;}
  .dash-head h2{font-size:30px; color:var(--chalk);}
  .dash-head p{color:var(--steel); font-family:'JetBrains Mono',monospace; font-size:12px; margin-top:6px;}
  .event-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px;}
  .event-card{
    background:var(--asphalt-2);
    border:1px solid var(--asphalt-3);
    border-left:4px solid var(--hivis);
    border-radius:4px;
    padding:18px;
    cursor:pointer;
    transition:border-color .12s, transform .08s;
  }
  .event-card:hover{border-left-color:var(--hivis-2); transform:translateY(-2px);}
  .event-card h3{font-size:18px; color:var(--chalk); margin-bottom:6px;}
  .event-card .meta{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--steel); letter-spacing:0.04em;}
  .event-card .count{margin-top:14px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--hivis-2); font-family:'JetBrains Mono',monospace;}
  .event-card-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}

  .empty-state{
    border:1px dashed var(--asphalt-3);
    border-radius:6px;
    padding:60px 20px;
    text-align:center;
    color:var(--steel);
  }
  .empty-state .display{font-size:22px; color:var(--chalk); margin-bottom:8px;}

  .new-event-card{
    background:transparent;
    border:2px dashed var(--steel);
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    min-height:120px;
    cursor:pointer;
    color:var(--steel);
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
    transition:border-color .12s, color .12s;
  }
  .new-event-card:hover{border-color:var(--hivis); color:var(--hivis-2);}

  /* ---------- Editor ---------- */
  #view-editor{flex-direction:row;}
  .map-wrap{flex:1; position:relative; display:flex; min-width:0;}
  #map{flex:1; background:#111;}

  .map-search{
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:1000;
    font-family:'Inter',sans-serif; display:flex; align-items:center;
  }
  .map-search-toggle{
    flex-shrink:0; width:34px; height:34px; padding:0; border-radius:3px;
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); box-shadow:0 6px 18px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--chalk); opacity:0.85;
  }
  .map-search-toggle:hover{color:var(--hivis-2); opacity:1;}
  .map-search.open .map-search-toggle{color:var(--hivis-2); opacity:1;}

  .clue-preview-toggle{
    flex-shrink:0; margin-left:8px;
    width:34px; height:34px; padding:0; border-radius:3px; font-size:15px;
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); box-shadow:0 6px 18px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--chalk); opacity:0.85;
  }
  .clue-preview-toggle:hover{color:var(--hivis-2); opacity:1;}
  .clue-preview-toggle.active{color:var(--asphalt); background:var(--hivis); opacity:1;}
  .map-search-box{
    display:flex; align-items:center; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:3px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    width:0; opacity:0; margin-left:0; overflow:hidden; pointer-events:none;
    transition:width .18s ease, opacity .12s ease, margin-left .18s ease;
  }
  .map-search.open .map-search-box{width:280px; opacity:1; margin-left:8px; pointer-events:auto;}
  .map-search-box input{
    flex:1; min-width:0; background:transparent; border:none; color:var(--chalk);
    font-family:'Inter',sans-serif; font-size:13px; padding:11px 10px;
  }
  .map-search-box input::placeholder{color:var(--steel);}
  .map-search-box .search-clear{
    flex-shrink:0; background:none; border:none; color:var(--steel); cursor:pointer; padding:4px 10px; font-size:15px;
  }
  .map-search-box .search-clear:hover{color:var(--hivis-2);}
  .map-search-results{
    position:absolute; top:calc(100% + 4px); right:0; width:280px;
    background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-radius:3px;
    max-height:240px; overflow:auto; display:none; box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .map-search-result{
    padding:9px 12px; font-size:12.5px; color:var(--chalk); cursor:pointer; border-bottom:1px solid var(--asphalt-3);
    line-height:1.4;
  }
  .map-search-result:last-child{border-bottom:none;}
  .map-search-result:hover{background:var(--asphalt-3); color:var(--hivis-2);}
  .map-search-loading{padding:9px 12px; font-size:11.5px; color:var(--steel); font-family:'JetBrains Mono',monospace;}

  .map-legend{
    position:absolute; bottom:14px; left:14px; z-index:900;
    background:rgba(23,25,26,0.88); border:1px solid var(--asphalt-3); border-radius:3px;
    padding:8px 12px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--steel);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .map-legend .item{display:flex; align-items:center; gap:6px;}
  .map-legend .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .map-legend .dot.mandatory{background:var(--stamp);}
  .map-legend .dot.optional{background:var(--steel); border:1px dashed var(--chalk);}
  .map-legend .dot.staffed{background:var(--ok);}
  .map-legend .dot.unstaffed{background:var(--stamp);}
  .map-legend .line{width:16px; height:0; border-top:2px dashed var(--hivis);}
  .map-legend .line.map-legend-line-estimate{border-top-color:#3fa9f5;}
  .cp-marker{
    width:32px; height:32px; border-radius:50%;
    background:var(--stamp);
    border:2px solid var(--chalk);
    color:var(--chalk);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
    position:relative;
  }
  .cp-marker.optional{background:var(--steel); border-style:dashed;}
  .cp-marker-type{
    position:absolute; bottom:-5px; right:-5px;
    width:17px; height:17px; border-radius:50%;
    background:var(--chalk); border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; line-height:1;
  }
  .cp-marker-staffing{
    position:absolute; top:-3px; left:-3px;
    width:11px; height:11px; border-radius:50%;
    background:var(--ok); border:1.5px solid var(--chalk);
  }
  .cp-marker-staffing.unstaffed{background:var(--stamp);}
  .cp-marker.cp-marker-hover-sync{animation:cp-marker-hover-pulse 0.8s ease-in-out infinite; z-index:1000 !important;}

  /* Dragged row doubles as its own drop-slot placeholder (dashed outline,
     dimmed content) rather than a separate ghost element — it already sits
     exactly where it would land (onCpDragMove moves it live), so a second

     (shadow/scale/rotate) is the "currently held" cue; transition lets the

  .cp-row.dragging{
