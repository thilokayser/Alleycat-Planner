  const reader = new FileReader();
  reader.onload = () => {
    b.config.logos = b.config.logos || [];
    b.config.logos.push({dataUrl: reader.result, name: file.name});
    debouncedSave();
    renderManifest();
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function removePdfBlockSponsorLogo(id, idx){
  const b = findPdfBlock(id);
  if(!b || !b.config.logos) return;
  b.config.logos.splice(idx, 1);
  debouncedSave();
  renderManifest();
}

/* ---------------- image block: client-side compression ----------------
   Resized to max 1600px width / re-encoded as JPEG ~80% before ever
   touching storage, consistent with the app's existing storage-size
   sensitivity (4.13's Storage-Estimate warning) — avoids ballooning the
   local SQLite DB with full-resolution route-map screenshots/event photos. */
function compressImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL('image/jpeg', 0.8), w, h});
      };
      img.onerror = () => reject(new Error('image decode failed'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
async function onPdfBlockImageUpload(id, input){

/* ---------------- table block: fixed app-data sources (no freeform grid) ---------------- */
const PDF_TABLE_SOURCES = ['checkpoint_distances', 'category_breakdown', 'team_list'];
function onPdfBlockTableSourceChange(id, value){
  const b = findPdfBlock(id);
  if(!b || !PDF_TABLE_SOURCES.includes(value)) return;
  b.config.source = value;
  debouncedSave();
  renderManifest();
}
function pdfBlockTableData(b, evt){
  const source = PDF_TABLE_SOURCES.includes(b.config.source) ? b.config.source : 'checkpoint_distances';
  if(source === 'category_breakdown'){
    const headers = [t('pdfBlocks.table.category'), t('pdfBlocks.table.option'), t('pdfBlocks.table.count')];
    const rows = [];
    (evt.categoryGroups || []).slice().sort((a, c) => a.sortOrder - c.sortOrder).forEach(g => {
      (g.options || []).forEach(opt => {
        const count = (evt.riders || []).filter(r => r.categories && r.categories[g.id] === opt).length;
        rows.push([g.name, opt, String(count)]);
      });
    });
    return {headers, rows};
  }
  if(source === 'team_list'){
    const headers = [t('pdfBlocks.table.team'), t('pdfBlocks.table.members')];
    const rows = (evt.teams || []).map(tm => {
      const members = (evt.riders || []).filter(r => r.teamId === tm.id).map(r => r.name || ('#' + r.bib)).join(', ');
      return [tm.name, members || '—'];
    });
    return {headers, rows};
  }
  const headers = [t('pdfBlocks.table.checkpoint'), t('pdfBlocks.table.leg'), t('pdfBlocks.table.cumulative')];
  const ordered = (evt.checkpoints || []).slice().sort((a, c) => a.order - c.order);
  const {legs, total} = computeRouteLegs(ordered);
  let cumulative = 0;
  const rows = ordered.map((cp, i) => {
    const legKm = i === 0 ? 0 : legs[i - 1].km;
    cumulative += legKm;
    return [cp.name || ('#' + (i + 1)), i === 0 ? '—' : formatDistance(legKm * 1000), formatDistance(cumulative * 1000)];
  });
  if(ordered.length > 1) rows.push([t('pdfBlocks.table.total'), '', formatDistance(total * 1000)]);
  return {headers, rows};
}

/* ---------------- variable_text: {{event.x}} placeholder interpolation ----------------
   Interpolated at export time only (17.5) — the stored content stays the
   raw template text, same "never runs through t()" rule as custom_text, so
   the template remains reusable across events via the existing JSON
   export/import instead of being baked to one event's values on save. */
function pdfBlockVariableValues(evt){
  const hq = getEventLocation(evt, 'headquarters');
  const afterparty = getEventLocation(evt, 'afterparty');
  return {
    'event.name': evt.name || '',
    'event.date': formatDateOnly(evt.date),
    'event.riderCount': String((evt.riders || []).length || evt.expectedRiders || 0),
    'event.hqAddress': (hq && hq.address) || '',
    'event.afterpartyName': (afterparty && afterparty.name) || ''
  };
}
function interpolatePdfBlockVariables(text, evt){
  const values = pdfBlockVariableValues(evt);
  return (text || '').replace(/\{\{\s*([\w.]+)\s*\}\}/g, (m, key) => Object.prototype.hasOwnProperty.call(values, key) ? values[key] : m);
}

/* ---------------- export/import as template ---------------- */
function exportPdfBlocksJSON(){
  const evt = state.currentEvent;
  if(!evt || !(evt.pdfBlocks || []).length) return;
  const filename = (evt.name || 'event').replace(/\s+/g, '_').toLowerCase() + '-pdf-blocks.json';
  downloadJSON(evt.pdfBlocks, filename);
}
async function onImportPdfBlocksFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const evt = state.currentEvent;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!Array.isArray(parsed)) throw new Error('invalid shape');
    if(!confirm(t('pdfBlocks.importPreview', {count: parsed.length}))){ input.value = ''; return; }
    evt.pdfBlocks = evt.pdfBlocks || [];
    parsed.forEach(b => {
      if(!b || !PDF_BLOCK_TYPES.includes(b.type)) return;
      evt.pdfBlocks.push(withPdfBlockDefaults({
        id: uid('block'), type: b.type,
        targetDocuments: Array.isArray(b.targetDocuments) ? b.targetDocuments : ['manifest'],
        enabled: b.enabled !== false, sortOrder: evt.pdfBlocks.length,
        content: typeof b.content === 'string' ? b.content : '',
        config: (b.config && typeof b.config === 'object') ? b.config : {},
        width: PDF_BLOCK_WIDTHS.includes(b.width) ? b.width : 'full',
        pageBreakBefore: b.pageBreakBefore === true
      }));
    });
    input.value = '';
    debouncedSave();
    renderManifest();
  }catch(e){
    alert(t('pdfBlocks.importFailed'));
    input.value = '';
  }
}

/* ---------------- PDF-Baukasten: block-append rendering ----------------
   Margins/line-heights are computed as fractions of the doc's own page
   size rather than fixed pt values, so this same function works whether
   the caller's jsPDF instance uses 'pt' units (manifest) or 'mm' units
   (spokecards) — only font sizes stay in fixed pt, since jsPDF's
   setFontSize() is always in points regardless of the document unit. */
/* ---------------- in-page PDF preview ----------------
   Manifest/Personal-Briefing generation opens this modal instead of an
   immediate download, so layout tweaks (PDF-Baukasten, manifest column
   toggles) can be checked without piling up downloaded files each time.
   Rendered into #pdf-preview-root, a template sibling of #app (same
   pattern as #command-palette-root) so it overlays regardless of view. */
let pdfPreviewBlobUrl = null;
function showPdfPreview(doc, filename){
  if(pdfPreviewBlobUrl){ URL.revokeObjectURL(pdfPreviewBlobUrl); pdfPreviewBlobUrl = null; }
  pdfPreviewDoc = doc;
  pdfPreviewBlobUrl = doc.output('bloburl');
  state.pdfPreviewFilename = filename;
  state.pdfPreviewOpen = true;
  renderPdfPreview();
}
function closePdfPreview(){
  state.pdfPreviewOpen = false;
  pdfPreviewDoc = null;
  if(pdfPreviewBlobUrl){ URL.revokeObjectURL(pdfPreviewBlobUrl); pdfPreviewBlobUrl = null; }
  const root = document.getElementById('pdf-preview-root');
  if(root) root.innerHTML = '';
}
function downloadPdfPreview(){
  if(!pdfPreviewDoc) return;
  pdfPreviewDoc.save(state.pdfPreviewFilename);
}
function renderPdfPreview(){
  const root = document.getElementById('pdf-preview-root');
  if(!root) return;
  if(!state.pdfPreviewOpen || !pdfPreviewBlobUrl){ root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="pdfprev-overlay">
      <div class="pdfprev-box">
        <div class="pdfprev-head">
          <span class="pdfprev-filename">${escapeHtml(state.pdfPreviewFilename)}</span>
          <span class="pdfprev-spacer"></span>
          <button type="button" class="btn btn-sm btn-primary" onclick="downloadPdfPreview()">${t('pdfPreview.download')}</button>
          <button type="button" class="btn btn-sm btn-ghost" onclick="closePdfPreview()">${t('pdfPreview.close')}</button>
        </div>
        <iframe class="pdfprev-frame" src="${pdfPreviewBlobUrl}" title="${escapeHtml(state.pdfPreviewFilename)}"></iframe>
      </div>
    </div>
  `;
}
/* ---------------- PDF-Baukasten 2.0: auto-flow row layout (Paket 5 Teil B) ----------------
   appendPdfBlocks() groups enabled blocks via layoutBlocks() (pdf-blocks.js)
   into rows, then renders row-by-row instead of the old one-block-per-page
   loop. Every ROW still starts on a fresh page (doc.addPage() unconditional
   per row, not per page-that-still-has-room) — deliberately, so a
   pre-Teil-B event (every block defaults to width:'full', which always
   lands alone in its own row, see layoutBlocks()) renders byte-for-byte
   like before: one page per block, nothing packed onto a shared page. Only
   genuinely NEW same-row blocks (half/third width) share a page, since
   that packing has no prior behavior to regress — pageBreakBefore stays
   meaningful regardless (it decides ROW membership in layoutBlocks(), and
   a block that's forced into its own row also always gets its own fresh
   page as a consequence of the per-row addPage()). Single-block rows fall
   back to the old internal-addPage()-on-overflow pagination via the
   `pagination` param so long content still spans
   multiple pages exactly as before; multi-column rows do not (splitting a
   *row* of side-by-side columns across a page boundary while keeping them
   aligned is exactly the 2D-grid-editor complexity 17.2 explicitly opts
   out of — acceptable given half/third blocks are meant for compact
   content like logos/small text/images, not sprawling checkpoint lists). */
/* "Vorschau"-Button (17.3/17.8 step 5): reuses the existing in-page iframe
   preview from Paket 1 (showPdfPreview()) instead of adding a PDF-to-image
   rasterization step — the project's own "no new dependencies" rule
   (PROJEKT-UEBERSICHT.md §9) rules out a pdf.js-style library, and an
   iframe of the real PDF is a strictly better preview than a static image
   of it anyway. Builds a standalone doc containing only this document
   type's block layout (not the full manifest/spokecards content) so it
   stays fast and doesn't require riders/checkpoints to already be
   PDF-ready — deliberately NOT wired to re-render on every keystroke
   (17.3's explicit non-goal), only when the button is clicked. */
function previewPdfBlocksLayout(docType){
  const evt = state.currentEvent;
  if(!evt || !window.jspdf) return;
  const hasBlocks = (evt.pdfBlocks || []).some(b => b.enabled && (b.targetDocuments || []).includes(docType));
  if(!hasBlocks){ alert(t('pdfBlocks.previewEmpty')); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF(docType === 'spokecards' ? {unit: 'mm', format: 'a4'} : {unit: 'pt', format: 'a4'});
  appendPdfBlocks(doc, evt, docType);
  doc.deletePage(1);
  const docLabel = docType === 'manifest' ? t('pdfBlocks.targetManifest') : t('pdfBlocks.targetSpokecards');
  showPdfPreview(doc, t('pdfBlocks.previewFilename', {doc: docLabel}));
}
function appendPdfBlocks(doc, evt, targetDocType){
  const blocks = ((evt.pdfBlocks || [])).filter(b => b.enabled && (b.targetDocuments || []).includes(targetDocType)).sort((a, b) => a.sortOrder - b.sortOrder);
  if(!blocks.length) return;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = pageW * 0.08;
  const pageRight = pageW - marginX;
  const contentW = pageRight - marginX;
  const topY = pageH * 0.09;
  const bottomLimit = pageH * 0.92;
  const lineH = pageH * 0.018;
  const colGap = contentW * 0.04;

  const rows = layoutBlocks(blocks);
  rows.forEach(row => {
    doc.addPage();
    const y = topY;
    if(row.length === 1){
      renderPdfBlockColumn(doc, row[0], evt, marginX, pageRight, y, lineH, pageH, {bottomLimit, topY});
    }else{
      let x = marginX;
      row.forEach(b => {
        const w = contentW * (PDF_BLOCK_WIDTH_VALUES[b.width] || 1);
        renderPdfBlockColumn(doc, b, evt, x, x + w - colGap, y, lineH, pageH, null);
        x += w;
      });
    }
  });
}
/* Renders one block's title + rule + content inside the column bounds
   [x, colRight]. `pagination` (only ever passed for lone full-row blocks)
   re-enables the old per-line addPage()-on-overflow behavior; multi-column
   rows pass null and just draw past the bottom margin in the rare case
   their content is too tall (see appendPdfBlocks' comment above). */
function renderPdfBlockColumn(doc, b, evt, x, colRight, y, lineH, pageH, pagination){
  const colW = colRight - x;
  const INK = '#241f18', HIVIS = '#ff5f1f', STEEL = '#5b5340';
  const maybeBreak = () => {
    if(pagination && y > pagination.bottomLimit){ doc.addPage(); y = pagination.topY; }
  };
  doc.setTextColor(INK);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(pdfBlockTitle(b), x, y);
  y += pageH * 0.012;
  doc.setDrawColor(HIVIS); doc.setLineWidth(1);
  doc.line(x, y, colRight, y);
  y += pageH * 0.03;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.setTextColor(INK);

  if(b.type === 'sponsors'){
    const logos = b.config.logos || [];
    if(!logos.length){
      doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(STEEL);
      doc.text(t('pdfBlocks.sponsorsEmpty'), x, y);
    }else{
      const perRow = pdfBlockLogosPerRow(b.width);
      const gap = colW * 0.04;
      const logoW = (colW - gap * (perRow - 1)) / perRow;
      const logoH = logoW * 0.5;
      let cx = x, col = 0;
      logos.forEach(l => {
        if(pagination && y + logoH > pagination.bottomLimit){ doc.addPage(); y = pagination.topY; cx = x; col = 0; }
        try{ doc.addImage(l.dataUrl, cx, y, logoW, logoH, undefined, 'FAST'); }catch(e){ /* unsupported image format — skip tile */ }
        col++;
        if(col >= perRow){ col = 0; cx = x; y += logoH + lineH; }
        else cx += logoW + gap;
      });
    }
  }else if(b.type === 'checkpoint_list'){
    const checkpoints = evt.checkpoints.slice().sort((a, c) => a.order - c.order);
    checkpoints.forEach(cp => {
      maybeBreak();
      doc.setFont('courier', 'bold'); doc.setFontSize(9); doc.setTextColor(INK);
      doc.text(String(cp.order).padStart(2, '0'), x, y);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.text(cp.name || '—', x + colW * 0.06, y);
      y += lineH;
    });
  }else if(b.type === 'event_locations'){
    const rows = [
      {label: t('eventLocations.hqLabel'), loc: getEventLocation(evt, 'headquarters')},
      {label: t('eventLocations.afterpartyLabel'), loc: getEventLocation(evt, 'afterparty')}
    ].filter(r => eventLocationHasPosition(r.loc));
    if(!rows.length){
      doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(STEEL);
      doc.text(t('pdfBlocks.eventLocationsEmpty'), x, y);
    }else{
      rows.forEach(r => {
        maybeBreak();
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(INK);
        doc.text(`${r.label}: ${r.loc.name || '—'}`, x, y);
        y += lineH;
        [r.loc.address, r.loc.notes].filter(Boolean).forEach(text => {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(STEEL);
          doc.splitTextToSize(text, colW).forEach(line => {
            maybeBreak();
            doc.text(line, x, y);
            y += lineH * 0.85;
          });
        });
        y += lineH * 0.6;
      });
    }
  }else if(b.type === 'image'){
    if(!b.config.dataUrl){
      doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(STEEL);
      doc.text(t('pdfBlocks.imageEmpty'), x, y);
    }else{
      const dims = b.config.imageDims || {w: 4, h: 3};
      const h = colW * (dims.h / dims.w);
      try{ doc.addImage(b.config.dataUrl, x, y, colW, h, undefined, 'FAST'); }catch(e){ /* unsupported image format */ }
      y += h;
      if(b.config.caption){
        y += lineH * 0.6;
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(STEEL);
        const align = b.config.alignment || 'center';
        const capX = align === 'left' ? x : align === 'right' ? colRight : x + colW / 2;
        doc.text(b.config.caption, capX, y, {align});
      }
    }
  }else if(b.type === 'table'){
    const {headers, rows: tableRows} = pdfBlockTableData(b, evt);
    const colCount = headers.length;
    const colWidths = headers.map((h, i) => i === 0 ? colW * 0.4 : colW * 0.6 / (colCount - 1));
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(INK);
    let cx = x;
    headers.forEach((h, i) => { doc.text(h, cx, y); cx += colWidths[i]; });
    y += lineH * 0.3;
    doc.setDrawColor(STEEL); doc.setLineWidth(0.4);
    doc.line(x, y, colRight, y);
    y += lineH * 0.9;
    if(!tableRows.length){
      doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(STEEL);
      doc.text(t('pdfBlocks.tableEmpty'), x, y);
    }else{
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(INK);
      tableRows.forEach(row => {
        maybeBreak();
        cx = x;
        row.forEach((cell, i) => {
          const lines = doc.splitTextToSize(String(cell), colWidths[i] - 2);
          doc.text(lines[0] || '', cx, y);
          cx += colWidths[i];
        });
        y += lineH * 0.95;
      });
    }
  }else{
    const content = interpolatePdfBlockVariables(b.content || '', evt);
    if(!content.trim()){
      doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(STEEL);
      doc.text(t('pdfBlocks.emptyContent'), x, y);
    }else{
      content.split(/\n{2,}/).forEach(paragraph => {
        doc.splitTextToSize(paragraph, colW).forEach(line => {
          maybeBreak();
          doc.text(line, x, y);
          y += lineH;
        });
        y += lineH * 0.5;
      });
    }
    if(b.type === 'waiver' && (b.config.showSignatureLine || b.config.showDateField)){
      y += lineH;
      maybeBreak();
      doc.setDrawColor(STEEL); doc.setLineWidth(0.6);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(STEEL);
      if(b.config.showDateField){
        const w = colW * 0.28;
        doc.line(x, y, x + w, y);
        doc.text(t('pdfBlocks.dateFieldLabel'), x, y + lineH * 0.8);
      }
      if(b.config.showSignatureLine){
        const sigX = x + colW * 0.4;
        doc.line(sigX, y, colRight, y);
        doc.text(t('pdfBlocks.signatureFieldLabel'), sigX, y + lineH * 0.8);
      }
    }
  }
  return y;
}

function onSpokeCardImageUpload(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const targetAspect = 63.5 / 88.9;
      const srcAspect = img.width / img.height;
      let sx, sy, sw, sh;
      if(srcAspect > targetAspect){
        sh = img.height; sw = sh * targetAspect; sx = (img.width - sw) / 2; sy = 0;
      } else {
        sw = img.width; sh = sw / targetAspect; sx = 0; sy = (img.height - sh) / 2;
      }
      const outW = 750, outH = Math.round(outW / targetAspect);
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
      state.currentEvent.spokeCardImage = canvas.toDataURL('image/jpeg', 0.88);
      debouncedSave();
      renderRiders();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
}

function computeCardGrid(pageW, pageH, cardW, cardH, marginX, marginY, gapX, gapY){
  const cols = Math.max(1, Math.floor((pageW - marginX * 2 + gapX) / (cardW + gapX)));
  const rows = Math.max(1, Math.floor((pageH - marginY * 2 + gapY) / (cardH + gapY)));
  const perPage = cols * rows;
  const gridW = cols * cardW + (cols - 1) * gapX;
  const offsetX = marginX + Math.max(0, (pageW - marginX * 2 - gridW) / 2);
  const pos = (i) => {
    const idx = i % perPage;
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    return {x: offsetX + col * (cardW + gapX), y: marginY + row * (cardH + gapY)};
  };
  return {cols, rows, perPage, pos};
}
async function buildSpokeCardsDoc(evt){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const cardW = 63.5, cardH = 88.9;
  const {perPage, pos} = computeCardGrid(210, 297, cardW, cardH, 10, 8, 6, 5);

  const riders = evt.riders;
  riders.forEach((r, i) => {
    if(i > 0 && i % perPage === 0) doc.addPage();
    const {x, y} = pos(i);
    drawSpokeCardFront(doc, x, y, cardW, cardH, evt, r);
  });

  const qrCodes = await Promise.all(riders.map(r => renderQrDataUrl(String(r.bib), 300)));
  doc.addPage();
  for(let i = 0; i < riders.length; i++){
    if(i > 0 && i % perPage === 0) doc.addPage();
    const {x, y} = pos(i);
    drawSpokeCardBack(doc, x, y, cardW, cardH, evt, riders[i], qrCodes[i]);
  }
  appendPdfBlocks(doc, evt, 'spokecards');
  return doc;
}
async function exportSpokeCardsPDF(){
  const evt = state.currentEvent;

        const badgeW = 34, badgeX = colX.checkpoint + colW.checkpoint - badgeW - 2, badgeY = y - 8;
        doc.setDrawColor(STEEL); doc.setLineWidth(0.6);
        doc.roundedRect(badgeX, badgeY, badgeW, 11, 2, 2, 'S');
        doc.setFont('helvetica','bold'); doc.setFontSize(6);
        doc.setTextColor(STEEL);
        doc.text(t('exportPdf.bonusBadge'), badgeX + badgeW / 2, badgeY + 7.5, {align: 'center'});
      }
    }
    if(colX.typ !== undefined){
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      const badgeW = Math.min(colW.typ - 4, Math.max(...typLines.map(l => doc.getTextWidth(l))) + 8);
      const badgeH = 8 * typLines.length + 4;
      doc.setDrawColor(LINE); doc.setLineWidth(0.5);
      doc.roundedRect(colX.typ, y - 8, badgeW, badgeH, 2, 2, 'S');
      doc.setTextColor(STEEL);
      doc.text(typLines, colX.typ + 4, y);
    }
    if(colX.clue !== undefined){
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.setTextColor(INK);
      doc.text(cp.clue || '\u2014', colX.clue, y, {maxWidth: colW.clue - 6});
    }
    if(colX.koordinaten !== undefined){
      doc.setFont('courier','normal'); doc.setFontSize(7.5);
      doc.setTextColor(STEEL);
      /* Non-decimal coordinate formats (UTM/MGRS especially) can run wider
         than this column was sized for ("50.93750, 6.96030") — shrink the
         font just enough to fit rather than letting it overflow into the
         next column on a printed manifest. */
      const coordText = formatCoordinates(cp.lat, cp.lng);
      const availableWidth = (colW.koordinaten || 60) - 2;
      let coordFontSize = 7.5;
      while(coordFontSize > 5 && doc.getTextWidth(coordText) > availableWidth){
        coordFontSize -= 0.5;
        doc.setFontSize(coordFontSize);
      }
      doc.text(coordText, colX.koordinaten, y);
    }
    if(colX.punch !== undefined){
      const px = colX.punch;
      const punchType = getCheckpointType(cp.type);
      doc.setDrawColor(INK);
      if(punchType.manifestCell === 'answer-line'){
        doc.setLineWidth(0.6); doc.setLineDash([1.5, 1.5], 0);
        doc.line(px, y + 5, px + Math.min(colW.punch - 6, 36), y + 5);
        doc.setLineDash([], 0);
      } else if(punchType.manifestCell === 'score-line'){
        doc.setFont('courier', 'normal'); doc.setFontSize(8);
        doc.setTextColor(INK);
        doc.text(t('exportPdf.scoreOutOf', {max: punchType.scoreMax}), px, y + 2);
      } else {
        doc.setLineWidth(0.8);
        doc.rect(px, y - 8, 13, 13);
      }
    }
    y += rowHeight + 6;
  });

  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.setTextColor(STEEL);
  doc.text(t('exportPdf.productFooter'), marginX, 806);
  doc.text(t('exportPdf.autoGenFooter'), pageRight, 806, {align: 'right'});

  appendPdfBlocks(doc, evt, 'manifest');
  showPdfPreview(doc, (evt.name || 'manifest').replace(/\s+/g,'_').toLowerCase() + '-manifest.pdf');
  evt.manifestGenerated = true;
  debouncedSave();
}

/* ---------------- race state machine ----------------
   in_planung -> bereit -> läuft -> abgeschlossen (rückwärts jederzeit mit Bestätigung).
   Nur die im Übergabe-Dokument explizit hervorgehobene Sperre wird durchgesetzt:
   CP-Struktur wird ab "läuft" read-only (siehe checkpoint.js renderSidebar). Volle
   Read-only-Durchsetzung in allen anderen Views ist bewusst nicht Teil dieser Phase. */
const RACE_STATUS_ORDER = ['planning', 'ready', 'running', 'completed'];
function raceStatusLabel(status){
  return t('raceState.' + status) || status;
}
function raceStatusIndex(status){
  return RACE_STATUS_ORDER.indexOf(status);
}
function isCpLocked(evt){
  if(!evt) return false;
  if(evt.status === 'running') return !evt.cpLockOverride;
  if(evt.status === 'completed') return true;
  return false;
}
function canAdvanceToReady(evt){
  const blocking = [];
  const warnings = [];
  if(!evt.checkpoints || !evt.checkpoints.length) blocking.push(t('raceState.missingCheckpoint'));
  if(!evt.expectedRiders) blocking.push(t('raceState.missingCapacity'));
  if(!evt.spokecardsPrinted) warnings.push(t('raceState.spokecardsNotPrinted'));
  if(!evt.manifestGenerated) warnings.push(t('raceState.manifestNotGenerated'));
  return {blocking, warnings};
}
function markReady(evt){
  const {blocking, warnings} = canAdvanceToReady(evt);
  if(blocking.length){
    alert(t('raceState.blockedTitle') + '\n\n' + blocking.map(b => '• ' + b).join('\n'));
    render();
    return false;
  }
  if(warnings.length && !confirm(warnings.map(w => '• ' + w).join('\n') + '\n\n' + t('raceState.warningsConfirm'))){
    render();
    return false;
  }
  evt.status = 'ready';
  evt.statusChangedAt = toLocalDateTimeInputValue(new Date());
  /* Sofort statt über den 3-Sekunden-Debounce: rider.php nimmt Check-ins
     nur im Status 'running' an, ein verzögerter Publish sperrte die
     ersten Fahrer nach dem Startschuss ohne erkennbaren Grund aus. */
  publishRiderConfigNow();
  /* startRiderPolling() beendet sich selbst, wenn der neue Status kein
     Polling braucht — deshalb hier ein Aufruf für beide Richtungen. */
  startRiderPolling();
  debouncedSave();
  render();
  return true;
}
function startRace(evt){
  if(!evt) return;
  evt.status = 'running';
  evt.statusChangedAt = toLocalDateTimeInputValue(new Date());
  /* Sofort statt über den 3-Sekunden-Debounce: rider.php nimmt Check-ins
     nur im Status 'running' an, ein verzögerter Publish sperrte die
     ersten Fahrer nach dem Startschuss ohne erkennbaren Grund aus. */
  publishRiderConfigNow();
  /* startRiderPolling() beendet sich selbst, wenn der neue Status kein
     Polling braucht — deshalb hier ein Aufruf für beide Richtungen. */
  startRiderPolling();
  evt.startConfirmedAt = toLocalDateTimeInputValue(new Date());
  evt.cpLockOverride = false;
  state.addMode = false;
  closeStartDialog();
  broadcastRaceStart(evt.id);
  debouncedSave();
  render();
}
function postponeStart(evt){
  if(!evt) return;
  const base = evt.startTime ? new Date(evt.startTime) : new Date();
  const newTime = new Date((isNaN(base.getTime()) ? new Date() : base).getTime() + 5 * 60000);
  evt.startTime = toLocalDateTimeInputValue(newTime);
  debouncedSave();
  checkStartDialog();
}
function completeRace(evt){
  const unfinished = (evt.riders || []).filter(r => !r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated').length;
  const msg = unfinished > 0 ? t('raceState.completeConfirm', {count: unfinished}) : t('raceState.completeConfirmZero');
  if(!confirm(msg)){
    render();
    return false;
  }
  evt.status = 'completed';
  evt.statusChangedAt = toLocalDateTimeInputValue(new Date());
  /* Sofort statt über den 3-Sekunden-Debounce: rider.php nimmt Check-ins
     nur im Status 'running' an, ein verzögerter Publish sperrte die
     ersten Fahrer nach dem Startschuss ohne erkennbaren Grund aus. */
  publishRiderConfigNow();
  /* startRiderPolling() beendet sich selbst, wenn der neue Status kein
     Polling braucht — deshalb hier ein Aufruf für beide Richtungen. */
  startRiderPolling();
  debouncedSave();
  render();
  return true;
}
function onStatusSelectChange(value){
  const evt = state.currentEvent;
  if(!evt || value === evt.status) return;
  const fromIdx = raceStatusIndex(evt.status);
  const toIdx = raceStatusIndex(value);
  if(toIdx > fromIdx){
    if(value === 'ready'){ markReady(evt); return; }
    if(value === 'running'){ startRace(evt); return; }
    if(value === 'completed'){ completeRace(evt); return; }
  } else {
    if(!confirm(t('raceState.backwardConfirm', {status: raceStatusLabel(value)}))){
      render();
      return;
    }
    evt.status = value;
    evt.statusChangedAt = toLocalDateTimeInputValue(new Date());
  /* Sofort statt über den 3-Sekunden-Debounce: rider.php nimmt Check-ins
     nur im Status 'running' an, ein verzögerter Publish sperrte die
     ersten Fahrer nach dem Startschuss ohne erkennbaren Grund aus. */
  publishRiderConfigNow();
  /* startRiderPolling() beendet sich selbst, wenn der neue Status kein
     Polling braucht — deshalb hier ein Aufruf für beide Richtungen. */
  startRiderPolling();
    debouncedSave();
    render();
  }
}
function toggleCpLockOverride(){
  const evt = state.currentEvent;
  if(!evt) return;
  if(!evt.cpLockOverride){

/* ---------------- rules engine ----------------
   Generic WENN [Trigger] UND [Bedingung] DANN [Effekt] evaluator. There is
   deliberately NO visual rule builder in the UI (see game-modes.js) — the
   engine itself stays generic so a later preset only needs a new
   GAME_MODE_DEFS entry (trigger/condition/effect functions), never a
   rewrite of this file. evaluateRules() is the single call site every
   trigger point (check-in, finish, tick, manual HQ actions) goes through;
   an effect can veto the action that triggered it by returning
   {block:true, message} (used by e.g. the time-window / zone presets to
   reject an out-of-window or out-of-zone check-in). */
function evaluateRules(evt, triggerType, context){
  const result = {blocked: false, message: ''};
  if(!evt || !evt.gameModes) return result;
  evt.gameModes.filter(m => m.enabled).forEach(mode => {
    const def = GAME_MODE_DEFS[mode.type];
    if(!def || !def.rules) return;
    def.rules.filter(rule => rule.trigger === triggerType).forEach(rule => {
      if(rule.condition && !rule.condition(evt, mode, context || {})) return;
      const effectResult = rule.effect(evt, mode, context || {});
      if(effectResult && effectResult.block){
        result.blocked = true;
        result.message = effectResult.message || result.message;
      }
    });
  });
  return result;
}

/* ---------------- on_tick scheduling ----------------
   One interval for the app's lifetime (same self-guarding pattern as
   startAutoBackup() in data-safety.js) — only does work while a race is
   actually running and at least one enabled mode has an on_tick rule. */
let rulesTickInterval = null;
function startRulesEngineTick(){
  if(rulesTickInterval) return;
  rulesTickInterval = setInterval(runRulesEngineTick, 10000);
}
function runRulesEngineTick(){
  const evt = state.currentEvent;
  if(!evt || evt.status !== 'running') return;
  if(!(evt.gameModes || []).some(m => m.enabled)) return;
  const before = JSON.stringify({rt: evt.ruleRuntimeState, riders: (evt.riders || []).map(r => r.raceStatus)});
  evaluateRules(evt, 'on_tick', {now: Date.now()});
  const after = JSON.stringify({rt: evt.ruleRuntimeState, riders: (evt.riders || []).map(r => r.raceStatus)});
  if(before !== after){
    debouncedSave();
    if(state.view === 'checkin') renderCheckin();
    else if(state.view === 'overview') renderOverview();
  }
}

/* ---------------- event log (feeds the beamer's live ticker, Phase 12) ----------------
   Only recorded while at least one game mode is enabled (the ticker is
   itself only shown then, see getBeamerLayout() in beamer-modes.js) so
   events without any active mode don't accumulate unused log entries in
   storage. Also nudges any open beamer tab via live-sync.js's
   BroadcastChannel for an instant reaction, independent of its normal
   ~7s event-data poll (same pattern as broadcastRaceStart() for GO). */
function anyGameModeEnabled(evt){
  return (evt.gameModes || []).some(m => m.enabled);
}
function pushEventLog(evt, type, message, bib){
  if(!anyGameModeEnabled(evt)) return null;
  evt.ruleRuntimeState = evt.ruleRuntimeState || {};
  evt.ruleRuntimeState.eventLog = evt.ruleRuntimeState.eventLog || [];
  const entry = {id: uid('log'), type, message, bib: bib || null, at: toLocalDateTimeInputValue(new Date())};
  evt.ruleRuntimeState.eventLog.push(entry);
  if(evt.ruleRuntimeState.eventLog.length > 30) evt.ruleRuntimeState.eventLog = evt.ruleRuntimeState.eventLog.slice(-30);
  broadcastLiveEvent(evt.id, entry);
  return entry;
}

/* ---------------- points ledger ---------------- */
function awardPoints(evt, riderBib, checkpointId, amount, reason, source){
  if(!amount) return;
  evt.pointsLedger = evt.pointsLedger || [];
  evt.pointsLedger.push({
    id: uid('pts'), riderBib, checkpointId: checkpointId || null,
    amount, reason, source, createdAt: toLocalDateTimeInputValue(new Date())
  });
}
function removeLedgerEntries(evt, matcher){
  evt.pointsLedger = (evt.pointsLedger || []).filter(p => !matcher(p));
}
function pointsForRider(evt, riderBib){
  return (evt.pointsLedger || []).filter(p => p.riderBib === riderBib).reduce((sum, p) => sum + p.amount, 0);
}
function ledgerEntriesForRider(evt, riderBib){
  return (evt.pointsLedger || []).filter(p => p.riderBib === riderBib).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
}

/* ---------------- shared helpers used across multiple presets ---------------- */
function getGameMode(evt, type){
  return (evt.gameModes || []).find(m => m.type === type);
}
function isGameModeEnabled(evt, type){
  const m = getGameMode(evt, type);
  return !!(m && m.enabled);
}
function isCpRevealed(evt, cp){
  if(!isGameModeEnabled(evt, 'prerequisite') || !cp.gameHidden) return true;
  return ((evt.ruleRuntimeState && evt.ruleRuntimeState.revealedCheckpoints) || []).includes(cp.id);
}
function isCpSatisfiedForRider(rider, cp){
  if((rider.completed || []).includes(cp.id)) return true;
  return !!(rider.gameFlags && rider.gameFlags.jokerCpId === cp.id);
}
function setZoneActive(evt, zoneId, active){
  const zone = getZone(evt, zoneId);
  if(!zone) return null;
  zone.active = !!active;
  const zoneNameEscaped = escapeHtml(zone.name || t('zones.unnamed'));
  pushEventLog(evt, 'district_toggled', active
    ? t('gameModes.tickerDistrictActivated', {name: zoneNameEscaped})
    : t('gameModes.tickerDistrictDeactivated', {name: zoneNameEscaped}), null);
  return zone;
}
function zoneCenterOf(evt){
  const withPos = (evt.checkpoints || []).filter(c => Number.isFinite(c.lat) && Number.isFinite(c.lng));
  if(!withPos.length) return null;
  const lat = withPos.reduce((s, c) => s + c.lat, 0) / withPos.length;
  const lng = withPos.reduce((s, c) => s + c.lng, 0) / withPos.length;
  return {lat, lng};
}
function currentZoneStage(evt, mode){
  const stages = (mode.config && mode.config.stages) || [];
  const idx = evt.ruleRuntimeState && Number.isInteger(evt.ruleRuntimeState.zoneStage) ? evt.ruleRuntimeState.zoneStage : -1;
  return idx >= 0 && idx < stages.length ? stages[idx] : null;
}
/* Paket 4 migration: zone_active can now anchor on a real, organizer-drawn
   circle from evt.zones (mode.config.zoneId) instead of always the implicit
   checkpoint centroid. Falls back to the original zoneCenterOf() whenever no
   zone is picked (or the picked one was deleted/isn't a circle) — this is
   the compatibility seam that keeps every pre-Paket-4 event and every
   existing zone_active test passing unchanged, since none of them set
   config.zoneId. */
function zoneActiveCenterOf(evt, mode){
  const zone = mode && mode.config && mode.config.zoneId ? getZone(evt, mode.config.zoneId) : null;
  if(zone && zone.type === 'circle' && zone.center) return zone.center;
  return zoneCenterOf(evt);
}
function isCpClosedByZone(evt, cp){
  const mode = getGameMode(evt, 'zone_active');
  if(!mode || !mode.enabled) return false;
  const stage = currentZoneStage(evt, mode);
  if(!stage) return false;
  const center = zoneActiveCenterOf(evt, mode);
  if(!center || !Number.isFinite(cp.lat) || !Number.isFinite(cp.lng)) return false;
  const distMeters = haversineDistanceKm(center.lat, center.lng, cp.lat, cp.lng) * 1000;
  return distMeters > stage.radius;
}
function advanceZoneStage(evt, mode){
  const stages = (mode.config && mode.config.stages) || [];
  evt.ruleRuntimeState = evt.ruleRuntimeState || {};
  const current = Number.isInteger(evt.ruleRuntimeState.zoneStage) ? evt.ruleRuntimeState.zoneStage : -1;
  if(current + 1 >= stages.length) return false;
  evt.ruleRuntimeState.zoneStage = current + 1;
  const newStage = stages[evt.ruleRuntimeState.zoneStage];
  const zone = mode.config.zoneId ? getZone(evt, mode.config.zoneId) : null;
  if(zone && zone.type === 'circle' && newStage) zone.radiusMeters = newStage.radius;
  pushEventLog(evt, 'zone_shrink', t('gameModes.tickerZoneShrink', {n: current + 2}), null);
  AlleycatSounds.play('zone_shrink');
  return true;
}
function lastCheckpointTimeForRider(rider){
  const times = Object.values(rider.checkpointTimes || {}).filter(Boolean);
  if(!times.length) return null;
  return times.sort((a, b) => new Date(a) - new Date(b)).pop();
}


/* ---------------- game modes (Spielmodi-Engine preset catalog) ----------------
   MVP decision from the spec doc: only pre-defined modes, toggle on/off with
   parameters (same UX pattern as category presets) — no visual rule builder.
   Each entry below IS the internal, generic rule definition the engine in
   rules-engine.js evaluates; the UI only ever shows a checkbox + a small
   parameter form per mode, never the trigger/condition/effect wiring itself.
   "Kopfgeld" from the spec is explicitly deferred ("Phase 2 / spätere
   Erweiterung" — needs live leader recalculation + rider-tag interaction) and
   intentionally not implemented here; its condition type `is_leader` is
   therefore unused for now. */
const GAME_MODE_TYPES = ['time_window', 'first_n', 'prerequisite', 'zone_active', 'districts', 'rider_flag', 'sequence_match', 'sudden_death'];
const POINTS_AWARDING_MODE_TYPES = ['first_n', 'sequence_match', 'districts'];
/* `||` treats an intentional 0 (e.g. "eliminate immediately") the same as
   "unset", silently falling back to the default — use this instead for any
   numeric config field where 0 is a legitimate value. */
function numOr(value, fallback){ return Number.isFinite(value) ? value : fallback; }

function withGameModeDefaults(m){
  const def = GAME_MODE_DEFS[m.type] || {};
  return {
    id: m.id || uid('mode'),
    type: m.type,
    enabled: !!m.enabled,
    config: Object.assign({}, def.defaultConfig || {}, m.config || {})
  };
}

function maybeAdvanceZoneBySchedule(evt, mode){
  const stages = (mode.config && mode.config.stages) || [];
  const startMs = new Date(evt.startConfirmedAt).getTime();
  if(isNaN(startMs)) return;
  const elapsedMin = (Date.now() - startMs) / 60000;
  let advanced = true;
  while(advanced){
    const current = evt.ruleRuntimeState && Number.isInteger(evt.ruleRuntimeState.zoneStage) ? evt.ruleRuntimeState.zoneStage : -1;
    const next = current + 1;
    advanced = next < stages.length && elapsedMin >= stages[next].atMinute && advanceZoneStage(evt, mode);
  }
}

const GAME_MODE_DEFS = {
  time_window: {
    type: 'time_window',
    defaultConfig: {},
    rules: [{
      trigger: 'on_checkin',
      condition: (evt, mode, ctx) => ctx.checkpoint && ctx.checkpoint.timeWindowEnabled,
      effect: (evt, mode, ctx) => {
        const result = computeTimeWindowResult(ctx.checkpoint, ctx.timestamp);
        if(result && !result.ok){
          return {block: true, message: t('gameModes.timeWindowBlocked', {reason: result.reason === 'early' ? t('checkin.tooEarly') : t('checkin.tooLate')})};
        }
      }
    }]
  },
  first_n: {
    type: 'first_n',
    defaultConfig: {pointsByRank: [5, 3, 1]},
    rules: [{
      trigger: 'on_checkin',
      condition: (evt, mode, ctx) => ctx.checkpoint && !ctx.checkpoint.mandatory,
      effect: (evt, mode, ctx) => {
        const cp = ctx.checkpoint;
        const priorCount = (evt.riders || []).filter(r => r.bib !== ctx.rider.bib && (r.completed || []).includes(cp.id)).length;
        const points = (mode.config.pointsByRank || [])[priorCount];
        if(points){
          awardPoints(evt, ctx.rider.bib, cp.id, points, t('gameModes.firstNReason', {rank: priorCount + 1, name: cp.name || t('overview.checkpointFallbackLabel')}), 'first_n');
          pushEventLog(evt, 'bonus_secured', t('gameModes.tickerBonusSecured', {name: escapeHtml(ctx.rider.name || ('#' + ctx.rider.bib))}), ctx.rider.bib);
          AlleycatSounds.play('bonus_secured');
        }
      }
    }]
  },
  prerequisite: {
    type: 'prerequisite',
    defaultConfig: {},
    rules: [{
      trigger: 'on_checkin',
      condition: () => true,
      effect: (evt, mode, ctx) => {
        evt.ruleRuntimeState = evt.ruleRuntimeState || {};
        evt.ruleRuntimeState.revealedCheckpoints = evt.ruleRuntimeState.revealedCheckpoints || [];
        (evt.checkpoints || []).forEach(cp => {
          if(cp.gameHidden && cp.gameRevealPrerequisiteCpId === ctx.checkpoint.id && !evt.ruleRuntimeState.revealedCheckpoints.includes(cp.id)){
            evt.ruleRuntimeState.revealedCheckpoints.push(cp.id);
            pushEventLog(evt, 'checkpoint_revealed', t('gameModes.tickerRevealed', {name: escapeHtml(cp.name || t('overview.checkpointFallbackLabel'))}), null);
            AlleycatSounds.play('checkpoint_revealed');
          }
        });
      }
    }]
  },
  zone_active: {
    type: 'zone_active',
    defaultConfig: {triggerMode: 'scheduled', zoneId: '', stages: [{radius: 2000, atMinute: 10}, {radius: 1000, atMinute: 20}, {radius: 500, atMinute: 30}]},
    rules: [
      {
        trigger: 'on_tick',
        condition: (evt, mode) => evt.status === 'running' && evt.startConfirmedAt && (mode.config.triggerMode === 'scheduled' || mode.config.triggerMode === 'both'),
        effect: (evt, mode) => { maybeAdvanceZoneBySchedule(evt, mode); }
      },
      {
        trigger: 'manual',
        condition: (evt, mode, ctx) => ctx.action === 'advance_zone_stage' && ctx.modeId === mode.id && (mode.config.triggerMode === 'manual' || mode.config.triggerMode === 'both'),
        effect: (evt, mode) => { advanceZoneStage(evt, mode); }
      },
      {
        trigger: 'on_checkin',
        condition: (evt, mode, ctx) => ctx.checkpoint && isCpClosedByZone(evt, ctx.checkpoint),
        effect: () => ({block: true, message: t('gameModes.zoneClosedBlocked')})
      }
    ]
  },
  /* "Bezirke": the roadmap's own framing — Battle Royale and Districts are
     two applications of the same zones.js system, just different activation
     logic (one zone shrinking on a schedule vs. any number of zones toggled
     independently). A zone joins the district set by being picked in this
     mode's config UI (which tags it group:'district', mirroring how picking
     a Battle-Royale zone tags group:'battle_royale') — deliberately manual
     triggering only for v1 (an HQ button per district), no per-zone
     schedule; the roadmap's "oder Zeitplan" option and per-checkpoint zone
     overrides for edge cases are both noted as deferred, not built here. */
  districts: {
    type: 'districts',
    defaultConfig: {subVariant: 'points_only', pointsPerCheckpoint: 5},
    rules: [
      {
        trigger: 'on_checkin',
        condition: (evt, mode, ctx) => ctx.checkpoint && !!getCheckpointZone(ctx.checkpoint, (evt.zones || []).filter(z => z.group === 'district'), evt),
        effect: (evt, mode, ctx) => {
          const zone = getCheckpointZone(ctx.checkpoint, (evt.zones || []).filter(z => z.group === 'district'), evt);
          if(!zone) return;
          if(mode.config.subVariant === 'gated'){
            if(!zone.active) return {block: true, message: t('gameModes.districtInactiveBlocked', {name: zone.name || t('zones.unnamed')})};
            return;
          }
          if(zone.active){
            awardPoints(evt, ctx.rider.bib, ctx.checkpoint.id, numOr(mode.config.pointsPerCheckpoint, 5), t('gameModes.districtReason', {name: zone.name || t('zones.unnamed')}), 'districts');
          }
        }
      },
      {
        trigger: 'manual',
        condition: (evt, mode, ctx) => ctx.action === 'toggle_district' && ctx.zoneId,
        effect: (evt, mode, ctx) => { setZoneActive(evt, ctx.zoneId, ctx.active); }
      }
    ]
  },
  rider_flag: {
    type: 'rider_flag',
    defaultConfig: {},
    rules: [{
      trigger: 'manual',
      condition: (evt, mode, ctx) => ctx.action === 'assign_joker' && ctx.rider,
      effect: (evt, mode, ctx) => {
        ctx.rider.gameFlags = ctx.rider.gameFlags || {};
        if(ctx.checkpointId) ctx.rider.gameFlags.jokerCpId = ctx.checkpointId;
        else delete ctx.rider.gameFlags.jokerCpId;
      }
    }]
  },
  sequence_match: {
    type: 'sequence_match',
    defaultConfig: {multiplier: 2},
    rules: [{
      trigger: 'on_finish',
      condition: (evt, mode, ctx) => evt.checkpointOrderMode === 'fest' && !(ctx.rider.checkpointOrderOverrides || []).length
        && evt.checkpoints.length > 0 && evt.checkpoints.every(cp => (ctx.rider.completed || []).includes(cp.id)),
      effect: (evt, mode, ctx) => {
        removeLedgerEntries(evt, p => p.riderBib === ctx.rider.bib && p.source === 'sequence_match');
        const base = pointsForRider(evt, ctx.rider.bib);
        const bonus = Math.round(base * (numOr(mode.config.multiplier, 2) - 1));
        if(bonus > 0) awardPoints(evt, ctx.rider.bib, null, bonus, t('gameModes.sequenceMatchReason'), 'sequence_match');
      }
    }]
  },
  sudden_death: {
    type: 'sudden_death',
    defaultConfig: {cutoffMinutes: 30, inactivityMinutes: 20},
    rules: [{
      trigger: 'on_tick',
      condition: (evt, mode) => evt.status === 'running' && !!evt.startConfirmedAt,
      effect: (evt, mode, ctx) => {
        const startMs = new Date(evt.startConfirmedAt).getTime();
        const nowMs = ctx.now || Date.now();
        if(isNaN(startMs)) return;
        const elapsedMin = (nowMs - startMs) / 60000;
        if(elapsedMin < numOr(mode.config.cutoffMinutes, 30)) return;
        (evt.riders || []).forEach(r => {
          if(r.raceStatus || r.finishTime || !(r.name || '').trim()) return;
          const lastCp = lastCheckpointTimeForRider(r);
          const lastMs = lastCp ? new Date(lastCp).getTime() : startMs;
          if((nowMs - lastMs) / 60000 > numOr(mode.config.inactivityMinutes, 20)){
            r.raceStatus = 'eliminated';
            pushEventLog(evt, 'rider_eliminated', t('gameModes.tickerEliminated', {name: escapeHtml(r.name || ('#' + r.bib))}), r.bib);
            AlleycatSounds.play('rider_eliminated');
          }
        });
      }
    }]
  }
};

/* ---------------- toggle + config mutation ---------------- */
function toggleGameMode(type, enabled){
  const evt = state.currentEvent;
  if(!evt) return;
  evt.gameModes = evt.gameModes || [];
  let mode = evt.gameModes.find(m => m.type === type);
  if(!mode){
    mode = withGameModeDefaults({type});
    evt.gameModes.push(mode);
  }
  if(enabled && POINTS_AWARDING_MODE_TYPES.includes(type) && evt.scoringMode !== 'points'){
    if(!confirm(t('gameModes.scoringSwitchConfirm'))){ renderOverview(); return; }
    evt.scoringMode = 'points';
  }
  mode.enabled = enabled;
  debouncedSave();
  renderOverview();
}
function onGameModeConfigChange(type, key, value){
  const mode = getGameMode(state.currentEvent, type);
  if(!mode) return;
  mode.config[key] = value;
  debouncedSave();
  renderOverview();
}
function onFirstNPointsChange(value){
  const mode = getGameMode(state.currentEvent, 'first_n');
  if(!mode) return;
  mode.config.pointsByRank = value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
  debouncedSave();
}
function onZoneTriggerModeChange(value){
  const mode = getGameMode(state.currentEvent, 'zone_active');
  if(!mode) return;
  mode.config.triggerMode = value;
  debouncedSave();
  renderOverview();
}
function onZoneModeZoneChange(value){
  const evt = state.currentEvent;
  const mode = getGameMode(evt, 'zone_active');
  if(!mode) return;
  mode.config.zoneId = value || '';
  if(value) updateZone(evt, value, {group: 'battle_royale'});
  debouncedSave();
  renderOverview();
}
function addZoneStage(){
  const mode = getGameMode(state.currentEvent, 'zone_active');
  if(!mode) return;
  mode.config.stages = mode.config.stages || [];
  mode.config.stages.push({radius: 500, atMinute: (mode.config.stages.length + 1) * 10});
  debouncedSave();
  renderOverview();
}
function removeZoneStage(idx){
  const mode = getGameMode(state.currentEvent, 'zone_active');
  if(!mode) return;
  mode.config.stages.splice(idx, 1);
  debouncedSave();
  renderOverview();
}
function onZoneStageFieldChange(idx, field, value){
  const mode = getGameMode(state.currentEvent, 'zone_active');
  if(!mode || !mode.config.stages[idx]) return;
  mode.config.stages[idx][field] = parseInt(value, 10) || 0;
  debouncedSave();
}
function addDistrictZone(zoneId){
  if(!zoneId) return;
  updateZone(state.currentEvent, zoneId, {group: 'district'});
  debouncedSave();
  renderOverview();
}
function removeDistrictZone(zoneId){
  updateZone(state.currentEvent, zoneId, {group: '', active: false});
  debouncedSave();
  renderOverview();
}
function toggleDistrictActive(zoneId, active){
  evaluateRules(state.currentEvent, 'manual', {action: 'toggle_district', zoneId, active});
  debouncedSave();
  renderOverview();
}
function manualAdvanceZoneStage(){
  const evt = state.currentEvent;
  const mode = getGameMode(evt, 'zone_active');
  if(!evt || !mode) return;
  evaluateRules(evt, 'manual', {action: 'advance_zone_stage', modeId: mode.id});
  debouncedSave();
  renderOverview();
}

    checkpointOrderMode: 'frei',
    dashboardWidgetOrder: DASHBOARD_WIDGET_KEYS.slice(),
    dashboardWidgetVisibility: {statusTiles: true, cpLoad: true, recentActivity: false, categoryDistribution: false, miniLeaderboard: false, countdown: true, todos: false},

    importedGeoLayers: [],
    publicId: '',
    riderApp: {progress: true, map: false, leaderboard: false, selfRegister: false},
    riderLastLogId: 0,
    orphanCheckins: []
  }, evt);
  merged.riderApp = Object.assign({progress: true, map: false, leaderboard: false, selfRegister: false}, merged.riderApp);
  merged.pdfBlocks = (merged.pdfBlocks || []).map(withPdfBlockDefaults);
  merged.gameModes = (merged.gameModes || []).map(withGameModeDefaults);
  merged.checkpoints = (merged.checkpoints || []).map(withCheckpointDefaults);
  merged.riders = (merged.riders || []).map(withRiderDefaults);
  merged.manifestSettings = withManifestSettingsDefaults(merged.manifestSettings);
  merged.zones = (merged.zones || []).map(withZoneDefaults);
  merged.eventLocations = (merged.eventLocations || []).map(withEventLocationDefaults);

}

async function confirmDeleteEvent(id){
  state.eventsIndex = state.eventsIndex.filter(e => e.id !== id);

async function exportEventJSON(id){
  const evt = state.currentEvent && state.currentEvent.id === id ? state.currentEvent : await loadEvent(id);
  if(!evt) return;
  const filename = (evt.name || 'event').replace(/\s+/g, '_').toLowerCase() + '-backup.json';

async function onImportEventFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.checkpoints)){
      throw new Error('invalid shape');
    }
    const newId = uid('evt');
    const evt = withEventDefaults(Object.assign({}, parsed, {id: newId}));
    state.eventsIndex.push({id: newId, name: evt.name || t('dashboard.importedEventDefaultName'), date: evt.date || ''});
    await saveEventsIndex();
    setSaveStatus('saving');
    const ok = await storageSet('event:' + newId, JSON.stringify(evt));
    setSaveStatus(ok ? 'saved' : 'error');
    input.value = '';
    openEditor(newId);
  }catch(e){
    alert(t('dashboard.importFailed'));
    input.value = '';
  }
}

/* ---------------- overview: per-event dashboard widgets ---------------- */
const DASHBOARD_WIDGET_KEYS = ['statusTiles', 'cpLoad', 'recentActivity', 'categoryDistribution', 'miniLeaderboard', 'countdown', 'todos'];

function computeRiderStatusTiles(evt){
  const riders = evt.riders || [];
  const tiles = {registered: 0, underway: 0, finished: 0, dnf: 0, dns: 0, eliminated: 0};
  riders.forEach(r => {
    if(r.raceStatus === 'eliminated'){ tiles.eliminated++; return; }
    if(r.raceStatus === 'dnf'){ tiles.dnf++; return; }
    if(r.raceStatus === 'dns'){ tiles.dns++; return; }
    if(r.finishTime){ tiles.finished++; return; }
    if((r.completed && r.completed.length) || Object.keys(r.checkpointTimes || {}).length){ tiles.underway++; return; }
    tiles.registered++;
  });
  return tiles;
}
function computeCheckpointLoad(evt){
  const riders = evt.riders || [];
  return (evt.checkpoints || []).slice().sort((a, b) => a.order - b.order).map(cp => ({
    checkpoint: cp,
    count: riders.filter(r => (r.completed || []).includes(cp.id)).length
  })).sort((a, b) => a.count - b.count);
}
function computeRecentActivity(evt, limit){
  const entries = [];
  (evt.riders || []).forEach(r => {
    Object.entries(r.checkpointTimes || {}).forEach(([cpId, at]) => {
      if(!at) return;
      const cp = (evt.checkpoints || []).find(c => c.id === cpId);
      entries.push({at, bib: r.bib, name: r.name || '', label: (cp && cp.name) || t('overview.checkpointFallbackLabel')});
    });
    if(r.finishTime) entries.push({at: r.finishTime, bib: r.bib, name: r.name || '', label: t('overview.finishLabel')});
  });
  entries.sort((a, b) => new Date(b.at) - new Date(a.at));
  return entries.slice(0, limit || 8);
}
function computeCategoryDistribution(evt){
  return (evt.categoryGroups || []).map(g => ({
    group: g,
    counts: g.options.map(opt => ({
      opt,
      count: (evt.riders || []).filter(r => r.categories && r.categories[g.id] === opt).length
    }))
  }));
}
function computeMiniLeaderboard(evt, limit){
  const finished = (evt.riders || []).filter(r => r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated');
  return finished.slice().sort((a, b) => new Date(a.finishTime) - new Date(b.finishTime)).slice(0, limit || 5);
}
function computeStartCountdown(evt){
  const now = new Date();
  if(evt.status === 'running' || evt.status === 'completed'){
    if(!evt.startConfirmedAt) return {mode: 'none'};
    const start = new Date(evt.startConfirmedAt);
    if(isNaN(start.getTime())) return {mode: 'none'};
    if(evt.status === 'completed'){
      const end = evt.statusChangedAt ? new Date(evt.statusChangedAt) : now;
      return {mode: 'duration', ms: (isNaN(end.getTime()) ? now : end) - start};
    }
    return {mode: 'since', ms: now - start};
  }
  if(evt.startMode === 'scheduled' && evt.startTime){
    const start = new Date(evt.startTime);
    if(!isNaN(start.getTime())) return {mode: 'until', ms: start - now};
  }
  return {mode: 'none'};
}
function computeDashboardTodos(evt){
  const todos = [];
  if(!evt.checkpoints || !evt.checkpoints.length){
    todos.push({key: 'noCheckpoints', text: t('overview.todoNoCheckpoints')});
  } else if(evt.checkpoints.some(cp => !Number.isFinite(cp.lat) || !Number.isFinite(cp.lng))){
    todos.push({key: 'cpNoPosition', text: t('overview.todoCpNoPosition')});
  }
  if(!evt.startTime) todos.push({key: 'noStartTime', text: t('overview.todoNoStartTime')});
  if(!evt.expectedRiders) todos.push({key: 'noCapacity', text: t('overview.todoNoCapacity')});
  (evt.categoryGroups || []).forEach(g => {
    const assigned = (evt.riders || []).some(r => r.categories && r.categories[g.id]);
    if(!assigned) todos.push({key: 'catGroupEmpty-' + g.id, text: t('overview.todoCategoryGroupEmpty', {name: escapeHtml(g.name)})});
  });
  if(!evt.spokecardsPrinted || !evt.bibsPrinted) todos.push({key: 'notPrinted', text: t('overview.todoNotPrinted')});
  if(!evt.manifestGenerated) todos.push({key: 'noManifest', text: t('overview.todoNoManifest')});
  const staffMissingCount = (evt.checkpoints || []).filter(cp => !(cp.staff || []).length).length;
  if(staffMissingCount > 0) todos.push({key: 'noStaff', text: t('overview.todoNoStaff', {count: staffMissingCount})});
  const tileSeverity = offlineTileCacheStaleness(evt);
  if(tileSeverity){
    const days = Math.floor((Date.now() - new Date(evt.tileCacheUpdatedAt).getTime()) / 86400000);
    todos.push({key: 'tileCacheStale', text: t('overview.todoTileCacheStale', {days}), severity: tileSeverity});
  }
  const proximityPairs = findProximityClusters(evt, currentProximityBufferMeters());
  const proximitySeverity = proximityClusterSeverity(proximityPairs);
  if(proximitySeverity){
    todos.push({key: 'proximityCluster', text: t('overview.todoProximityCluster', {count: proximityPairs.length, radius: currentProximityBufferMeters()}), severity: proximitySeverity});
  }
  return todos;
}

  const origin = afterpartyRouteOrigin(evt);

    </div>

}
function renderBackupStatusLine(evt){

  if(!evt.lastBackupAt && evt.status !== 'running') return '';
  const text = evt.lastBackupAt ? t('dataSafety.lastBackupLine', {time: formatMinutesAgo(evt.lastBackupAt)}) : t('dataSafety.noBackupYet');

}

/* ---------------- sound hook ----------------
   Eigenständiges, wiederverwendbares Modul (nicht nur für den Beamer) —
   registriert Base64-Data-URLs pro Event unter einem SOUND_EVENTS-Key
   und spielt sie ab. play() wirft nie, sondern liefert per Promise
   zurück ob die Wiedergabe geklappt hat (false bei fehlendem Sound
   oder Autoplay-Block) — Aufrufer entscheiden selbst, ob dafür ein
   optisches Fallback (z. B. „Klicken zum Aktivieren") nötig ist. */
const AlleycatSounds = {
  sounds: {},
  register(key, url){
    if(!url) return;
    const a = new Audio(url);
    a.preload = 'auto';
    this.sounds[key] = a;
  },
  unregister(key){
    delete this.sounds[key];
  },
  play(key){
    const a = this.sounds[key];
    if(!a || !isFeatureEnabled('sound_hook')) return Promise.resolve(false);
    a.currentTime = 0;
    return a.play().then(() => true).catch(() => false);
  },
  isRegistered(key){ return !!this.sounds[key]; }
};

const SOUND_EVENTS = {
  race_start: 'raceStart',
  checkpoint_scan: 'checkpointScan',
  rider_finished: 'riderFinished',
  countdown_tick: 'countdownTick',
  zone_shrink: 'zoneShrink',
  rider_eliminated: 'riderEliminated',
  bonus_secured: 'bonusSecured',
  checkpoint_revealed: 'checkpointRevealed'
};


/* ---------------- live sync ----------------
   Separate BroadcastChannel from beamer.js's 'alleycat-beamer' one
   (which only carries race-start/event-updated nudges) — this one
   carries individual game-mode event-log entries (see pushEventLog()
   in rules-engine.js) so an open beamer tab can react instantly (e.g.
   trigger the elimination overlay) instead of waiting for its ~7s
   event-data poll. Storage stays the source of truth either way: the
   entry is already persisted on evt.ruleRuntimeState.eventLog before
   this fires, so a missed broadcast just means the poll catches up. */
let liveSyncChannel;
function getLiveSyncChannel(){
  if(liveSyncChannel === undefined){
    try{ liveSyncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('alleycat-live') : null; }
    catch(e){ liveSyncChannel = null; }
  }
  return liveSyncChannel;
}
function broadcastLiveEvent(eventId, entry){
  const ch = getLiveSyncChannel();
  if(ch) ch.postMessage({eventId, entry, timestamp: Date.now()});
}


/* ---------------- beamer view ----------------
   Eigene, komplett von der normalen SPA-Navigation losgelöste Route
   (#/beamer/<event-id>), Vollbild, hoher Kontrast. In der lokalen
   Variante heißt "separat erreichbar" praktisch: zweiter Tab im
   selben Browser (IndexedDB ist origin-, nicht tab-gebunden) — echtes
   Cross-Device gibt es nur über die Server-Variante, dort funktioniert
   dieselbe Route genauso (storageGet/Set sind backend-agnostisch).
   Sync: BroadcastChannel für sofortige Reaktion (Start-Trigger, neue
   Daten), IndexedDB/Storage-Polling alle 7s als robuster Fallback,
   falls der Beamer-Tab neu geladen wurde oder den Broadcast verpasst
   hat — Storage bleibt in jedem Fall Wahrheitsquelle. */
let beamerState = null;
let beamerChannel;
let beamerPollInterval = null;
let beamerTickInterval = null;
let beamerGoTimeout = null;

function isBeamerRoute(){
  return /^#\/beamer\//.test(location.hash);
}
function beamerEventIdFromHash(){
  const m = location.hash.match(/^#\/beamer\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}
function openBeamerView(eventId){
  window.open(location.pathname + location.search + '#/beamer/' + encodeURIComponent(eventId), '_blank');
}
function getBeamerChannel(){
  if(beamerChannel === undefined){
    try{ beamerChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('alleycat-beamer') : null; }
    catch(e){ beamerChannel = null; }
  }
  return beamerChannel;
}
function broadcastRaceStart(eventId){
  const ch = getBeamerChannel();
  if(ch) ch.postMessage({type: 'race-started', eventId});
}
function broadcastEventUpdated(eventId){
  const ch = getBeamerChannel();
  if(ch) ch.postMessage({type: 'event-updated', eventId});
}

/* ---------------- sound-hook wiring (per-event, base64 in event data) ---------------- */
function registerEventSounds(evt){
  Object.keys(SOUND_EVENTS).forEach(key => {
    const hook = evt.soundHooks && evt.soundHooks[key];
    if(hook && hook.dataUrl) AlleycatSounds.register(key, hook.dataUrl);
    else AlleycatSounds.unregister(key);
  });
}
function onSoundHookFileChange(key, input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){
    alert(t('beamer.soundTooLarge'));
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const evt = state.currentEvent;
    if(!evt) return;
    evt.soundHooks = evt.soundHooks || {};
    evt.soundHooks[key] = {name: file.name, dataUrl: reader.result};
    AlleycatSounds.register(key, reader.result);
    debouncedSave();
    renderOverview();
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function removeSoundHook(key){
  const evt = state.currentEvent;
  if(!evt || !evt.soundHooks || !evt.soundHooks[key]) return;
  delete evt.soundHooks[key];
  AlleycatSounds.unregister(key);
  debouncedSave();
  renderOverview();
}
function testPlaySoundHook(key){
  const evt = state.currentEvent;
  const hook = evt && evt.soundHooks && evt.soundHooks[key];
  if(hook && !AlleycatSounds.isRegistered(key)) AlleycatSounds.register(key, hook.dataUrl);
  AlleycatSounds.play(key);
}
function renderBeamerSoundRow(evt, key, label){
  const hook = evt.soundHooks && evt.soundHooks[key];
  return `
    <div class="sound-hook-row">
      <span class="sound-hook-label">${label}</span>
      ${hook
        ? `<span class="sound-hook-filename">${escapeHtml(hook.name)}</span>
           <button type="button" class="btn btn-sm" onclick="testPlaySoundHook('${key}')">${t('beamer.soundTestButton')}</button>
           <button type="button" class="btn btn-sm btn-danger" onclick="removeSoundHook('${key}')">${t('common.delete')}</button>`
        : `<span class="sound-hook-empty">${t('beamer.soundNoneSet')}</span>`}
      <input type="file" id="sound-upload-${key}" accept="audio/*" style="display:none;" onchange="onSoundHookFileChange('${key}', this)">
      <button type="button" class="btn btn-sm" onclick="document.getElementById('sound-upload-${key}').click()">${t('beamer.soundUploadButton')}</button>
    </div>
  `;
}
function renderBeamerOverviewSection(evt){
  const soundEnabled = isFeatureEnabled('sound_hook');
  return `
    <div class="overview-beamer-bar" id="overview-beamer-section">
      <div class="overview-beamer-info">
        <button type="button" class="btn btn-primary" onclick="openBeamerView('${evt.id}')">${t('beamer.openButton')}</button>
        <span class="overview-beamer-hint">${t('beamer.hintNewTab')}</span>
      </div>
      ${soundEnabled ? `
      ${renderBeamerSoundRow(evt, 'race_start', t('beamer.soundRaceStartLabel'))}
      ${isGameModeEnabled(evt, 'zone_active') ? renderBeamerSoundRow(evt, 'zone_shrink', t('beamer.soundZoneShrinkLabel')) : ''}
      ${isGameModeEnabled(evt, 'sudden_death') ? renderBeamerSoundRow(evt, 'rider_eliminated', t('beamer.soundRiderEliminatedLabel')) : ''}
      ${isGameModeEnabled(evt, 'first_n') ? renderBeamerSoundRow(evt, 'bonus_secured', t('beamer.soundBonusSecuredLabel')) : ''}
      ${isGameModeEnabled(evt, 'prerequisite') ? renderBeamerSoundRow(evt, 'checkpoint_revealed', t('beamer.soundCheckpointRevealedLabel')) : ''}
      ` : ''}
    </div>
  `;
}

/* ---------------- beamer bootstrap ---------------- */
async function initBeamer(){
  const eventId = beamerEventIdFromHash();
  if(!(await initStorageBackend())) return;
  document.documentElement.setAttribute('data-theme', 'dunkel');
  const appEl = document.getElementById('app');
  const rootEl = document.getElementById('beamer-root');
  if(appEl) appEl.style.display = 'none';
  if(rootEl) rootEl.style.display = 'flex';
  beamerState = {eventId, evt: null, phase: 'loading', audioBlocked: false};
  await loadBeamerEvent();
  if(!beamerState.evt){
    renderBeamer();
    return;
  }
  beamerState.phase = (beamerState.evt.status === 'running' || beamerState.evt.status === 'completed') ? 'live' : 'countdown';
  renderBeamer();
  requestWakeLock();
  beamerPollInterval = setInterval(async () => { await loadBeamerEvent(); renderBeamer(); }, 7000);
  beamerTickInterval = setInterval(updateBeamerTick, 1000);
  const ch = getBeamerChannel();
  if(ch){
    ch.onmessage = (e) => {
      const data = e.data;
      if(!data || data.eventId !== eventId) return;
      if(data.type === 'race-started' && beamerState.phase === 'countdown') triggerGoSequence();
      else loadBeamerEvent().then(renderBeamer);
    };
  }
  const liveCh = getLiveSyncChannel();
  if(liveCh){
    liveCh.onmessage = (e) => {
      const data = e.data;
      if(!data || data.eventId !== eventId) return;
      handleLiveEvent(data.entry);
    };
  }
  window.addEventListener('hashchange', () => location.reload());
}
async function loadBeamerEvent(){
  const prevEliminated = (beamerState.evt && beamerState.phase === 'live')
    ? new Set((beamerState.evt.riders || []).filter(r => r.raceStatus === 'eliminated').map(r => r.bib))
    : null;
  const raw = await loadEvent(beamerState.eventId);
  if(!raw) return;
  beamerState.evt = withEventDefaults(raw);
  registerEventSounds(beamerState.evt);
  if(prevEliminated){
    const newlyEliminated = (beamerState.evt.riders || []).find(r => r.raceStatus === 'eliminated' && !prevEliminated.has(r.bib));
    if(newlyEliminated) triggerBeamerEliminationOverlay(newlyEliminated.name || ('#' + newlyEliminated.bib));
  }
}
function computeBeamerRegistered(evt){
  return (evt.riders || []).filter(r => (r.name || '').trim()).length;
}
function sortBeamerRiders(evt){
  const named = (evt.riders || []).filter(r => (r.name || '').trim());
  const finished = named.filter(r => r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated')
    .sort((a, b) => new Date(a.finishTime) - new Date(b.finishTime));
  const underway = named.filter(r => !r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated')
    .sort((a, b) => (b.completed || []).length - (a.completed || []).length || a.bib - b.bib);
  const dnfDns = named.filter(r => r.raceStatus === 'dnf' || r.raceStatus === 'dns' || r.raceStatus === 'eliminated');
  return {finished, underway, dnfDns};
}

/* ---------------- render ---------------- */
function renderBeamer(){
  const root = document.getElementById('beamer-root');
  if(!root) return;
  if(!beamerState || !beamerState.evt){
    root.innerHTML = `<div class="beamer-message">${t('beamer.eventNotFound')}</div>`;
    return;
  }
  if(beamerState.overlay){ root.innerHTML = renderBeamerEliminationOverlay(beamerState.overlay.name); return; }
  if(beamerState.phase === 'go'){ root.innerHTML = renderBeamerGoOverlay(); return; }
  if(beamerState.phase === 'live'){
    root.innerHTML = renderBeamerLivePhase(beamerState.evt);
    if(getBeamerLayout(beamerState.evt).showZoneMap) updateBeamerZoneMap(beamerState.evt);
    return;
  }
  root.innerHTML = renderBeamerCountdownPhase(beamerState.evt);
}
function renderBeamerCountdownPhase(evt){
  const info = computeStartCountdown(evt);
  const countdownText = info.mode === 'until' ? formatCountdown(info.ms) : t('beamer.waitingForStart');
  return `
    <div class="beamer-phase beamer-countdown-phase">
      <div class="beamer-event-name">${escapeHtml(evt.name || t('common.unnamedEvent'))}</div>
      <div class="beamer-countdown" id="beamer-countdown-value">${countdownText}</div>
      <div class="beamer-registered">${t('beamer.registeredRidersLabel')}: ${computeBeamerRegistered(evt)}</div>
    </div>
  `;
}
function renderBeamerGoOverlay(){
  return `
    <div class="beamer-go-overlay">
      <div class="beamer-go-text">${t('beamer.goText')}</div>
      ${beamerState.audioBlocked ? `<div class="beamer-audio-unlock" onclick="dismissBeamerAudioBlock()">🔊 ${t('beamer.clickToActivateAudio')}</div>` : ''}
    </div>
  `;
}
/* Spec 15.1: optionale Einblendung nach Rennende — bewusst kein eigener
   Vollbild-Podium-Screen (15.6 führt den als separate, zurückgestellte
   Ergänzung), nur eine zweite Banner-Zeile neben der bestehenden
   "Rennen abgeschlossen"-Anzeige, verlinkt auf die Anfahrtsroute. */
function renderBeamerAfterpartyBanner(evt){
  const afterparty = getEventLocation(evt, 'afterparty');
  if(!eventLocationHasPosition(afterparty)) return '';
  const name = escapeHtml(afterparty.name || t('eventLocations.afterpartyLabel'));
  const origin = afterpartyRouteOrigin(evt);
  const text = t('beamer.afterpartyBanner', {name});
  return `<div class="beamer-afterparty-banner">🎉 ${origin ? `<a href="${mapsDirectionsLink(origin, afterparty)}" target="_blank" rel="noopener">${text}</a>` : text}</div>`;
}
function beamerProgressLabel(evt, r){
  const total = (evt.checkpoints || []).length;
  return `${(r.completed || []).length}/${total}`;
}
function beamerElapsedFinish(evt, r){
  if(!evt.startConfirmedAt || !r.finishTime) return '—';
  const ms = new Date(r.finishTime) - new Date(evt.startConfirmedAt);
  return isNaN(ms) ? '—' : formatCountdown(ms);
}
function renderBeamerTimeLeaderboard(evt){
  const {finished, underway, dnfDns} = sortBeamerRiders(evt);
  const rows = [
    ...finished.map((r, i) => `
      <tr>
        <td class="beamer-lb-rank">${i + 1}</td>
        <td class="beamer-lb-name">${escapeHtml(r.name || '—')}</td>
        <td class="beamer-lb-bib">#${r.bib}</td>
        <td class="beamer-lb-progress">${beamerProgressLabel(evt, r)}</td>
        <td class="beamer-lb-time">${beamerElapsedFinish(evt, r)}</td>
      </tr>
    `),
    ...underway.map(r => `
      <tr class="beamer-lb-underway">
        <td class="beamer-lb-rank">–</td>
        <td class="beamer-lb-name">${escapeHtml(r.name || '—')}</td>
        <td class="beamer-lb-bib">#${r.bib}</td>
        <td class="beamer-lb-progress">${beamerProgressLabel(evt, r)}</td>
        <td class="beamer-lb-time">${t('beamer.underwayLabel')}</td>
      </tr>
    `)
  ].join('');
  return `
    ${rows ? `
      <table class="beamer-lb-table">
        <thead><tr><th>${t('beamer.tableRank')}</th><th>${t('beamer.tableName')}</th><th>${t('beamer.tableBib')}</th><th>${t('beamer.tableProgress')}</th><th>${t('beamer.tableTime')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    ` : `<div class="beamer-message">${t('beamer.noFinishersYet')}</div>`}
    ${dnfDns.length ? `<div class="beamer-lb-footer">${t('beamer.dnsDnfFooter', {count: dnfDns.length})}</div>` : ''}
  `;
}
function renderBeamerLivePhase(evt){
  const info = computeStartCountdown(evt);
  const clockLabel = evt.status === 'completed' ? t('beamer.raceDurationLabel') : t('beamer.raceClockLabel');
  const clockText = (info.mode === 'since' || info.mode === 'duration') ? formatCountdown(info.ms) : '—';
  const layout = getBeamerLayout(evt);
  return `
    <div class="beamer-phase beamer-live-phase">
      <div class="beamer-live-head">
        <div class="beamer-event-name">${escapeHtml(evt.name || t('common.unnamedEvent'))}</div>
        <div class="beamer-race-clock"><span>${clockLabel}</span> <span id="beamer-race-clock">${clockText}</span></div>
      </div>
      ${evt.status === 'completed' ? `
        <div class="beamer-completed-banner">🏁 ${t('beamer.raceCompletedBanner')}</div>
        ${renderBeamerAfterpartyBanner(evt)}
      ` : ''}
      <div class="beamer-live-body ${layout.showZoneMap ? 'has-zone-map' : ''}">
        <div class="beamer-live-main">
          ${layout.showPointsBoard ? renderBeamerPointsBoard(evt) : renderBeamerTimeLeaderboard(evt)}
        </div>
        ${layout.showZoneMap ? renderBeamerZoneSide(evt) : ''}
      </div>
      ${layout.showEventTicker ? renderBeamerTicker(evt) : ''}
    </div>
  `;
}

/* ---------------- GO trigger + live tick ---------------- */
async function triggerGoSequence(){
  if(!beamerState) return;
  clearTimeout(beamerGoTimeout);
  beamerState.phase = 'go';
  beamerState.audioBlocked = false;
  renderBeamer();
  const played = await AlleycatSounds.play('race_start');
  if(!played && AlleycatSounds.isRegistered('race_start')){
    beamerState.audioBlocked = true;
    renderBeamer();
  }
  beamerGoTimeout = setTimeout(async () => {
    await loadBeamerEvent();
    beamerState.phase = 'live';
    beamerState.audioBlocked = false;
    renderBeamer();
  }, 4000);
}
function dismissBeamerAudioBlock(){
  if(!beamerState) return;
  beamerState.audioBlocked = false;
  AlleycatSounds.play('race_start');
  renderBeamer();
}
function updateBeamerTick(){
  if(!beamerState || !beamerState.evt) return;
  if(beamerState.phase === 'countdown'){
    const el = document.getElementById('beamer-countdown-value');
    if(!el) return;
    const info = computeStartCountdown(beamerState.evt);
    el.textContent = info.mode === 'until' ? formatCountdown(info.ms) : t('beamer.waitingForStart');
  } else if(beamerState.phase === 'live'){
    const el = document.getElementById('beamer-race-clock');
    if(!el) return;
    const info = computeStartCountdown(beamerState.evt);
    el.textContent = (info.mode === 'since' || info.mode === 'duration') ? formatCountdown(info.ms) : '—';
  }
}


/* ---------------- beamer modes ----------------
   Game-mode-aware beamer widgets, kept in their own module (separate
   from beamer.js) so an event with no active game mode renders the
   beamer exactly as in Phase 8 — getBeamerLayout() below is the single
   switchboard every one of these widgets is gated behind. */
function getBeamerLayout(evt){
  const modes = (evt.gameModes || []).filter(m => m.enabled);
  return {
    /* Any organizer-drawn zone counts, not just Battle Royale — Bezirke and
       plain, mode-less zones deserve beamer visibility too. Legacy events
       that enabled zone_active before Paket 4's zones.js existed still have
       no evt.zones entry at all, so the mode-enabled check stays as a
       fallback (updateBeamerZoneMap() below draws its own centroid+stage
       circle in exactly that case). */
    showZoneMap: (evt.zones || []).some(z => !(z.hiddenOnBeamerUntilActive && !z.active)) || modes.some(m => m.type === 'zone_active'),
    showPointsBoard: evt.scoringMode === 'points',
    showEventTicker: modes.length > 0,
    showZoneCountdown: modes.some(m => m.type === 'zone_active' && m.config.triggerMode !== 'manual')
  };
}
