/* ---------------- zone map (Battle Royale) ----------------
   grau = per-CP-Sperre (cp.locked, unabhängig von der Zone), rot =
   offen aber außerhalb der aktuellen Zonen-Stufe (isCpClosedByZone),
   grün = offen und in der Zone, ausgeblendet = geheim+nicht enthüllt
   (isCpRevealed filtert diese schon vor dem Rendern raus). Nutzt
   denselben Offline-Kachel-Cache wie die Editor-Karte (map.js). */
let beamerZoneMap = null;
function beamerZoneCountdownText(evt, mode){
  const stages = (mode.config && mode.config.stages) || [];
  const currentIdx = evt.ruleRuntimeState && Number.isInteger(evt.ruleRuntimeState.zoneStage) ? evt.ruleRuntimeState.zoneStage : -1;
  const next = stages[currentIdx + 1];
  if(!next || !evt.startConfirmedAt) return null;
  const targetMs = new Date(evt.startConfirmedAt).getTime() + next.atMinute * 60000;
  const remaining = targetMs - Date.now();
  return remaining > 0 ? formatCountdown(remaining) : null;
}
function updateBeamerZoneMap(evt){
  const container = document.getElementById('beamer-zone-map');
  if(!container) return;
  if(beamerZoneMap){ beamerZoneMap.remove(); beamerZoneMap = null; }
  const brMode = getGameMode(evt, 'zone_active');
  /* Draw every organizer-drawn zone generically (circle live-shrink-aware
     via effectiveZoneRadius(), polygon as-is) — this already covers a
     Battle-Royale zone that's linked via mode.config.zoneId, since
     advanceZoneStage() keeps that zone's own radiusMeters in sync. The
     legacy red stage circle below only fires for pre-Paket-4 zone_active
     events that never picked a real zone (auto-centroid fallback), so
     nothing is drawn twice. */
  const zones = (evt.zones || []).filter(z => !(z.hiddenOnBeamerUntilActive && !z.active));
  const hasLegacyBrCircle = brMode && brMode.enabled && !(brMode.config && brMode.config.zoneId);
  if(!zones.length && !hasLegacyBrCircle) return;
  const firstZoneCenter = zones.length ? (zones[0].type === 'circle' ? zones[0].center : polygonCentroid(zones[0].points)) : null;
  const center = firstZoneCenter || (brMode ? zoneActiveCenterOf(evt, brMode) : zoneCenterOf(evt));
  if(!center) return;
  beamerZoneMap = L.map(container, {zoomControl: false, attributionControl: false, scrollWheelZoom: false}).setView([center.lat, center.lng], 14);
  createOfflineTileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
    subdomains: 'abcd', maxZoom: 20
  }).addTo(beamerZoneMap);
  zones.forEach(zone => {
    if(zone.type === 'circle' && zone.center){
      L.circle([zone.center.lat, zone.center.lng], {radius: effectiveZoneRadius(zone, evt), color: zone.color, weight: 2, fillOpacity: 0.08}).addTo(beamerZoneMap);
    } else if(zone.type === 'polygon' && zone.points && zone.points.length >= 3){
      L.polygon(zone.points.map(p => [p.lat, p.lng]), {color: zone.color, weight: 2, fillOpacity: 0.08}).addTo(beamerZoneMap);
    }
  });
  if(hasLegacyBrCircle){
    const stage = currentZoneStage(evt, brMode);
    if(stage) L.circle([center.lat, center.lng], {radius: stage.radius, color: '#e0435b', weight: 2, fillOpacity: 0.08}).addTo(beamerZoneMap);
  }
  const bounds = [];
  (evt.checkpoints || []).filter(cp => isCpRevealed(evt, cp) && Number.isFinite(cp.lat) && Number.isFinite(cp.lng)).forEach(cp => {
    const color = cp.locked ? '#888888' : (isCpClosedByZone(evt, cp) ? '#e0435b' : '#3fb950');
    L.circleMarker([cp.lat, cp.lng], {radius: 7, color, fillColor: color, fillOpacity: 0.9, weight: 2}).addTo(beamerZoneMap);
    bounds.push([cp.lat, cp.lng]);
  });
  if(bounds.length) beamerZoneMap.fitBounds(L.latLngBounds(bounds).pad(0.2));
}
function renderBeamerZoneSide(evt){
  const layout = getBeamerLayout(evt);
  if(!layout.showZoneMap) return '';
  const mode = getGameMode(evt, 'zone_active');
  const countdown = mode && layout.showZoneCountdown ? beamerZoneCountdownText(evt, mode) : null;
  return `
    <div class="beamer-live-side">
      <div id="beamer-zone-map" class="beamer-zone-map"></div>
      ${countdown ? `<div class="beamer-zone-countdown">${t('gameModes.zoneNextShrinkIn', {time: countdown})}</div>` : ''}
    </div>
  `;
}

/* ---------------- offline map tiles ----------------
   Best-effort Offline-Kartenkacheln-Cache: eigene, von der App-Storage
   (storageGet/Set/Delete) unabhängige IndexedDB (reines Browser-Feature,
   pro Gerät, unabhängig vom Storage-Backend — funktioniert identisch in
   beiden Varianten, daher kein Storage-Seam nötig). Tiles werden per
   z/x/y-Schlüssel gecacht (unabhängig vom Event, da sich Kartenausschnitte
   zwischen Events überschneiden können); nur der "zuletzt aktualisiert"-
   Zeitstempel (`evt.tileCacheUpdatedAt`) ist pro Event. */
const TILES_IDB_DB = 'alleycat-tiles';
const TILES_IDB_STORE = 'tiles';
const OFFLINE_TILE_URL_TEMPLATE = 'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png';
const OFFLINE_TILE_ZOOM_MIN = 13;
const OFFLINE_TILE_ZOOM_MAX = 17;
const OFFLINE_TILE_BUFFER_METERS = 500;
const OFFLINE_TILE_AVG_KB = 22;
const TILE_GREY_PLACEHOLDER = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22256%22 height=%22256%22%3E%3Crect width=%22256%22 height=%22256%22 fill=%22%23ccc%22/%3E%3C/svg%3E';

function tileCacheKey(z, x, y){ return `${z}/${x}/${y}`; }
function tileUrl(z, x, y){ return OFFLINE_TILE_URL_TEMPLATE.replace('{z}', z).replace('{x}', x).replace('{y}', y); }
function tilesIdbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(TILES_IDB_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(TILES_IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getTileFromCache(key){
  try{
    const db = await tilesIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(TILES_IDB_STORE, 'readonly');
      const req = tx.objectStore(TILES_IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function putTileInCache(key, blob){
  try{
    const db = await tilesIdbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(TILES_IDB_STORE, 'readwrite');
      tx.objectStore(TILES_IDB_STORE).put(blob, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error('Kartenkachel-Cache schreiben fehlgeschlagen', e); }
}
async function getTileCacheStats(){
  try{
    const db = await tilesIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(TILES_IDB_STORE, 'readonly');
      let count = 0, bytes = 0;
      const req = tx.objectStore(TILES_IDB_STORE).openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if(cursor){
          count++;
          bytes += (cursor.value && cursor.value.size) || 0;
          cursor.continue();
        } else resolve({count, bytes});
      };
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return {count: 0, bytes: 0}; }
}

/* ---------------- bbox + tile-index math ---------------- */
function lonToTileX(lon, z){ return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
function latToTileY(lat, z){
  const rad = lat * Math.PI / 180;
  return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z));
}
function computeCheckpointBoundsWithBuffer(checkpoints, bufferMeters){
  const lats = checkpoints.map(c => c.lat), lngs = checkpoints.map(c => c.lng);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const latBuf = bufferMeters / 111320;
  const midLat = (minLat + maxLat) / 2;
  const lngBuf = bufferMeters / (111320 * Math.max(0.1, Math.cos(midLat * Math.PI / 180)));
  return {minLat: minLat - latBuf, maxLat: maxLat + latBuf, minLng: minLng - lngBuf, maxLng: maxLng + lngBuf};
}
function tilesInBounds(bounds, zMin, zMax){
  const tiles = [];
  for(let z = zMin; z <= zMax; z++){
    const xMin = lonToTileX(bounds.minLng, z), xMax = lonToTileX(bounds.maxLng, z);
    const yMin = latToTileY(bounds.maxLat, z), yMax = latToTileY(bounds.minLat, z);
    for(let x = Math.min(xMin, xMax); x <= Math.max(xMin, xMax); x++){
      for(let y = Math.min(yMin, yMax); y <= Math.max(yMin, yMax); y++){
        tiles.push({z, x, y});
      }
    }
  }
  return tiles;
}
function tilesForEvent(evt){
  const withPos = (evt.checkpoints || []).filter(c => Number.isFinite(c.lat) && Number.isFinite(c.lng));
  if(!withPos.length) return [];
  const bounds = computeCheckpointBoundsWithBuffer(withPos, OFFLINE_TILE_BUFFER_METERS);
  return tilesInBounds(bounds, OFFLINE_TILE_ZOOM_MIN, OFFLINE_TILE_ZOOM_MAX);
}

/* ---------------- download orchestration ---------------- */
async function cacheTileList(tiles, onProgress){
  let done = 0, failed = 0;
  let idx = 0;
  async function worker(){
    while(idx < tiles.length){
      const tile = tiles[idx++];
      const key = tileCacheKey(tile.z, tile.x, tile.y);
      try{
        const existing = await getTileFromCache(key);
        if(!existing){
          const res = await fetch(tileUrl(tile.z, tile.x, tile.y));
          if(!res.ok) throw new Error('HTTP ' + res.status);
          await putTileInCache(key, await res.blob());
        }
      }catch(e){ failed++; }
      done++;
      if(onProgress) onProgress({done, total: tiles.length, failed});
    }
  }
  await Promise.all(Array.from({length: Math.min(6, tiles.length)}, worker));
  return {done, failed};
}

/* ---------------- Leaflet integration ---------------- */
function createOfflineTileLayer(urlTemplate, options){
  const OfflineTileLayer = L.TileLayer.extend({
    createTile(coords, done){
      const tile = document.createElement('img');
      tile.alt = '';
      const key = tileCacheKey(coords.z, coords.x, coords.y);
      getTileFromCache(key).then(blob => {
        if(blob){
          tile.src = URL.createObjectURL(blob);
          done(null, tile);
          return;
        }
        tile.onload = () => done(null, tile);
        tile.onerror = () => {
          tile.onerror = null;
          tile.src = TILE_GREY_PLACEHOLDER;
          done(null, tile);
        };
        tile.src = this.getTileUrl(coords);
      });
      return tile;
    }
  });
  return new OfflineTileLayer(urlTemplate, options);
}

/* ---------------- dashboard-todo staleness helper ---------------- */
function offlineTileCacheStaleness(evt){
  if(!evt.tileCacheUpdatedAt) return null;
  const ageMs = Date.now() - new Date(evt.tileCacheUpdatedAt).getTime();
  if(ageMs > 3 * 86400000) return 'danger';
  if(ageMs > 86400000) return 'warn';
  return null;
}

/* ---------------- settings: "Offline-Bereitschaft" ---------------- */
let offlineUiState = {loaded: false, events: [], selected: {}, busy: false, progress: null};
async function refreshOfflineReadiness(){
  offlineUiState.loaded = false;
  const all = await Promise.all(state.eventsIndex.map(e => loadEvent(e.id)));
  offlineUiState.events = all.filter(e => e && (e.status === 'ready' || e.status === 'running')).map(withEventDefaults);
  offlineUiState.loaded = true;
  if(state.view === 'settings') renderSettings();
}
function toggleOfflineEventSelected(id, checked){
  offlineUiState.selected[id] = checked;
  renderSettings();
}
function computeOfflineEstimateForSelected(){
  let tileCount = 0;
  offlineUiState.events.forEach(evt => {
    if(offlineUiState.selected[evt.id]) tileCount += tilesForEvent(evt).length;
  });
  return {tileCount, estimatedMB: tileCount * OFFLINE_TILE_AVG_KB / 1024};
}
async function cacheSelectedOfflineEvents(){
  const selectedEvents = offlineUiState.events.filter(evt => offlineUiState.selected[evt.id]);
  if(!selectedEvents.length || offlineUiState.busy) return;
  if(!state.appSettings.offlineCacheHintShown){
    state.appSettings.offlineCacheHintShown = true;
    saveAppSettings();
    alert(t('offlineTiles.firstTimeHint'));
  }
  offlineUiState.busy = true;
  offlineUiState.progress = {done: 0, total: 0, failed: 0};

  for(const evt of selectedEvents){
    const tiles = tilesForEvent(evt);
    await cacheTileList(tiles, (p) => {
      offlineUiState.progress = p;
      renderSettings();
    });
    evt.tileCacheUpdatedAt = toLocalDateTimeInputValue(new Date());
    await storageSet('event:' + evt.id, JSON.stringify(evt));
    if(state.currentEvent && state.currentEvent.id === evt.id) state.currentEvent.tileCacheUpdatedAt = evt.tileCacheUpdatedAt;
  }
  offlineUiState.busy = false;
  offlineUiState.progress = null;
  await refreshOfflineReadiness();
}
function renderOfflineReadinessSection(){

    return `
      <div class="settings-section" id="offline-readiness-section">

      <span class="offline-event-meta">${evt.tileCacheUpdatedAt ? t('offlineTiles.cachedAt', {time: formatDateTime(evt.tileCacheUpdatedAt)}) : t('offlineTiles.neverCached')}</span>

  const progressHtml = offlineUiState.busy && offlineUiState.progress ? `

  ` : '';
  return `
    <div class="settings-section" id="offline-readiness-section">
      <h3>${t('offlineTiles.heading')}</h3>
      <div class="settings-section-desc">${t('offlineTiles.desc')}</div>
      <div class="offline-event-list">${rows}</div>

        <span class="settings-section-desc" style="margin:0;">${t('offlineTiles.estimateText', {tiles: estimate.tileCount, mb: estimate.estimatedMB.toFixed(1)})}</span>
      </div>
      ${progressHtml}
      <div class="data-safety-row" id="tile-cache-total-row">${t('offlineTiles.totalLoading')}</div>
    </div>

async function refreshTileCacheTotal(){

/* ---------------- data safety & offline platform features ----------------
   Auto-Backup (Download-Intervall via exportBackupBlob() storage seam),
   Beforeunload-Warnung + Header-Hinweis während "Läuft", Wake Lock
   (Bildschirm bleibt an bei laufendem Check-in / im Beamer), und die
   Storage-APIs (persist/estimate) — alles backend-unabhängig bis auf
   den einen Seam (exportBackupBlob), analog zu initStorageBackend()/
   renderStorageDashboardExtras(). */

/* ---------------- auto-backup ---------------- */
let autoBackupInterval = null;
function formatMinutesAgo(iso){
  if(!iso) return null;
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return mins < 1 ? t('dataSafety.justNow') : t('dataSafety.minutesAgo', {mins});
}
function startAutoBackup(){
  if(autoBackupInterval) clearInterval(autoBackupInterval);
  const minutes = (state.appSettings && state.appSettings.autoBackupIntervalMinutes) || 10;
  autoBackupInterval = setInterval(runAutoBackupTick, minutes * 60000);
}
async function runAutoBackupTick(){
  if(!state.appSettings.autoBackupEnabled) return;
  const evt = state.currentEvent;
  if(!evt || evt.status !== 'running') return;
  await triggerBackupNow(true);
}
async function triggerBackupNow(silent){
  const evt = state.currentEvent;
  if(!evt || typeof exportBackupBlob !== 'function') return;
  const backup = await exportBackupBlob(evt);
  if(!backup) return;
  if(!state.appSettings.autoBackupHintShown){
    state.appSettings.autoBackupHintShown = true;
    saveAppSettings();
    alert(t('dataSafety.multiDownloadHint'));
  }
  downloadBlob(backup.blob, backup.filename);
  evt.lastBackupAt = toLocalDateTimeInputValue(new Date());
  debouncedSave();
  if(!silent) showToast({message: t('dataSafety.backupTriggered')});
  if(state.view === 'overview') renderOverview();
}
function onAutoBackupIntervalChange(value){
  state.appSettings.autoBackupIntervalMinutes = Math.max(1, Math.min(180, parseInt(value, 10) || 10));
  saveAppSettings();
  startAutoBackup();
  render();
}
function onAutoBackupEnabledChange(checked){
  state.appSettings.autoBackupEnabled = !!checked;
  saveAppSettings();
  render();
}

/* ---------------- beforeunload warning (only while a race is running) ---------------- */
window.addEventListener('beforeunload', (e) => {
  if(state.currentEvent && state.currentEvent.status === 'running'){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ---------------- wake lock ---------------- */
let wakeLock = null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return false;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
    return true;
  }catch(e){ return false; }
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', async () => {
  if(wakeLock && document.visibilityState === 'visible') await requestWakeLock();
});
function syncWakeLockForView(){
  const shouldHold = state.view === 'checkin' && state.currentEvent && state.currentEvent.status === 'running';
  if(shouldHold && !wakeLock) requestWakeLock();
  else if(!shouldHold && wakeLock) releaseWakeLock();
}

/* ---------------- storage APIs (persist + estimate) ---------------- */
async function requestPersistentStorage(){
  if(!(navigator.storage && navigator.storage.persist)) return null;
  if(await navigator.storage.persisted()) return true;
  return await navigator.storage.persist();
}
function armPersistentStorageRequest(){
  let alreadyAsked = false;
  try{ alreadyAsked = !!localStorage.getItem('alleycat:persistRequested'); }catch(e){}
  if(alreadyAsked) return;
  const handler = () => {
    document.removeEventListener('click', handler);
    requestPersistentStorage();
    try{ localStorage.setItem('alleycat:persistRequested', '1'); }catch(e){}
  };
  document.addEventListener('click', handler, {once: true});
}
async function getStorageEstimate(){
  if(!(navigator.storage && navigator.storage.estimate)) return null;
  const {usage, quota} = await navigator.storage.estimate();
  return {usedMB: usage / 1048576, quotaMB: quota / 1048576, percentUsed: quota ? (usage / quota * 100) : 0};
}
async function refreshStorageEstimate(){
  const el = document.getElementById('storage-estimate-value');
  if(!el) return;
  const est = await getStorageEstimate();
  el.textContent = est
    ? t('dataSafety.storageEstimateText', {used: est.usedMB.toFixed(1), quota: est.quotaMB.toFixed(0), percent: est.percentUsed.toFixed(0)})
    : t('dataSafety.storageEstimateUnsupported');
  const warnEl = document.getElementById('storage-estimate-warning');
  if(warnEl) warnEl.style.display = (est && est.percentUsed > 80) ? 'block' : 'none';
}
async function onRequestPersistentStorageClick(){
  const ok = await requestPersistentStorage();
  const el = document.getElementById('persistent-storage-status');
  if(el) el.textContent = ok ? t('dataSafety.persistGranted') : t('dataSafety.persistDenied');
}

/* ---------------- command palette ----------------
   Global Cmd/Ctrl+K overlay: fuzzy search across navigation, riders,
   checkpoints and a handful of quick actions. No external fuzzy-match
   library — a small substring/subsequence scorer is enough at this
   app's data scale (dozens, not thousands, of riders/checkpoints).
   Rendered into #command-palette-root, a template sibling of #app
   (same pattern as #error-boundary-root/#beamer-root), so it overlays
   regardless of the currently active view. */
function commandPaletteFuzzyScore(text, query){
  const hay = (text || '').toLowerCase();
  const q = (query || '').toLowerCase().trim();
  if(!q) return 0;
  const idx = hay.indexOf(q);
  if(idx !== -1) return 1000 - idx;
  let hi = 0;
  for(let qi = 0; qi < q.length; qi++){
    hi = hay.indexOf(q[qi], hi);
    if(hi === -1) return -1;
    hi++;
  }
  return 1;
}
function buildCommandPaletteItems(){
  const items = [];
  const evt = state.currentEvent;
  const navCat = t('commandPalette.catNav');
  items.push({category: navCat, icon: '⌂', label: t('ui.headquarter'), run: () => goDashboard()});
  items.push({category: navCat, icon: '⚙', label: t('settings.title'), run: () => openSettings()});
  if(evt){
    items.push({category: navCat, icon: '▦', label: t('ui.navOverview'), run: () => openOverview()});
    items.push({category: navCat, icon: '📍', label: t('ui.navMap'), run: () => openEditor(evt.id)});
    items.push({category: navCat, icon: '👤', label: t('ui.navRiders'), run: () => openRiders()});
    items.push({category: navCat, icon: '🏁', label: t('ui.navCheckin'), run: () => openCheckin()});
    items.push({category: navCat, icon: '🏆', label: t('ui.navLeaderboard'), run: () => openLeaderboard()});
    items.push({category: navCat, icon: '📄', label: t('ui.navManifest'), run: () => openManifest()});

    const riderCat = t('commandPalette.catRiders');
    (evt.riders || []).filter(r => r.name).forEach(r => {
      const team = getTeam(evt, r.teamId);
      items.push({
        category: riderCat,
        icon: '👤',
        label: `#${r.bib} ${r.name}`,
        sublabel: team ? team.name : '',
        searchText: `${r.bib} ${r.name} ${team ? team.name : ''}`,
        run: () => openRiders()
      });
    });

    const cpCat = t('commandPalette.catCheckpoints');
    evt.checkpoints.forEach(cp => {
      items.push({
        category: cpCat,
        icon: '📍',
        label: cp.name || t('checkpoint.noName'),
        sublabel: typeLabel(cp.type),
        searchText: `${cp.name || ''} ${typeLabel(cp.type)} ${cp.clue || ''}`,
        run: async () => {
          if(state.view !== 'editor') await openEditor(evt.id);
          setTimeout(() => selectCp(cp.id), 60);
        }
      });
    });

    const actionCat = t('commandPalette.catActions');
    if(evt.status === 'ready'){
      items.push({category: actionCat, icon: '🏁', label: t('commandPalette.actionStartRace'), run: () => onStatusSelectChange('running')});
    }
    items.push({category: actionCat, icon: '💾', label: t('commandPalette.actionBackupNow'), run: () => triggerBackupNow(false)});
  }
  const actionCat = t('commandPalette.catActions');
  Object.entries(THEMES).forEach(([key, th]) => {
    if(state.appSettings.theme === key) return;
    items.push({category: actionCat, icon: '🎨', label: t('commandPalette.actionSwitchTheme', {name: th.label()}), run: () => setTheme(key)});
  });
  return items;
}
function filteredCommandPaletteItems(){
  const items = buildCommandPaletteItems();
  const q = state.commandPaletteQuery.trim();
  if(!q) return items.slice(0, 40);
  return items
    .map(item => ({item, score: Math.max(
      commandPaletteFuzzyScore(item.label, q),
      commandPaletteFuzzyScore(item.sublabel || '', q),
      commandPaletteFuzzyScore(item.searchText || '', q)
    )}))
    .filter(x => x.score > -1)
    .sort((a, b) => b.score - a.score)
    .slice(0, 40)
    .map(x => x.item);
}
function openCommandPalette(){
  state.commandPaletteOpen = true;
  state.commandPaletteQuery = '';
  state.commandPaletteActiveIndex = 0;
  renderCommandPalette();
  setTimeout(() => {
    const input = document.getElementById('command-palette-input');
    if(input) input.focus();
  }, 0);
}
function closeCommandPalette(){
  state.commandPaletteOpen = false;
  renderCommandPalette();
}
function toggleCommandPalette(){
  if(state.commandPaletteOpen) closeCommandPalette(); else openCommandPalette();
}
function onCommandPaletteInput(value){
  state.commandPaletteQuery = value;
  state.commandPaletteActiveIndex = 0;
  renderCommandPaletteList();
}
function runCommandPaletteItem(index){
  const items = filteredCommandPaletteItems();
  const item = items[index];
  if(!item) return;
  closeCommandPalette();
  item.run();
}
function onCommandPaletteKeydown(e){
  const items = filteredCommandPaletteItems();
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    state.commandPaletteActiveIndex = Math.min(items.length - 1, state.commandPaletteActiveIndex + 1);
    renderCommandPaletteList();
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    state.commandPaletteActiveIndex = Math.max(0, state.commandPaletteActiveIndex - 1);
    renderCommandPaletteList();
  } else if(e.key === 'Enter'){
    e.preventDefault();
    runCommandPaletteItem(state.commandPaletteActiveIndex);
  }
}
function renderCommandPaletteList(){
  const listEl = document.getElementById('command-palette-list');
  if(!listEl) return;
  const items = filteredCommandPaletteItems();
  if(state.commandPaletteActiveIndex >= items.length) state.commandPaletteActiveIndex = Math.max(0, items.length - 1);
  let lastCategory = null;
  listEl.innerHTML = items.length ? items.map((item, i) => {
    const heading = item.category !== lastCategory ? `<div class="cmdp-category">${escapeHtml(item.category)}</div>` : '';
    lastCategory = item.category;
    return `
      ${heading}
      <button type="button" class="cmdp-item ${i === state.commandPaletteActiveIndex ? 'active' : ''}" onmouseenter="state.commandPaletteActiveIndex=${i}; renderCommandPaletteList();" onclick="runCommandPaletteItem(${i})">
        <span class="cmdp-item-icon">${item.icon || ''}</span>
        <span class="cmdp-item-text">
          <span class="cmdp-item-label">${escapeHtml(item.label)}</span>
          ${item.sublabel ? `<span class="cmdp-item-sublabel">${escapeHtml(item.sublabel)}</span>` : ''}
        </span>
      </button>
    `;
  }).join('') : `<div class="cmdp-empty">${t('commandPalette.noResults')}</div>`;
}
function renderCommandPalette(){
  const root = document.getElementById('command-palette-root');
  if(!root) return;
  if(!state.commandPaletteOpen){ root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="cmdp-overlay" onclick="closeCommandPalette()">
      <div class="cmdp-box" onclick="event.stopPropagation()">
        <input type="text" id="command-palette-input" class="cmdp-input" placeholder="${t('commandPalette.placeholder')}"
          value="${escapeHtml(state.commandPaletteQuery)}" oninput="onCommandPaletteInput(this.value)" onkeydown="onCommandPaletteKeydown(event)">
        <div class="cmdp-list" id="command-palette-list"></div>
      </div>
    </div>
  `;
  renderCommandPaletteList();
}

/* ---------------- onboarding (geführte Tour) ---------------- */
const ONBOARDING_STEPS = [
  {view: 'dashboard',    selector: '.event-card',           titleKey: 'onboarding.step1Title', textKey: 'onboarding.step1Text'},
  {view: 'editor',       selector: '.cp-list',               titleKey: 'onboarding.step2Title', textKey: 'onboarding.step2Text'},
  {view: 'riders',       selector: '.rider-grid',            titleKey: 'onboarding.step3Title', textKey: 'onboarding.step3Text'},
  {view: 'checkin',      selector: '#checkin-bib-input',     titleKey: 'onboarding.step4Title', textKey: 'onboarding.step4Text'},
  {view: 'leaderboard',  selector: '.leaderboard-table',     titleKey: 'onboarding.step5Title', textKey: 'onboarding.step5Text'},
  {view: 'manifest',     selector: '#manifest-content',      titleKey: 'onboarding.step6Title', textKey: 'onboarding.step6Text'}
];
const ONBOARDING_DEMO_EVENT_NAME = 'Kölner Kurierrennen (Beispiel)';

function findOnboardingTargetEvent(){
  if(!state.eventsIndex.length) return null;
  return state.eventsIndex.find(e => e.name === ONBOARDING_DEMO_EVENT_NAME) || state.eventsIndex[0];
}

function startOnboardingTour(silent){
  const target = findOnboardingTargetEvent();
  if(!target){
    if(!silent) showToast({message: t('onboarding.noEventToast')});
    return;
  }
  state.onboarding = {active: true, stepIndex: 0, eventId: target.id};
  window.removeEventListener('resize', repositionOnboardingOverlay);
  window.addEventListener('resize', repositionOnboardingOverlay);
  goToTourStep(0);
}

function goToTourStep(index){
  if(index < 0 || index >= ONBOARDING_STEPS.length) return;
  const step = ONBOARDING_STEPS[index];
  state.onboarding.stepIndex = index;
  if(state.view !== step.view){
    if(step.view === 'dashboard') goDashboard();
    else if(step.view === 'editor') openEditor(state.onboarding.eventId);
    else if(step.view === 'riders') openRiders();
    else if(step.view === 'checkin') openCheckin();
    else if(step.view === 'leaderboard') openLeaderboard();
    else if(step.view === 'manifest') openManifest();
  }
  setTimeout(() => {
    if(!state.onboarding.active || state.view !== step.view) return;
    renderOnboardingOverlay();
  }, 50);
}

function advanceOnboardingStep(){
  goToTourStep(state.onboarding.stepIndex + 1);
}
function retreatOnboardingStep(){
  goToTourStep(state.onboarding.stepIndex - 1);
}

function finishOnboardingTour(){
  endOnboardingTour();
}
function skipOnboardingTour(){
  endOnboardingTour();
}
function endOnboardingTour(){
  state.onboarding.active = false;
  state.appSettings.onboardingCompleted = true;
  saveAppSettings();
  window.removeEventListener('resize', repositionOnboardingOverlay);
  const root = document.getElementById('onboarding-root');
  if(root){ root.style.display = 'none'; root.innerHTML = ''; }
}

function retryFindOnboardingTarget(selector, attempt){
  const el = document.querySelector(selector);
  if(el || attempt >= 5){ renderOnboardingOverlayFor(el); return; }
  setTimeout(() => {
    if(!state.onboarding.active) return;
    retryFindOnboardingTarget(selector, attempt + 1);
  }, 100);
}

function renderOnboardingOverlay(){
  const step = ONBOARDING_STEPS[state.onboarding.stepIndex];
  const el = document.querySelector(step.selector);
  if(el) renderOnboardingOverlayFor(el);
  else retryFindOnboardingTarget(step.selector, 0);
}

function repositionOnboardingOverlay(){
  if(!state.onboarding || !state.onboarding.active) return;
  renderOnboardingOverlay();
}

function renderOnboardingOverlayFor(targetEl){
  const root = document.getElementById('onboarding-root');
  if(!root) return;
  const step = ONBOARDING_STEPS[state.onboarding.stepIndex];
  const stepNum = state.onboarding.stepIndex + 1;
  const isLast = stepNum === ONBOARDING_STEPS.length;

  let spotlightStyle = 'display:none;';
  let tooltipStyle = 'top:50%; left:50%; transform:translate(-50%,-50%);';

  if(targetEl){
    targetEl.scrollIntoView({block: 'center', behavior: 'auto'});
    const rect = targetEl.getBoundingClientRect();
    const pad = 8;
    const top = Math.max(rect.top - pad, 0);
    const left = Math.max(rect.left - pad, 0);
    const width = rect.width + pad * 2;
    const height = rect.height + pad * 2;
    spotlightStyle = `top:${top}px; left:${left}px; width:${width}px; height:${height}px;`;

    const tooltipWidth = 320;
    const tooltipEstHeight = 180;
    let tooltipTop = top + height + 16;
    if(tooltipTop + tooltipEstHeight > window.innerHeight){
      tooltipTop = Math.max(top - tooltipEstHeight - 16, 16);
    }
    let tooltipLeft = left + width / 2 - tooltipWidth / 2;
    tooltipLeft = Math.min(Math.max(tooltipLeft, 16), window.innerWidth - tooltipWidth - 16);
    tooltipStyle = `top:${tooltipTop}px; left:${tooltipLeft}px;`;
  }

  root.style.display = 'block';
  root.innerHTML = `
    <div class="onboarding-backdrop"></div>
    <div class="onboarding-spotlight" style="${spotlightStyle}"></div>
    <div class="onboarding-tooltip" style="${tooltipStyle}">
      <div class="onboarding-tooltip-step">${t('onboarding.stepCounter', {current: stepNum, total: ONBOARDING_STEPS.length})}</div>
      <h3>${t(step.titleKey)}</h3>
      <p>${t(step.textKey)}</p>
      <div class="onboarding-tooltip-actions">
        <button type="button" class="btn btn-sm" onclick="skipOnboardingTour()">${t('onboarding.skip')}</button>
        <div style="flex:1;"></div>
        ${stepNum > 1 ? `<button type="button" class="btn btn-sm" onclick="retreatOnboardingStep()">${t('onboarding.back')}</button>` : ''}
        <button type="button" class="btn btn-sm btn-primary" onclick="${isLast ? 'finishOnboardingTour()' : 'advanceOnboardingStep()'}">${isLast ? t('onboarding.finish') : t('onboarding.next')}</button>
      </div>
    </div>
  `;
}

/* ---------------- rider QR payloads ----------------
   Erzeugen und Zerlegen der beiden QR-Nutzlasten. Eigene Datei, weil das
   Fahrer-Bundle den Parser braucht, der Rest von rider-sync.js aber an
   state, debouncedSave() und logUndoableAction() hängt — Dinge, die es dort
   nicht gibt. generateEventPublicId() bleibt bewusst drüben: die Fahrer-App
   liest Event-IDs, sie erzeugt keine.                                    */
const RIDER_PUBLIC_ID_RE = /^[a-z0-9]{12}$/;
const RIDER_TOKEN_RE = /^[a-z0-9]{32}$/;
/* ---------------- QR-Nutzlast ----------------
   Zwei Formate, beide als URL, damit ein Scan mit der System-Kamera in der
   App landet statt in einer Fehlermeldung:

     <riderAppUrl>#r.<publicId>.<riderToken>
     <riderAppUrl>#c.<publicId>.<cpId>.<qrToken>

   Das dritte erkannte Format ist die nackte Startnummer. Die stand bis zur
   Rider-App auf jeder Spokecard, und der Marshal-Check-in scannt sie heute
   noch. Sie muss erkannt bleiben, sonst entwertet dieses Release jede
   bereits gedruckte Karte.                                              */
function parseRiderQrPayload(text){
  const raw = String(text == null ? '' : text).trim();
  if(!raw) return null;

  const bare = raw.match(/^#?(\d{1,5})$/);
  if(bare) return {kind: 'legacyBib', bib: parseInt(bare[1], 10)};

  const hashAt = raw.indexOf('#');
  const fragment = hashAt === -1 ? raw : raw.slice(hashAt + 1);
  const parts = fragment.split('.');

  if(parts[0] === 'r' && parts.length === 3){
    const [, publicId, riderToken] = parts;
    if(!RIDER_PUBLIC_ID_RE.test(publicId) || !RIDER_TOKEN_RE.test(riderToken)) return null;
    return {kind: 'rider', publicId, riderToken};
  }
  if(parts[0] === 'c' && parts.length === 4){
    const [, publicId, cpId, qrToken] = parts;
    if(!RIDER_PUBLIC_ID_RE.test(publicId) || !RIDER_TOKEN_RE.test(qrToken) || !cpId) return null;
    return {kind: 'checkpoint', publicId, cpId, qrToken};
  }
  return null;
}

function buildRiderQrPayload(baseUrl, evt, rider){
  return `${baseUrl}#r.${evt.publicId}.${rider.riderToken}`;
}
function buildCheckpointQrPayload(baseUrl, evt, cp){
  return `${baseUrl}#c.${evt.publicId}.${cp.id}.${cp.qrToken}`;
}


/* ---------------- rider sync: reine Funktionen ----------------
   Bindeglied zwischen dem Event-Blob des Organizers und den relationalen
   Rider-Tabellen des Servers. Dieses Modul kennt weder fetch noch einen
   Endpunkt — das lebt hinter den Seams in src/storage/. Hier stehen nur
   Funktionen, die aus Daten Daten machen, damit sie ohne Server und ohne
   Netz testbar bleiben.

   Kernzusage des Moduls ist die Idempotenz von mergeRiderLogRows(): jede
   Log-Zeile darf beliebig oft angewendet werden, ohne das Ergebnis zu
   verändern. Daraus folgt, dass zwei Organizer-Geräte, die dieselbe
   Log-Quelle lesen, auf denselben Stand konvergieren, statt sich
   gegenseitig zu überschreiben.                                        */

/* Ab dieser Entfernung zwischen Scan-Position und Checkpoint gilt ein
   Check-in als auffällig. Großzügig gewählt: GPS in Stadtschluchten ist
   ungenau, und der Wert blockiert nichts — er markiert nur. */
const RIDER_GPS_FLAG_THRESHOLD_M = 500;


function generateEventPublicId(){ return randomStringFromAlphabet(12, RIDER_TOKEN_ALPHABET); }


/* ---------------- Slot-Status ----------------
   Das Blob nutzt '' für "noch niemandem zugeordnet", die Datenbankspalte
   'free' — sie ist NOT NULL und braucht einen benennbaren Default. Genau
   diese eine Sonderregel, und sie lebt nur hier. */
function slotStatusToDb(status){ return status || 'free'; }
function slotStatusFromDb(status){ return status === 'free' ? '' : (status || ''); }

/* ---------------- freie Startnummern ---------------- */
function computeFreeBibs(evt){
  const free = [], pending = [], confirmed = [];
  (evt.riders || []).forEach(r => {
    if(r.riderStatus === 'confirmed') confirmed.push(r.bib);
    else if(r.riderStatus === 'pending') pending.push(r.bib);
    else free.push(r.bib);
  });
  return {free, pending, confirmed};
}

/* ---------------- Merge ----------------
   Wendet Log-Zeilen auf evt.riders an. Rückgabe:
     changed  — ob sich tatsächlich etwas geändert hat. Der Aufrufer darf nur
                dann neu rendern; ein bedingungsloses render() alle paar
                Sekunden zerstört laufende Texteingaben.
     orphans  — Zeilen, deren bib oder cpId es im Event nicht (mehr) gibt.
                Werden nie stillschweigend verworfen: ein Fahrer, der
                nachweislich an einem Punkt war, darf nicht durch einen
                Konfigurationsfehler aus der Wertung fallen.             */
function mergeRiderLogRows(evt, rows){
  let changed = false;
  const orphans = [];
  const ridersByBib = new Map((evt.riders || []).map(r => [r.bib, r]));
  const cpIds = new Set((evt.checkpoints || []).map(cp => cp.id));

  (rows || []).forEach(row => {
    const rider = ridersByBib.get(row.bib);
    if(!rider){ orphans.push(row); return; }

    if(row.type === 'checkin'){
      if(!cpIds.has(row.cp_id)){ orphans.push(row); return; }
      rider.completed = rider.completed || [];
      rider.checkpointTimes = rider.checkpointTimes || {};
      if(!rider.completed.includes(row.cp_id)){
        rider.completed.push(row.cp_id);
        changed = true;
      }
      if(rider.checkpointTimes[row.cp_id] !== row.created_at){
        rider.checkpointTimes[row.cp_id] = row.created_at;
        changed = true;
      }
      const dist = row.gps_distance_m;
      if(Number.isFinite(dist) && dist > RIDER_GPS_FLAG_THRESHOLD_M){
        rider.gpsFlags = rider.gpsFlags || {};
        if(rider.gpsFlags[row.cp_id] !== dist){
          rider.gpsFlags[row.cp_id] = dist;
          changed = true;
        }
      }
    } else if(row.type === 'register'){
      const data = typeof row.payload === 'string' ? safeParseJson(row.payload) : row.payload;
      if(rider.riderStatus !== 'pending'){ rider.riderStatus = 'pending'; changed = true; }
      if(JSON.stringify(rider.pendingData) !== JSON.stringify(data || null)){
        rider.pendingData = data || null;
        changed = true;
      }
    }
  });

  if(orphans.length){
    evt.orphanCheckins = evt.orphanCheckins || [];
    const known = new Set(evt.orphanCheckins.map(o => o.id));
    orphans.forEach(o => {
      if(!known.has(o.id)){ evt.orphanCheckins.push(o); changed = true; }
    });
  }
  return {changed, orphans};
}

function safeParseJson(str){
  try{ return JSON.parse(str); }catch(e){ return null; }
}

/* ---------------- Publish-Nutzlast ----------------
   Die abgespeckte, fahrer-taugliche Sicht auf das Event. Bewusst eine
   Positivliste: es wird aufgezählt, was hinausgeht, statt aufgezählt, was
   zurückgehalten wird. Ein neues Feld im Event-Blob landet damit nicht
   versehentlich auf einem fremden Handy — Namen, Notfallkontakte,
   Rätsellösungen und Personalplanung bleiben hier grundsätzlich außen vor.

   Token werden vor dem Senden gehasht: Klartext-Zugangsdaten verlassen die
   Organizer-App nie, auch nicht über die eigene authentifizierte
   Verbindung.                                                          */
async function buildRiderSyncPayload(evt){
  const slots = await Promise.all((evt.riders || []).map(async r => ({
    bib: r.bib,
    tokenHash: await sha256Hex(r.riderToken),
    codeHash: await sha256Hex(r.riderCode),
    status: slotStatusToDb(r.riderStatus)
  })));
  const checkpoints = await Promise.all((evt.checkpoints || []).map(async (cp, i) => ({
    cpId: cp.id,
    label: cp.name || '',
    /* Der Typ sagt dem Fahrer, was hier zu tun ist. Kein Geheimnis — er
       steht auf dem gedruckten Manifest. Die Beschriftung dazu holt sich
       die Fahrer-App selbst aus ihrer eigenen Typtabelle, hier geht nur
       der Schlüssel raus. */
    cpType: cp.type || '',
    qrTokenHash: await sha256Hex(cp.qrToken),
    qrEnabled: !!cp.qrCheckinEnabled,
    sortIndex: i,
    /* Koordinaten nur, wenn die Kartenansicht für Fahrer freigeschaltet ist.
       Sonst wäre die Checkpoint-Liste eines nicht gestarteten Rennens über
       die öffentliche API abfragbar. */
    lat: evt.riderApp && evt.riderApp.map ? cp.lat : null,
    lon: evt.riderApp && evt.riderApp.map ? cp.lng : null
  })));
  return {
    publicId: evt.publicId,
    storageKey: 'event:' + evt.id,
    name: evt.name || '',
    status: evt.status || 'planning',
    settings: Object.assign({}, evt.riderApp),
    slots,
    checkpoints
  };
}

/* ---------------- Publish ----------------
   Bewusst NICHT an debouncedSave() gehängt: das wäre ein
   Netzwerk-Roundtrip pro Tastendruck. Stattdessen ein eigener,
   deutlich längerer Debounce nach dem erfolgreichen Speichern, plus
   ein sofortiger Publish bei jedem Rennstatuswechsel — dort zählt
   Aktualität, weil rider.php Check-ins nur im Status 'running'
   annimmt. */
let riderPublishTimeout = null;
let riderPublishInFlight = false;
const RIDER_PUBLISH_DEBOUNCE_MS = 3000;

/* Der Wächter bricht eine sonst unvermeidliche Schleife: ein Publish
   kann Token nachrüsten und muss dann speichern, und Speichern plant
   einen Publish. Ohne ihn folgte jedem Erst-Publish ein zweiter,
   wirkungsloser Netzwerkaufruf. */
function schedulePublishRiderConfig(){
  if(riderPublishInFlight) return;
  clearTimeout(riderPublishTimeout);
  riderPublishTimeout = setTimeout(publishRiderConfigNow, RIDER_PUBLISH_DEBOUNCE_MS);
}

async function publishRiderConfigNow(){
  clearTimeout(riderPublishTimeout);
  const evt = state.currentEvent;
  if(!evt) return null;

  /* Zuerst fragen, ob es überhaupt eine Fahrer-App gibt — und zwar
     bevor irgendetwas am Event verändert wird. Der Rückgabewert des
     Seams käme dafür zu spät: bis er da ist, hätte das Event längst eine
     publicId und Token, die in dieser Installation niemand je benutzt,
     und der nächste debouncedSave() schriebe sie mit. */
  if(!riderAppBaseUrl()){
    state.riderPublish = null;
    return null;
  }

  riderPublishInFlight = true;
  try{
    /* Token und publicId werden hier nachgerüstet statt in einem eigenen
       Migrationsschritt: der erste Publish eines Altbestands-Events
       erzeugt, was fehlt, und speichert es zurück. */
    let needsSave = false;
    if(!evt.publicId){ evt.publicId = generateEventPublicId(); needsSave = true; }
    if(ensureRiderTokens(evt)) needsSave = true;
    if(ensureCheckpointTokens(evt)) needsSave = true;

    const payload = await buildRiderSyncPayload(evt);
    const res = await publishRiderConfig(payload);

    /* null heißt: diese Variante oder diese Installation hat keine
       Fahrer-App. Dann auch nichts zurückschreiben — sonst bekäme ein
       lokales Event Token, die niemand je benutzt. */
    if(res === null){
      state.riderPublish = null;
      return null;
    }

    state.riderPublish = res.ok
      ? {ok: true, at: Date.now(), error: ''}
      : {ok: false, at: Date.now(), error: res.error || 'unbekannt'};

    if(needsSave) await saveCurrentEvent();
    return res;
  } finally {
    riderPublishInFlight = false;
  }
}

function retryPublishRiderConfig(){
  publishRiderConfigNow().then(() => render());
}

/* ---------------- Merge-Polling ----------------
   Liest das Log ab dem gespeicherten Cursor und merged die Zeilen in
   evt.riders. Läuft nur, solange ein Rennen bevorsteht oder läuft —
   vorher gibt es nichts zu holen, danach nichts mehr.

   Die wichtigste Regel steht in applyRiderLogPage(): render() nur,
   wenn sich wirklich etwas geändert hat. Ein bedingungsloses Neurendern
   alle fünf Sekunden zerstört laufende Texteingaben (dieselbe
   Fehlerklasse wie der Fokusverlust im Suchfeld, Commit 9641fbf). */
let riderPollTimer = null;
let riderPollInFlight = false;
const RIDER_POLL_INTERVAL_MS = 5000;

function riderPollingWanted(evt){
  return !!evt && (evt.status === 'ready' || evt.status === 'running') && !!evt.publicId;
}

function startRiderPolling(){
  stopRiderPolling();
  if(!riderPollingWanted(state.currentEvent)) return;
  riderPollTimer = setInterval(riderPollTick, RIDER_POLL_INTERVAL_MS);
  riderPollTick();
}
function stopRiderPolling(){
  if(riderPollTimer){ clearInterval(riderPollTimer); riderPollTimer = null; }
}

async function riderPollTick(){
  /* Überlappende Läufe würden denselben Cursor zweimal lesen und die
     zweite Antwort auf einen veralteten Stand anwenden. */
  if(riderPollInFlight) return;
  const evt = state.currentEvent;
  if(!riderPollingWanted(evt)){ stopRiderPolling(); return; }

  riderPollInFlight = true;
  try{
    let changed = false;
    let guard = 0;
    /* `more` heißt: der Server hatte mehr Zeilen als das Limit. Dann
       sofort weiterlesen statt das nächste Intervall abzuwarten, sonst
       bräuchte ein Rückstand von 1000 Zeilen 25 Sekunden zum Aufholen.
       guard deckelt die Schleife, damit ein fehlerhafter Cursor die
       Seite nicht einfriert. */
    while(guard++ < 10){
      const res = await pollRiderLog(evt.publicId, evt.riderLastLogId || 0);
      /* null = diese Variante hat keine Fahrer-App. Dann dauerhaft
         aufhören, nicht alle fünf Sekunden erneut feststellen. */
      if(res === null){ stopRiderPolling(); return; }
      if(res.ok === false) return;

      const merged = mergeRiderLogRows(evt, res.rows || []);
      if(merged.changed) changed = true;
      if(res.lastId > (evt.riderLastLogId || 0)){
        evt.riderLastLogId = res.lastId;
        changed = true;
      }
      if(!res.more) break;
    }
    if(changed){
      debouncedSave();
      render();
    }
  } finally {
    riderPollInFlight = false;
  }
}

/* ---------------- Anmeldungen bestätigen ---------------- */
function pendingRiderRegistrations(evt){
  return (evt.riders || []).filter(r => r.riderStatus === 'pending');
}

async function confirmPendingRider(bib){
  const evt = state.currentEvent;
  const rider = (evt.riders || []).find(r => r.bib === bib);
  if(!rider || rider.riderStatus !== 'pending') return;

  const data = rider.pendingData || {};
  const before = {name: rider.name, emergencyContact: rider.emergencyContact, categories: Object.assign({}, rider.categories), riderStatus: rider.riderStatus, pendingData: rider.pendingData};
  logUndoableAction(evt, t('riderApp.undoConfirm', {bib}), () => {
    Object.assign(rider, before);
    confirmRiderSlot(evt.publicId, bib, 'pending');
    render();
  });

  rider.name = data.name || rider.name;
  rider.emergencyContact = data.emergencyContact || rider.emergencyContact;
  if(data.categories && typeof data.categories === 'object') rider.categories = Object.assign({}, rider.categories, data.categories);
  rider.riderStatus = 'confirmed';
  rider.pendingData = null;

  await confirmRiderSlot(evt.publicId, bib, 'confirmed');
  debouncedSave();
  render();
}

async function rejectPendingRider(bib){
  const evt = state.currentEvent;
  const rider = (evt.riders || []).find(r => r.bib === bib);
  if(!rider || rider.riderStatus !== 'pending') return;
  if(!confirm(t('riderApp.rejectConfirm', {bib}))) return;

  const before = {name: rider.name, emergencyContact: rider.emergencyContact, riderStatus: rider.riderStatus, pendingData: rider.pendingData};
  logUndoableAction(evt, t('riderApp.undoReject', {bib}), () => {
    Object.assign(rider, before);
    confirmRiderSlot(evt.publicId, bib, 'pending');
    render();
  });

  /* Slot wird wieder ausgebbar: die gedruckte Karte bekommt der nächste
     Fahrer in die Hand, deshalb müssen die Daten wirklich weg. */
  rider.name = '';
  rider.emergencyContact = '';
  rider.riderStatus = '';
  rider.pendingData = null;

  await confirmRiderSlot(evt.publicId, bib, 'free');
  debouncedSave();
  render();
}

/* ---------------- toast ---------------- */
function showToast({message, actionLabel, onAction, duration = 6000}){
  const root = document.getElementById('toast-root');
  if(!root) return;
  const toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.innerHTML = `
    <span class="toast-msg">${escapeHtml(message)}</span>
    ${actionLabel ? `<button type="button" class="toast-action"></button>` : ''}
    <button type="button" class="toast-close" aria-label="${t('ui.close')}">&times;</button>
  `;
  root.appendChild(toastEl);
  let dismissed = false;
  let timer;
  const dismiss = () => {
    if(dismissed) return;
    dismissed = true;
    clearTimeout(timer);
    toastEl.classList.add('toast-out');
    setTimeout(() => toastEl.remove(), 180);
  };
  if(actionLabel && onAction){
    const actionBtn = toastEl.querySelector('.toast-action');
    actionBtn.textContent = actionLabel;
    actionBtn.onclick = () => { onAction(); dismiss(); };
  }
  toastEl.querySelector('.toast-close').onclick = dismiss;
  timer = setTimeout(dismiss, duration);
}


/* ---------------- error boundary ----------------
   No framework, so no component-tree boundary — the closest equivalent
   is a global window error/unhandledrejection listener. All writes go
   through debouncedSave()/saveCurrentEvent() already, so by the time an
   uncaught error reaches here the last known-good state is very likely
   already persisted; this overlay exists to replace whatever half-broken
   DOM state a crash leaves behind with a reassuring, recoverable screen
   instead (spec 4.17). Registered at module load, not inside init(), so
   it's active even if init() itself throws. */
function showErrorBoundary(err){
  const root = document.getElementById('error-boundary-root');
  if(!root || root.dataset.shown === '1') return;
  root.dataset.shown = '1';
  console.error('Unerwarteter Fehler:', err);
  root.innerHTML = `
    <div class="error-boundary-overlay">
      <div class="error-boundary-box">
        <div class="error-boundary-title">${t('errorBoundary.title')}</div>
        <p class="error-boundary-text">${t('errorBoundary.text')}</p>
        <button class="btn btn-primary" onclick="location.reload()">${t('errorBoundary.reload')}</button>
      </div>
    </div>
  `;
}
window.addEventListener('error', (e) => { showErrorBoundary((e && (e.error || e.message)) || e); });
window.addEventListener('unhandledrejection', (e) => { showErrorBoundary(e && e.reason); });

/* ---------------- storage-agnostic persistence ---------------- */
async function loadEventsIndex(){
  try{
    const res = await storageGet('events:index');
    state.eventsIndex = res ? JSON.parse(res.value) : [];
  }catch(e){ state.eventsIndex = []; }
}
async function saveEventsIndex(){
  setSaveStatus('saving');
  const ok = await storageSet('events:index', JSON.stringify(state.eventsIndex));
  setSaveStatus(ok ? 'saved' : 'error');
}
async function loadEvent(id){
  try{
    const res = await storageGet('event:' + id);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function saveCurrentEvent(){
  if(!state.currentEvent) return;
  setSaveStatus('saving');
  const ok = await storageSet('event:' + state.currentEvent.id, JSON.stringify(state.currentEvent));
  setSaveStatus(ok ? 'saved' : 'error');
  if(ok){
    broadcastEventUpdated(state.currentEvent.id);
    schedulePublishRiderConfig();
  }
}
function debouncedSave(){
  setSaveStatus('pending');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveCurrentEvent, 450);
}
function flushPendingSave(){
  if(saveTimeout){
    clearTimeout(saveTimeout);
    saveTimeout = null;
    saveCurrentEvent();
  }
  if(window.__idxSaveTimeout){
    clearTimeout(window.__idxSaveTimeout);
    window.__idxSaveTimeout = null;
    saveEventsIndex();
  }
}
window.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushPendingSave();
});
window.addEventListener('beforeunload', flushPendingSave);
function setSaveStatus(status){
  state.saveStatus = status;
  const el = document.getElementById('save-status');
  if(!el) return;
  el.className = 'save-status ' + status;
  el.textContent = status === 'pending' ? t('ui.saveStatusPending')
    : status === 'saving' ? t('ui.saveStatusSaving')
    : status === 'saved' ? t('ui.saveStatusSaved')
    : status === 'error' ? t('ui.saveStatusError')
    : '';
}

const NAV_SHORTCUT_KEYS = {
  '1': () => openOverview(),
  '2': () => openEditor(state.currentEvent.id),
  '3': () => openRiders(),
  '4': () => openCheckin(),
  '5': () => openLeaderboard(),
  '6': () => openManifest()
};
function isTypingTarget(el){
  if(!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}
function handleGlobalEscape(){
  if(state.mapContextMenu){ hideMapContextMenu(); return true; }
  if(state.pdfPreviewOpen){ closePdfPreview(); return true; }
  if(state.socialShareOpen){ closeSocialShareCard(); return true; }
  if(state.commandPaletteOpen){ closeCommandPalette(); return true; }
  if(state.mapSearchOpen){ toggleMapSearch(false); return true; }
  if(state.addMode){ toggleAddMode(); return true; }
  return false;
}
function initGlobalShortcuts(){
  document.addEventListener('keydown', (e) => {
    if((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      toggleCommandPalette();
      return;
    }
    if(e.key === 'Escape'){
      if(handleGlobalEscape()) e.preventDefault();
      return;
    }
    if(isTypingTarget(e.target)) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(!state.currentEvent || state.view === 'dashboard' || state.view === 'settings') return;
    const fn = NAV_SHORTCUT_KEYS[e.key];
    if(fn){ e.preventDefault(); fn(); }
  });
}

function render(){
  const appEl = document.getElementById('app');

    if(appEl) appEl.style.display = 'none';
    if(splashEl){ splashEl.style.display = 'flex'; splashEl.innerHTML = renderSplashscreen(); }
    return;
  }
  if(appEl) appEl.style.display = '';
  if(splashEl) splashEl.style.display = 'none';

  applyStaticTranslations();

  document.getElementById('view-editor').classList.toggle('active', state.view === 'editor');
  document.getElementById('view-manifest').classList.toggle('active', state.view === 'manifest');
  document.getElementById('view-riders').classList.toggle('active', state.view === 'riders');
  document.getElementById('view-checkin').classList.toggle('active', state.view === 'checkin');
  document.getElementById('view-leaderboard').classList.toggle('active', state.view === 'leaderboard');
  document.getElementById('view-settings').classList.toggle('active', state.view === 'settings');

  if(state.view === 'dashboard') renderDashboard();
  if(state.view === 'overview') renderOverview();
  if(state.view === 'editor') renderSidebar();
  if(state.view === 'manifest') renderManifest();
  if(state.view === 'riders') renderRiders();
  if(state.view === 'checkin') renderCheckin();
  if(state.view === 'leaderboard') renderLeaderboard();
  if(state.view === 'settings') renderSettings();
  syncWakeLockForView();
}

      <div class="type-list">${typeRows}</div>
      ${newTypeForm}
    </div>
  `;
}
function settingsSectionContent(id){
  switch(id){
    case 'theme': return renderSettingsSectionTheme();
    case 'iconpack': return renderSettingsSectionIconPack();
    case 'language': return renderSettingsSectionLanguage();
    case 'units': return renderSettingsSectionUnits();
    case 'checkpointTypes': return renderSettingsSectionCheckpointTypes();
    case 'dataSafety': return renderDataSafetySection();
    case 'documentation': return renderDocumentationSection();
    case 'features':
    default: return renderFeatureRegistrySection();
  }
}
function renderSettings(){
  Object.entries(ICON_PACKS).forEach(([key, p]) => {
    if(!p.cdn) return;
    const linkId = 'icon-pack-preview-cdn-' + key;
    if(document.getElementById(linkId)) return;
    const link = document.createElement('link');
    link.id = linkId;
    link.rel = 'stylesheet';
    link.href = p.cdn;
    document.head.appendChild(link);
  });
  if(!settingsNavItem(state.settingsSection)) state.settingsSection = loadSettingsSectionPref() || SETTINGS_NAV_GROUPS[0].items[0].id;
  const el = document.getElementById('view-settings');
  el.innerHTML = `
    <div class="settings-layout ${state.settingsMobileDetailOpen ? 'settings-mobile-detail' : 'settings-mobile-list'}">
      ${renderSettingsSidebar()}
      <div class="settings-content">
        <button type="button" class="settings-mobile-back" onclick="closeSettingsMobileDetail()">${t('settings.backToList')}</button>
        ${settingsSectionContent(state.settingsSection)}
      </div>
    </div>
  `;
  if(state.settingsSection === 'dataSafety'){
    refreshStorageEstimate();
    if(isFeatureEnabled('offline_map_cache')) refreshTileCacheTotal();
  }
}



translations.en = {"common":{"save":"Save","cancel":"Cancel","delete":"Delete","edit":"Edit","export":"Export","import":"Import","remove":"Remove","back":"Back","mandatory":"Mandatory","bonus":"Bonus","noDate":"No Date","generating":"Generating...","unnamedEvent":"Unnamed Event"},"team":{"namePrompt":"Please provide a team name.","deleteConfirm":"Really delete this team? Assigned riders will lose their team assignment."},"splashscreen":{"title":"Alleycat Dispatch","claim":"Set checkpoints. Run the race. Stay in control.","cta":"Get Started"},"onboarding":{"noEventToast":"The tour needs at least one event.","stepCounter":"Step {current} of {total}","back":"&larr; Back","next":"Next &rarr;","finish":"Done","skip":"Skip","step1Title":"Your events","step1Text":"Here you see all your races. Open one to edit checkpoints, riders, and more.","step2Title":"Plan checkpoints","step2Text":"Place checkpoints on the map; here in the list you set order and type.","step3Title":"Rider list","step3Text":"Add riders, import via CSV, or organize them into teams/categories.","step4Title":"Check-in","step4Text":"On race day, marshals enter bib numbers here to confirm checkpoints.","step5Title":"Leaderboard","step5Text":"Live results and ranking while the race is running.","step6Title":"Manifest & Export","step6Text":"Export start lists, bib numbers, and spokecards as PDF."},"docs":{"heading":"Documentation","desc":"Reference guide for all core features of Alleycat Dispatch.","searchPlaceholder":"Search documentation…","noMatches":"No matching topics found.","gettingStartedTitle":"Getting Started","gettingStartedBody":"Create a new race on the dashboard via \"+ New Event\", or open the included example event to try things out.\n\nIn the editor you place checkpoints on the map, set their order and type, and add riders via the rider list. On race day, use check-in to confirm bib numbers against checkpoints — the leaderboard updates live.\n\nFinally, export start lists, bib numbers, and spokecards as PDF via the Manifest.","checkpointsTitle":"Checkpoints & Map","checkpointsBody":"Click \"Set checkpoint\" and then the map to create a new checkpoint. Each checkpoint has a type (e.g. QR code, photo, puzzle, pickup/dropoff) and can be marked mandatory or bonus.\n\nSet the order by dragging rows in the sidebar list, or leave it freely choosable. The route between checkpoints is calculated automatically and drawn on the map.\n\nYou can also drag and drop GPX, GeoJSON, or KML files to import tracks and turn waypoints directly into checkpoints.","zonesGameModesTitle":"Zones & Game Modes","zonesGameModesBody":"In the zone editor you draw circle or polygon zones directly on the map — e.g. for Battle Royale modes with a shrinking play area, or for \"Districts\", where several zones are active at once.\n\nThe game mode settings let you pick one of several presets and configure details like shrink speed or scoring rules.\n\nZones also work independently of any game mode, e.g. to highlight specific map areas.","ridersTitle":"Riders","ridersBody":"Under \"Riders\" you manage the start list: add riders manually, bulk-import via CSV, or organize them into teams and categories (e.g. by drivetrain or gender).\n\nThe roster search finds riders by name or bib number, and sorting can optionally group by team. The card design for spokecards and bib numbers is also configured here.","checkinTitle":"Check-in","checkinBody":"On race day, marshals enter a rider's bib number here (or scan the QR code) to confirm a checkpoint. An Enter-to-submit workflow keeps this fast even with an external numpad.\n\nWith a fixed checkpoint order, the app warns when a checkpoint was skipped — but this can be overridden with confirmation. A curfew can automatically mark checkpoints as no longer reachable.","leaderboardTitle":"Leaderboard","leaderboardBody":"The leaderboard shows the live standing of all riders or teams, including status per checkpoint. Filters by status, team, or category help with larger fields.\n\nResults can be exported as CSV, optionally split by an attribute like category or team.","manifestExportTitle":"Manifest & Export","manifestExportBody":"The manifest is the printable overview of your event: start list, checkpoint list, distances. The sidebar lets you customize which columns are shown, print directly, or export as PDF.\n\nYou also export bib numbers and spokecards with QR codes for each rider here.","pdfBuilderTitle":"PDF Builder","pdfBuilderBody":"The PDF builder extends the manifest with additional, freely designed pages: text, images, tables with app data (e.g. checkpoint distances), or placeholder text that's automatically filled with event data.\n\nBlocks can be arranged at half, third, or full width and flow automatically into rows — a preview shows the result before export. Templates can be exported and reused across other events.","beamerTitle":"Beamer","beamerBody":"The beamer view is a dedicated full-screen display for projection on race day — a countdown before the start, then a live zone map, points board, or event ticker, depending on the active game mode.\n\nOpen it via the corresponding button in the event overview; it runs independently of the main window in its own tab.","offlineTitle":"Offline Mode","offlineBody":"Map tiles can be downloaded ahead of time and cached locally in the browser, so the map stays usable without a network connection — handy for checkpoints without cell coverage.\n\nStorage usage and cache freshness are shown under Settings → Data Security.","deliveryTitle":"Package Delivery","deliveryBody":"For courier route tasks there are two linked checkpoint types: pickup and dropoff. At the pickup checkpoint you choose the matching dropoff checkpoint from a dropdown list.\n\nThe finish check-in warns if a dropoff is entered without a confirmed pickup — but this can be overridden with confirmation."},"dashboard":{"title":"Your Alleycats","sharedBoardHint":"Shared Headquarters board — visible to ever
