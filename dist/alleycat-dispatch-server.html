<script>
/* ---------------- storage ----------------
   Nutzt window.storage (geteilter Artifact-Speicher), sofern verfügbar.
   Fällt sonst auf das eigene PHP/MySQL-Backend zurück (siehe /php-backend)
   — echtes Server-Backend, von mehreren Geräten/Browsern gemeinsam
   nutzbar. Verbindungsdaten (Endpunkt + API-Key) werden einmalig beim
   ersten Start abgefragt und lokal in localStorage gemerkt (nur die
   Zugangsdaten selbst, nicht die Event-Daten).                        */
const hasSharedStorage = !!(window.storage && typeof window.storage.get === 'function');
if(!hasSharedStorage){
  console.warn('window.storage nicht verfügbar — nutze PHP-Server-Backend.');
}
if(location.search.includes('reset-php-config')){
  localStorage.removeItem('alleycat:php-config');
}
function getPhpConfig(){
  try{ return JSON.parse(localStorage.getItem('alleycat:php-config') || 'null'); }
  catch(e){ return null; }
}
function savePhpConfig(cfg){
  localStorage.setItem('alleycat:php-config', JSON.stringify(cfg));
}
async function phpRequest(method, key, body){
  const cfg = getPhpConfig();
  if(!cfg) throw new Error('PHP-Backend nicht konfiguriert');
  const url = cfg.apiUrl + '?key=' + encodeURIComponent(key);
  return fetch(url, {
    method,
    headers: Object.assign({'X-Api-Key': cfg.apiKey}, method === 'POST' ? {'Content-Type': 'text/plain'} : {}),
    body: method === 'POST' ? body : undefined
  });
}
async function storageGet(key){
  if(hasSharedStorage){
    try{ return await window.storage.get(key, true); }
    catch(e){ console.error('storage.get failed', e); return null; }
  }
  try{
    const res = await phpRequest('GET', key);
    if(res.status === 404) return null;
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return {value: data.value};
  }catch(e){ console.error('php storage get failed', e); return null; }
}
async function storageSet(key, value){
  if(hasSharedStorage){
    try{ await window.storage.set(key, value, true); return true; }
    catch(e){ console.error('storage.set failed', e); return false; }
  }
  try{
    const res = await phpRequest('POST', key, value);
    return res.ok;
  }catch(e){ console.error('php storage set failed', e); return false; }
}
async function storageDelete(key){
  if(hasSharedStorage){
    try{ await window.storage.delete(key, true); return; }
    catch(e){ console.error('storage.delete failed', e); }
    return;
  }
  try{ await phpRequest('DELETE', key); }
  catch(e){ console.error('php storage delete failed', e); }
}
function renderPhpSetup(error){
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px; margin:60px auto; padding:32px; background:var(--asphalt-2); border:1px solid var(--asphalt-3); border-top:3px solid var(--hivis); border-radius:6px;">
      <h2 style="margin:0 0 4px;">Alleycat Dispatch</h2>
      <div style="color:var(--steel); font-size:13px; font-family:'JetBrains Mono'; margin-bottom:22px;">${t('phpSetup.subtitle')}</div>
      ${error ? `<div style="background:rgba(178,58,46,0.15); border:1px solid var(--stamp); color:#ff9a8f; padding:10px 12px; border-radius:4px; font-size:13px; margin-bottom:14px;">${escapeHtml(error)}</div>` : ''}
      <label style="display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); margin-bottom:4px;">${t('phpSetup.apiEndpointLabel')}</label>
      <input type="text" id="php-setup-url" placeholder="${escapeHtml(t('phpSetup.apiEndpointPlaceholder'))}"
        style="width:100%; padding:9px 10px; margin-bottom:14px; border-radius:3px; border:1px solid var(--asphalt-3); background:var(--asphalt); color:var(--chalk); font-family:monospace; font-size:13px;">
      <label style="display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); margin-bottom:4px;">${t('phpSetup.apiKeyLabel')}</label>
      <input type="text" id="php-setup-key" placeholder="${escapeHtml(t('phpSetup.apiKeyPlaceholder'))}"
        style="width:100%; padding:9px 10px; margin-bottom:14px; border-radius:3px; border:1px solid var(--asphalt-3); background:var(--asphalt); color:var(--chalk); font-family:monospace; font-size:13px;">
      <label style="display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); margin-bottom:4px;">${t('phpSetup.riderAppUrlLabel')}</label>
      <input type="text" id="php-setup-rider-url" placeholder="${escapeHtml(t('phpSetup.riderAppUrlPlaceholder'))}"
        style="width:100%; padding:9px 10px; margin-bottom:6px; border-radius:3px; border:1px solid var(--asphalt-3); background:var(--asphalt); color:var(--chalk); font-family:monospace; font-size:13px;">
      <div style="color:var(--steel); font-size:11.5px; margin-bottom:20px; line-height:1.5;">${t('phpSetup.riderAppUrlHint')}</div>
      <button class="btn btn-primary" style="width:100%;" onclick="submitPhpSetup()">${t('phpSetup.connectButton')}</button>
      <div style="color:var(--steel); font-size:11.5px; margin-top:14px; line-height:1.5;">${t('phpSetup.installHint', {installPhp: '<code>install.php</code>', phpBackend: '<code>php-backend</code>', resetParam: '<code>?reset-php-config</code>'})}</div>
    </div>
  `;
}
async function submitPhpSetup(){
  const apiUrl = (document.getElementById('php-setup-url').value || '').trim().replace(/\/$/, '');
  const apiKey = (document.getElementById('php-setup-key').value || '').trim();
  /* Optional: leer lassen heißt "keine Fahrer-App". Die Rider-Seams
     liefern dann null und der geteilte Kern blendet alles Zugehörige
     aus — eine bestehende Installation bleibt damit ohne Zutun
     unverändert lauffähig. */
  const riderAppUrl = (document.getElementById('php-setup-rider-url').value || '').trim();
  if(!apiUrl || !apiKey){ renderPhpSetup(t('phpSetup.errorFieldsRequired')); return; }
  savePhpConfig({apiUrl, apiKey, riderAppUrl});
  try{
    const res = await phpRequest('GET', 'events:index');
    if(res.status === 401){
      localStorage.removeItem('alleycat:php-config');
      renderPhpSetup(t('phpSetup.errorKeyRejected'));
      return;
    }
    if(!res.ok && res.status !== 404){
      localStorage.removeItem('alleycat:php-config');
      renderPhpSetup(t('phpSetup.errorServerStatus', {status: res.status}));
      return;
    }
  }catch(e){
    localStorage.removeItem('alleycat:php-config');
    renderPhpSetup(t('phpSetup.errorConnectionFailed', {message: e.message}));
    return;
  }
  location.reload();
}

async function exportBackupBlob(evt){
  if(hasSharedStorage || !evt) return null;
  const slug = (evt.name || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'event';
  const ts = toLocalDateTimeInputValue(new Date()).replace(/[:T]/g, '-');
  return {blob: new Blob([JSON.stringify(evt, null, 2)], {type: 'application/json'}), filename: `alleycat-autobackup-${slug}-${ts}.json`};
}

/* ---------------- storage capability seams (used by shared core/*.js) ---------------- */
/* See the local variant for the full rationale: false under a shared
   window.storage, where a per-device backup would be misleading. With the PHP
   backend configured, backups are genuine JSON exports of the event. */
function supportsLocalBackup(){
  return !hasSharedStorage;
}

/* ---------------- Rider-App-Seams ----------------
   Alle drei liefern null, wenn es keine Fahrer-App geben kann: unter
   einem geteilten window.storage gibt es kein PHP-Backend, und ohne
   konfigurierte Rider-App-URL gibt es keine Adresse, auf die ein
   QR-Code zeigen könnte. Der geteilte Kern wertet ausschließlich dieses
   null aus und fragt nie selbst nach der Variante. */
function riderAppBaseUrl(){
  const cfg = getPhpConfig();
  return (cfg && cfg.riderAppUrl) ? cfg.riderAppUrl : '';
}
function riderEndpointUrl(){
  const cfg = getPhpConfig();
  if(!cfg || !cfg.apiUrl) return '';
  /* rider.php liegt neben api.php — der Nutzer konfiguriert nur einen
     Endpunkt, und beide Dateien kommen aus demselben Ordner. */
  return cfg.apiUrl.replace(/\/[^\/]*$/, '/rider.php');
}
function riderSeamsAvailable(){
  return !hasSharedStorage && !!getPhpConfig() && !!riderAppBaseUrl();
}
async function riderRequest(method, query, body){
  const cfg = getPhpConfig();
  const res = await fetch(riderEndpointUrl() + '?' + query, {
    method,
    headers: Object.assign({'X-Api-Key': cfg.apiKey}, body ? {'Content-Type': 'application/json'} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function publishRiderConfig(payload){
  if(!riderSeamsAvailable()) return null;
  try{
    return await riderRequest('POST', 'a=sync', payload);
  }catch(e){
    console.error('rider sync failed', e);
    return {ok: false, error: e.message};
  }
}
async function pollRiderLog(publicId, sinceId){
  if(!riderSeamsAvailable()) return null;
  try{
    return await riderRequest('GET', 'a=log&public_id=' + encodeURIComponent(publicId) + '&since=' + (sinceId || 0));
  }catch(e){
    console.error('rider log poll failed', e);
    return {ok: false, error: e.message};
  }
}
async function confirmRiderSlot(publicId, bib, status){
  if(!riderSeamsAvailable()) return null;
  try{
    return await riderRequest('POST', 'a=slotstatus', {publicId, bib, status});
  }catch(e){
    console.error('rider slot status failed', e);
    return {ok: false, error: e.message};
  }
}
async function initStorageBackend(){
  if(!hasSharedStorage && !getPhpConfig()){
    renderPhpSetup();
    return false;
  }
  return true;
}
function renderStorageDashboardExtras(){
  return '';
}
/* No-op: this variant's storage is shared across every organizer on the
   installation (PHP backend, or a shared window.storage), so auto-creating
   a demo event here would clutter a board other people already use. See
   the local variant's seedDemoEventIfNeeded() for the real implementation. */
async function seedDemoEventIfNeeded(){}

/* ---------------- i18n ----------------
   Alle sichtbaren UI-Strings laufen über t(). Deutsch (`de`, hier fest
   im Quellcode) ist die Autorensprache — neue Strings entstehen zuerst
   nur hier, die Übersetzung nach `src/i18n/en.json` wird bewusst separat
   und auf Anforderung gepflegt, nicht automatisch bei jeder Änderung.
   build.js liest diese Datei und hängt sie als `translations.en = {...}`
   ans CORE_JS-Bundle an (siehe BUILTIN_LANGS unten) — beide Sprachen
   sind damit fest Teil jedes gebauten dist/*.html, kein Laufzeit-Fetch.
   Sprache ist geräte-lokal (localStorage), nicht Teil des Event-/
   Server-Storage — in der Server-Variante sonst geräteübergreifend
   geteilt, was für eine UI-Spracheinstellung falsch wäre.
   Nutzereingaben (Kategorie-/Checkpoint-/Team-Namen) laufen NIE durch
   t() — die bleiben unverändert Rohdaten.                             */
const translations = {
  de: {
    common: {
      save: 'Speichern', cancel: 'Abbrechen', delete: 'Löschen', edit: 'Bearbeiten',
      export: 'Exportieren', import: 'Importieren', remove: 'Entfernen', back: 'Zurück',
      mandatory: 'Pflicht', bonus: 'Bonus', noDate: 'Kein Datum', generating: 'Generiere…',
      unnamedEvent: 'Unbenanntes Event'
    },
    team: {
      namePrompt: 'Bitte einen Team-Namen angeben.',
      deleteConfirm: 'Dieses Team wirklich löschen? Zugeordnete Fahrer verlieren die Team-Zuordnung.'
    },
    splashscreen: {
      title: 'Alleycat Dispatch',
      claim: 'Checkpoints setzen. Rennen leiten. Alles im Griff.',
      cta: 'Loslegen'
    },
    docs: {
      heading: 'Dokumentation',
      desc: 'Nachschlagewerk für alle Kernfunktionen von Alleycat Dispatch.',
      searchPlaceholder: 'Dokumentation durchsuchen…',
      noMatches: 'Keine passenden Themen gefunden.',
      gettingStartedTitle: 'Erste Schritte',
      gettingStartedBody: 'Lege links auf dem Dashboard über "+ Neues Event" ein neues Rennen an, oder öffne das mitgelieferte Beispiel-Event zum Ausprobieren.\n\nIm Editor platzierst du Checkpoints auf der Karte, legst Reihenfolge und Typ fest und trägst Fahrer über die Fahrerliste ein. Am Renntag nutzt du den Check-in, um Startnummern gegen Checkpoints zu bestätigen — das Leaderboard aktualisiert sich live.\n\nZum Schluss exportierst du Startlisten, Startnummern und Spokecards als PDF über das Manifest.',
      checkpointsTitle: 'Checkpoints & Karte',
      checkpointsBody: 'Klicke auf "Checkpoint setzen" und dann auf die Karte, um einen neuen Checkpoint anzulegen. Jeder Checkpoint hat einen Typ (z. B. QR-Code, Foto, Rätsel, Abholung/Zustellung) und kann als Pflicht oder Bonus markiert werden.\n\nDie Reihenfolge legst du per Drag & Drop in der Sidebar-Liste fest oder lässt sie frei wählbar. Die Route zwischen den Checkpoints wird automatisch berechnet und auf der Karte eingezeichnet.\n\nZusätzlich kannst du GPX-, GeoJSON- oder KML-Dateien per Drag & Drop importieren und daraus direkt Checkpoints übernehmen.',
      zonesGameModesTitle: 'Zonen & Spielmodi',
      zonesGameModesBody: 'Im Zonen-Editor zeichnest du Kreis- oder Polygon-Zonen direkt auf der Karte — z. B. für Battle-Royale-Modi mit schrumpfendem Spielfeld oder für "Bezirke", bei denen mehrere Zonen gleichzeitig aktiv sind.\n\nÜber die Spielmodi-Einstellungen wählst du eines von mehreren Presets aus und konfigurierst Details wie Schrumpfgeschwindigkeit oder Punkteregeln.\n\nZonen lassen sich auch unabhängig von einem Spielmodus nutzen, z. B. um bestimmte Kartenbereiche hervorzuheben.',
      ridersTitle: 'Fahrer',
      ridersBody: 'Unter "Fahrer" verwaltest du die Startliste: manuell anlegen, per CSV-Import in Bulk hinzufügen, oder in Teams und Kategorien einteilen (z. B. nach Antriebsart oder Geschlecht).\n\nDie Roster-Suche findet Fahrer nach Name oder Startnummer, die Sortierung gruppiert optional nach Team. Das Kartendesign für Spokecards und Startnummern passt du ebenfalls hier an.',
      checkinTitle: 'Check-in',
      checkinBody: 'Am Renntag geben Marshals hier die Startnummer eines Fahrers ein (oder scannen den QR-Code), um einen Checkpoint zu bestätigen. Ein Enter-Submit-Workflow macht das auch mit einem externen Nummernblock schnell.\n\nBei fester Checkpoint-Reihenfolge warnt die App, wenn ein Checkpoint übersprungen wurde — lässt sich aber mit Bestätigung überschreiben. Eine Sperrstunde (Curfew) markiert automatisch nicht mehr erreichbare Checkpoints.',
      leaderboardTitle: 'Leaderboard',
      leaderboardBody: 'Das Leaderboard zeigt den Live-Stand aller Fahrer oder Teams an, inklusive Status pro Checkpoint. Filter nach Status, Team oder Kategorie helfen bei größeren Feldern.\n\nErgebnisse lassen sich als CSV exportieren, optional aufgeteilt nach einem Merkmal wie Kategorie oder Team.',
      manifestExportTitle: 'Manifest & Export',
      manifestExportBody: 'Das Manifest ist die druckbare Übersicht deines Events: Startliste, Checkpoint-Liste, Distanzen. Über die Sidebar passt du an, welche Spalten angezeigt werden, druckst direkt oder exportierst als PDF.\n\nZusätzlich exportierst du hier Startnummern und Spokecards mit QR-Codes für jeden Fahrer.',
      pdfBuilderTitle: 'PDF-Baukasten',
      pdfBuilderBody: 'Der PDF-Baukasten erweitert das Manifest um zusätzliche, frei gestaltbare Seiten: Text, Bilder, Tabellen mit App-Daten (z. B. Checkpoint-Distanzen) oder Platzhalter-Text, der automatisch mit Event-Daten befüllt wird.\n\nBlöcke lassen sich in halber, drittel oder voller Breite anordnen und fließen automatisch in Zeilen — eine Vorschau zeigt das Ergebnis vor dem Export. Vorlagen lassen sich exportieren und in anderen Events wiederverwenden.',
      beamerTitle: 'Beamer',
      beamerBody: 'Die Beamer-Ansicht ist ein eigener Vollbild-Screen für die Projektion am Renntag — Countdown vor dem Start, danach live Zonenkarte, Punktetabelle oder Ereignis-Ticker, je nach aktivem Spielmodus.\n\nÖffne sie über den entsprechenden Button in der Event-Übersicht; sie läuft unabhängig vom Hauptfenster in einem eigenen Tab.',
      offlineTitle: 'Offline-Modus',
      offlineBody: 'Kartenkacheln lassen sich vorab herunterladen und lokal im Browser zwischenspeichern, damit die Karte auch ohne Netzverbindung nutzbar bleibt — praktisch für Checkpoints ohne Mobilfunkempfang.\n\nDen Speicherverbrauch und die Aktualität des Caches siehst du unter Einstellungen → Datensicherheit.',
      deliveryTitle: 'Paket-Zustellung',
      deliveryBody: 'Für Kurier-Routenaufgaben gibt es zwei verknüpfte Checkpoint-Typen: Abholung und Zustellung. Am Abholung-Checkpoint wählst du den zugehörigen Zustell-Checkpoint aus der Dropdown-Liste.\n\nDas Ziel-Check-in warnt, wenn eine Zustellung ohne bestätigte Abholung eingetragen wird — lässt sich aber mit Bestätigung überschreiben.'
    },

/* ---------------- community language packs (Spec 20.3) ----------------
   Lets a local crew translate the UI without touching code: upload a JSON
   file shaped exactly like `translations.de` above (same nested namespace/
   key structure — missing keys are fine, t()'s existing per-key fallback
   to `translations.de` already handles a partial translation). Language
   code comes from the filename convention the spec itself specifies
   (`alleycat-i18n-es.json` -> "es"), not a metadata field inside the JSON,
   so export and re-import round-trip through the same convention. Merged
   into the in-memory `translations` object at runtime (mirrors how
   `checkpointTypes:custom` merges into CHECKPOINT_TYPES in checkpoint.js)
   and persisted device-locally under `i18n:customPacks` — separate from
   the `alleycat:lang` selection itself, which was already its own
   standalone localStorage key before this step.
   `de` and `en` are BUILTIN_LANGS — baked into every dist/*.html by
   build.js (see the header comment above), not uploadable/deletable/
   overwritable through this community-pack flow. */
const BUILTIN_LANGS = ['de', 'en'];
const BUILTIN_LANG_NAMES = {de: 'Deutsch', en: 'English'};
async function loadCustomLanguagePacks(){
  try{
    const res = await storageGet('i18n:customPacks');
    const packs = res ? JSON.parse(res.value) : {};
    Object.keys(packs).forEach(lang => { translations[lang] = packs[lang]; });
  }catch(e){ /* keep de only */ }
}
async function saveCustomLanguagePacks(){
  const packs = {};
  Object.keys(translations).forEach(lang => { if(!BUILTIN_LANGS.includes(lang)) packs[lang] = translations[lang]; });
  await storageSet('i18n:customPacks', JSON.stringify(packs));
}
function availableLanguages(){
  return Object.keys(translations);
}
function languagePackDisplayName(code){
  const dict = translations[code];
  return BUILTIN_LANG_NAMES[code] || (dict && dict._meta && dict._meta.name) || code.toUpperCase();
}
function exportLanguagePackTemplate(){
  downloadJSON(translations.de, 'alleycat-i18n-template.json');
}
async function onLanguagePackFileChange(input){
  const file = input.files && input.files[0];
  if(!file) return;
  input.value = '';
  const match = file.name.match(/alleycat-i18n-([a-z]{2,3})\.json$/i);
  if(!match){ alert(t('settings.languagePackNameError')); return; }
  const code = match[1].toLowerCase();
  if(BUILTIN_LANGS.includes(code)){ alert(t('settings.languagePackBuiltinError')); return; }
  let json;
  try{
    json = JSON.parse(await file.text());
  }catch(e){ json = null; }
  if(!json || typeof json !== 'object' || Array.isArray(json)){ alert(t('settings.languagePackParseError')); return; }
  translations[code] = json;
  await saveCustomLanguagePacks();
  render();
}
function deleteLanguagePack(code){
  if(BUILTIN_LANGS.includes(code) || !confirm(t('settings.languagePackDeleteConfirm'))) return;
  delete translations[code];
  saveCustomLanguagePacks();
  if(getCurrentLanguage() === code) setLanguage('de');
  else render();
}
function getCurrentLanguage(){
  try{ return localStorage.getItem('alleycat:lang') || 'de'; }
  catch(e){ return 'de'; }
}
function setLanguage(lang){
  try{ localStorage.setItem('alleycat:lang', lang); }
  catch(e){ console.error('Sprache konnte nicht gespeichert werden', e); }
  render();
}
function t(key, params){
  const lang = getCurrentLanguage();
  const dict = translations[lang] || translations.de;
  let str = key.split('.').reduce((o, k) => o && o[k], dict)
    ?? key.split('.').reduce((o, k) => o && o[k], translations.de)
    ?? key;
  if(params){
    Object.keys(params).forEach(k => { str = str.replace(`{${k}}`, params[k]); });
  }
  return str;
}


/* ---------------- utils ---------------- */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

/* ---------------- rider credentials ----------------
   Anders als uid() bewusst NICHT über Math.random(): diese Werte sind
   Zugangsdaten. Ein rider token ist alles, was ein Fahrer-Handy vorzeigt,
   um sich als Startnummer 23 auszugeben, und ein qr token alles, was einen
   Checkpoint-Scan gültig macht. Vorhersagbare Werte wären hier eine echte
   Lücke, keine Kosmetik.                                                 */
const RIDER_TOKEN_ALPHABET = 'abcdefghijklmnopqrstuvwxyz0123456789';
/* Ohne O/0/I/1: dieser Code wird von einer gedruckten Spokecard abgetippt,
   wenn die Kamera streikt. Verwechselbare Zeichen kosten dort echte Zeit. */
const RIDER_CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

/* Zieht n Zeichen aus alphabet, ohne Modulo-Bias: Werte im nicht durch die
   Alphabetlänge teilbaren Rest des Byte-Bereichs werden verworfen statt
   umgerechnet, sonst wären die ersten Zeichen des Alphabets minimal
   wahrscheinlicher als die letzten. */
function randomStringFromAlphabet(n, alphabet){
  const limit = Math.floor(256 / alphabet.length) * alphabet.length;
  let out = '';
  const buf = new Uint8Array(n * 2);
  while(out.length < n){
    crypto.getRandomValues(buf);
    for(let i = 0; i < buf.length && out.length < n; i++){
      if(buf[i] < limit) out += alphabet[buf[i] % alphabet.length];
    }
  }
  return out;
}
function generateRiderToken(){ return randomStringFromAlphabet(32, RIDER_TOKEN_ALPHABET); }
function generateRiderCode(){ return randomStringFromAlphabet(8, RIDER_CODE_ALPHABET); }

/* SHA-256 als Hex. Der Organizer hasht Tokens, bevor er sie zum Server
   schickt — Klartext-Zugangsdaten verlassen die App nie, auch nicht über
   die eigene authentifizierte Verbindung. */
async function sha256Hex(str){
  const bytes = new TextEncoder().encode(String(str));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadJSON(obj, filename){
  downloadBlob(new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'}), filename);
}
function restoreInputFocus(selector, cursorPos){
  const el = document.querySelector(selector);
  if(!el) return;
  el.focus();
  if(typeof cursorPos === 'number' && el.setSelectionRange) el.setSelectionRange(cursorPos, cursorPos);
}
/* Paket 5 Teil A, Schritt 2 (Spec 20.1): 12h/24h switch, state.appSettings.
   timeFormat ('24h' default | '12h'). 12h mode formats via 'en-US' (not
   'de-DE') specifically to guarantee an AM/PM suffix — Intl's hour12 option
   is respected by de-DE too, but would render vorm./nachm.-style markers
   rather than the spec's literal "2:30 PM" example, and the German-only
   " Uhr" suffix makes no sense appended after an AM/PM time, so it's
   dropped in 12h mode (formatDateTime delegates its time portion to
   formatTimeOnly rather than duplicating the hour12 branch). */
function formatTimeOnly(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d.getTime())) return v;
  const twelveHour = state.appSettings.timeFormat === '12h';
  return d.toLocaleTimeString(twelveHour ? 'en-US' : 'de-DE', {hour: '2-digit', minute: '2-digit', hour12: twelveHour});
}
function formatDateTime(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d.getTime())) return v;
  const twelveHour = state.appSettings.timeFormat === '12h';

}

/* Paket 5 Teil A, Schritt 1 (Spec 20.1): the one place display distances get
   formatted, metric/imperial switch driven by state.appSettings.distanceUnit.
   Takes meters (the canonical unit per spec) — callers that compute in km
   (computeRouteLegs()/logistics.js's route estimator, both pre-dating this
   step and left as-is rather than reworked to a meters-internal
   representation, a much larger and purely internal change for zero
   user-visible benefit) convert with `* 1000` at the call site. Deliberately
   NOT applied to editable radius/buffer inputs (zone radius, proximity
   buffer) — those are configured thresholds the organizer types directly in

function formatDistance(meters){

  if(state.appSettings.distanceUnit === 'imperial'){
    const feet = meters * 3.28084;

/* Paket 5 Teil A, Schritt 3 (Spec 20.1): coordinate display switch —
   Dezimalgrad (default) | DMS | UTM | MGRS. toUtm() is the standard
   ellipsoidal (WGS84) transverse Mercator forward formula (Snyder,
   USGS Professional Paper 1395) — validated against a published reference
   (Wikipedia's UTM article: CN Tower, 43.6425667°N 79.387139°W → zone 17,
   630084mE 4833438mN) during development; this implementation reproduces
   that to sub-meter precision. toMgrs() derives the 100km grid square
   letters from the UTM result per the standard MGRS lettering scheme
   (column letters cycle in a 3-zone-repeating pattern, row letters
   alternate starting letter by zone parity) — cross-checked against the
   same CN Tower point's well-known MGRS designation (17T PJ ...), which
   matched on zone/band/grid-square exactly. Good enough for a reference
   display on a printed manifest, not claimed to be survey-grade. */
function toDms(lat, lng){
  const part = (deg, posLetter, negLetter) => {
    const letter = deg >= 0 ? posLetter : negLetter;
    deg = Math.abs(deg);
    const d = Math.floor(deg);
    const minFloat = (deg - d) * 60;
    const m = Math.floor(minFloat);
    const s = Math.round((minFloat - m) * 60);
    return `${d}°${m}'${s}"${letter}`;
  };
  return `${part(lat, 'N', 'S')} ${part(lng, 'E', 'W')}`;
}
function toUtm(lat, lng){
  const a = 6378137, f = 1 / 298.257223563; // WGS84
  const k0 = 0.9996;
  const e2 = f * (2 - f);
  const ePrime2 = e2 / (1 - e2);
  const zone = Math.floor((lng + 180) / 6) + 1;
  const lngOriginRad = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
  const latRad = lat * Math.PI / 180;
  const lngRad = lng * Math.PI / 180;

  const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) ** 2);
  const T = Math.tan(latRad) ** 2;
  const C = ePrime2 * Math.cos(latRad) ** 2;
  const A = Math.cos(latRad) * (lngRad - lngOriginRad);
  const M = a * (
    (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * latRad
    - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * latRad)
    + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * latRad)
    - (35 * e2 ** 3 / 3072) * Math.sin(6 * latRad)
  );

  const easting = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T ** 2 + 72 * C - 58 * ePrime2) * A ** 5 / 120) + 500000;
  let northing = k0 * (M + N * Math.tan(latRad) * (A ** 2 / 2 + (5 - T + 9 * C + 4 * C ** 2) * A ** 4 / 24 + (61 - 58 * T + T ** 2 + 600 * C - 330 * ePrime2) * A ** 6 / 720));
  if(lat < 0) northing += 10000000;
  return {zone, easting, northing, hemisphere: lat < 0 ? 'S' : 'N'};
}
function mgrsLatBand(lat){
  const bands = 'CDEFGHJKLMNPQRSTUVWXX'; // skips I/O (look like 1/0); last X is the wide 72-84° band
  if(lat < -80 || lat > 84) return null;
  return bands[Math.min(Math.floor((lat + 80) / 8), bands.length - 1)];
}
function mgrsGridSquare(zone, easting, northing){
  const colSets = ['ABCDEFGH', 'JKLMNPQR', 'STUVWXYZ'];
  const colLetter = colSets[(zone - 1) % 3][Math.floor(easting / 100000) - 1];
  const rowLetters = zone % 2 === 1 ? 'ABCDEFGHJKLMNPQRSTUV' : 'FGHJKLMNPQRSTUVABCDE';
  const rowLetter = rowLetters[Math.floor(northing / 100000) % 20];
  return colLetter + rowLetter;
}
function toMgrs(lat, lng){
  const utm = toUtm(lat, lng);
  const band = mgrsLatBand(lat);
  const grid = mgrsGridSquare(utm.zone, utm.easting, utm.northing);
  const digits = (v) => String(Math.floor(v % 100000)).padStart(5, '0');
  return `${utm.zone}${band} ${grid} ${digits(utm.easting)} ${digits(utm.northing)}`;
}
function formatCoordinatesAs(fmt, lat, lng){
  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return '';
  if(fmt === 'dms') return toDms(lat, lng);
  if(fmt === 'utm'){
    const u = toUtm(lat, lng);
    return `${u.zone}${u.hemisphere} ${Math.round(u.easting)}mE ${Math.round(u.northing)}mN`;
  }
  if(fmt === 'mgrs') return toMgrs(lat, lng);
  return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}
function formatCoordinates(lat, lng){
  return formatCoordinatesAs(state.appSettings.coordFormat || 'decimal', lat, lng);
}

function haversineDistanceKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function computeRouteLegs(checkpoints){
  const ordered = (checkpoints || []).slice().sort((a, b) => a.order - b.order);
  const legs = [];
  for(let i = 1; i < ordered.length; i++){
    legs.push({
      from: ordered[i - 1],
      to: ordered[i],
      km: haversineDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[i].lat, ordered[i].lng)
    });
  }
  const total = legs.reduce((sum, l) => sum + l.km, 0);
  return {legs, total};
}

function slugifyTypeKey(label){
  let base = 'custom-' + String(label).toLowerCase()
    .replace(/[\u00e4\u00f6\u00fc]/g, c => ({\u00e4: 'ae', \u00f6: 'oe', \u00fc: 'ue'}[c]))
    .replace(/\u00df/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
  if(base === 'custom-' || base === 'custom') base = 'custom-typ';
  let key = base, i = 2;
  while(getCheckpointTypes().some(ct => ct.key === key)){ key = base + '-' + i; i++; }
  return key;
}

function onCpDragStart(e, id){
  e.stopPropagation();
  if(e.button) return;
  const row = e.target.closest('.cp-row');
  const list = document.querySelector('.cp-list');
  if(!row || !list) return;
  cpDragState = {row, list};
  row.classList.add('dragging');
  row.setPointerCapture(e.pointerId);
  row.addEventListener('pointermove', onCpDragMove);
  row.addEventListener('pointerup', onCpDragEnd);
  row.addEventListener('pointercancel', onCpDragEnd);
}
function onCpDragMove(e){
  if(!cpDragState) return;
  const {row, list} = cpDragState;
  const listRect = list.getBoundingClientRect();
  const edgeZone = 36;
  if(e.clientY < listRect.top + edgeZone) list.scrollTop -= 10;
  else if(e.clientY > listRect.bottom - edgeZone) list.scrollTop += 10;

  const siblings = Array.from(list.querySelectorAll('.cp-row')).filter(r => r !== row);
  let target = null;
  for(const sibling of siblings){
    const rect = sibling.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if(e.clientY < mid){ target = sibling; break; }
  }
  const beforeRects = new Map(siblings.map(r => [r, r.getBoundingClientRect()]));
  const moved = (() => {
    if(target && row.nextElementSibling !== target){
      list.insertBefore(row, target);
      return true;
    } else if(!target && list.lastElementChild !== row){
      list.appendChild(row);
      return true;
    }
    return false;
  })();
  if(moved) flipAnimateCpRows(siblings, beforeRects);
}
/* FLIP (First-Last-Invert-Play): the reorder above already happened by the
   time this runs, so displaced siblings would otherwise just snap to their
   new slot. Read each one's new position, offset it back to where it was
   with an un-transitioned transform, then release the transform on the next
   frame so the browser animates the settle instead of jump-cutting it. */
function flipAnimateCpRows(rows, beforeRects){
  rows.forEach(r => {
    const before = beforeRects.get(r);
    const after = r.getBoundingClientRect();
    const dy = before.top - after.top;
    if(Math.abs(dy) < 1) return;
    r.style.transition = 'none';
    r.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      r.style.transition = 'transform .18s ease';
      r.style.transform = '';
    });
  });
}
function onCpDragEnd(e){
  if(!cpDragState) return;
  const {row, list} = cpDragState;
  row.classList.remove('dragging');
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  row.removeEventListener('pointermove', onCpDragMove);
  row.removeEventListener('pointerup', onCpDragEnd);
  row.removeEventListener('pointercancel', onCpDragEnd);
  cpDragState = null;

  const newOrderIds = Array.from(list.querySelectorAll('.cp-row')).map(r => r.dataset.cpId);
  const cps = state.currentEvent.checkpoints;
  const byId = new Map(cps.map(c => [c.id, c]));
  const reordered = newOrderIds.map(id => byId.get(id)).filter(Boolean);
  if(reordered.length !== cps.length){ renderSidebar(); return; }
  reordered.forEach((c, i) => c.order = i + 1);
  state.currentEvent.checkpoints = reordered;
  debouncedSave();
  renderSidebar();
  redrawMarkers();
}
function moveCp(id, dir){
  const list = state.currentEvent.checkpoints;
  const idx = list.findIndex(c => c.id === id);
  if(idx === -1 || list[idx].locked || isCpLocked(state.currentEvent)) return;
  const swap = idx + dir;
  if(swap < 0 || swap >= list.length) return;
  [list[idx], list[swap]] = [list[swap], list[idx]];
  list.forEach((c,i) => c.order = i+1);
  debouncedSave();
  renderSidebar();
  redrawMarkers();
}

function confirmDeleteCp(id){
  const cp = findCp(id);
  if(cp && (cp.locked || isCpLocked(state.currentEvent))) return;
  unlinkHqIfCheckpointDeleted(state.currentEvent, id);
  unlinkPairedDropoffIfDeleted(state.currentEvent, id);
  state.currentEvent.checkpoints = state.currentEvent.checkpoints.filter(c => c.id !== id);
  state.currentEvent.checkpoints.forEach((c,i) => c.order = i+1);
  if(state.editingId === id) state.editingId = null;
  state.confirmDeleteCpId = null;
  debouncedSave();

function computeTeamStats(evt){
  const riders = evt.riders || [];
  const mandatoryCps = evt.checkpoints.filter(c => c.mandatory);
  const hasScoredCheckpoints = evt.checkpoints.some(cp => getCheckpointType(cp.type).isScored);
  const mode = evt.teamScoringMode === 'allMustFinish' ? 'allMustFinish' : 'bestTime';
  const teams = (evt.teams || []).map(t => {
    const members = riders.filter(r => r.teamId === t.id);
    const arrivedMembers = members.filter(r => r.finishTime);
    const arrived = arrivedMembers.length;
    const finishTimes = arrivedMembers.map(r => new Date(r.finishTime).getTime()).filter(ms => !isNaN(ms));
    const bestTime = finishTimes.length ? Math.min(...finishTimes) : null;
    const allFinished = members.length > 0 && arrived === members.length;
    const worstTime = allFinished && finishTimes.length ? Math.max(...finishTimes) : null;
    const doneMandatory = members.reduce((sum, r) => sum + mandatoryCps.filter(cp => (r.completed || []).includes(cp.id)).length, 0);
    const totalScore = members.reduce((sum, r) => sum + Object.values(r.scores || {}).reduce((s, v) => s + (Number(v) || 0), 0), 0);
    return {team: t, memberCount: members.length, arrived, doneMandatory, totalScore, bestTime, worstTime, allFinished};
  });
  if(mode === 'allMustFinish'){
    teams.sort((a, b) => {
      if(a.allFinished !== b.allFinished) return a.allFinished ? -1 : 1;
      if(a.allFinished && b.allFinished) return a.worstTime - b.worstTime;
      return b.arrived - a.arrived || b.totalScore - a.totalScore;
    });
  } else {
    teams.sort((a, b) => {
      if(!!a.bestTime !== !!b.bestTime) return a.bestTime ? -1 : 1;
      if(a.bestTime && b.bestTime) return a.bestTime - b.bestTime;
      return b.arrived - a.arrived || b.totalScore - a.totalScore;
    });
  }
  return {teams, hasScoredCheckpoints, mandatoryTotal: mandatoryCps.length, scoringMode: mode};
}

    if(!confirm(t('category.importPreview', {count: parsed.length, overwrite}))){ input.value = ''; return; }
    parsed.forEach(g => {

      const idx = evt.categoryGroups.findIndex(existing => existing.name === g.name);
      const merged = withCategoryGroupDefaults({
        id: idx > -1 ? evt.categoryGroups[idx].id : uid('catgrp'),

        sortOrder: idx > -1 ? evt.categoryGroups[idx].sortOrder : evt.categoryGroups.length

/* ---------------- zones: data model + geometry ----------------
   Foundation for Paket 4 (Großes Karten-Programm). Pure data model +
   geometry, no game-mode awareness by design — game modes (zone_active/
   Battle Royale in rules-engine.js, districts in game-modes.js) read and
   mutate zone fields (`active`, `radiusMeters`) but the logic of what
   those mean lives with them, not here. Circle math reuses
   haversineDistanceKm() (utils.js) rather than a flat-plane approximation,
   consistent with how the rest of the app already measures checkpoint
   distances. Polygon point-in-polygon uses a standard ray-casting test
   directly on lat/lng — a flat-plane simplification that's fine at the
   city-block scale these events operate at, same tradeoff the original
   centroid-based zoneCenterOf() (rules-engine.js) already made.
   `group` is a loose tag ('' | 'battle_royale' | 'district') set by
   whichever game mode a zone gets attached to — deliberately not an
   enum enforced here, since zones.js shouldn't need to know what game
   modes exist. `active` only has meaning for 'district' zones today
   (independently toggled); Battle Royale instead tracks its one current
   zone via mode.config.zoneId, so it doesn't need this flag. */
function withZoneDefaults(z){
  return Object.assign({
    id: uid('zone'),
    name: '',
    type: 'circle', // 'circle' | 'polygon'
    color: '#ff5f1f',
    group: '',    // '' | 'battle_royale' | 'district'
    active: false, // generic on/off flag — meaningful for 'district' zones (per-zone HQ toggle) and for hiddenOnBeamerUntilActive on any zone
    center: null,      // {lat, lng} — circle only
    radiusMeters: 300, // circle only — also the shrink *start* radius when shrinkEnabled
    points: [],        // [{lat, lng}, ...], >= 3 — polygon only
    visibleOnHqMap: true,
    hiddenOnBeamerUntilActive: false,
    // Live, continuous radius shrink — circle-only, independent of any game
    // mode (unlike Battle Royale's discrete stage-based shrink in
    // rules-engine.js, which mutates radiusMeters directly on each stage
    // change instead). Polygon zones deliberately have no shrink concept.
    shrinkEnabled: false,
    shrinkMode: 'duration', // 'duration' | 'curfew'
    shrinkDurationMinutes: 60,
    shrinkEndRadiusMeters: 20
  }, z);
}
/* Radius a circle zone actually has right now, linearly interpolated between
   radiusMeters (at evt.startConfirmedAt) and shrinkEndRadiusMeters (at either
   startConfirmedAt + shrinkDurationMinutes, or evt.curfewTime). Returns the
   plain stored radiusMeters whenever shrink isn't enabled/configured, before
   the race has actually started, or when evt isn't supplied — callers that
   don't care about live shrink (e.g. existing tests) keep working unchanged. */
function effectiveZoneRadius(zone, evt, atDate){
  if(!zone) return 0;
  if(zone.type !== 'circle' || !zone.shrinkEnabled || !evt) return zone.radiusMeters;
  const start = evt.startConfirmedAt ? new Date(evt.startConfirmedAt) : null;
  if(!start || isNaN(start.getTime())) return zone.radiusMeters;
  const end = zone.shrinkMode === 'curfew'
    ? (evt.curfewTime ? new Date(evt.curfewTime) : null)
    : new Date(start.getTime() + numOr(zone.shrinkDurationMinutes, 60) * 60000);
  if(!end || isNaN(end.getTime()) || end <= start) return zone.radiusMeters;
  const now = atDate || new Date();
  if(now <= start) return zone.radiusMeters;
  const endRadius = numOr(zone.shrinkEndRadiusMeters, 0);
  if(now >= end) return endRadius;
  const progress = (now - start) / (end - start);
  return zone.radiusMeters - (zone.radiusMeters - endRadius) * progress;
}
/* First zone (in evt.zones array order) whose shape contains the point —
   array order is the deliberate, simple tie-break for overlapping zones
   (same "order decides" convention as category options/checkpoint types/
   PDF blocks/dashboard widgets elsewhere in this app); manual per-checkpoint
   overrides for edge cases are a deferred nice-to-have, not built here. */
function getCheckpointZone(cp, zones, evt){
  if(!cp || !Number.isFinite(cp.lat) || !Number.isFinite(cp.lng)) return null;
  return (zones || []).find(z => isPointInZone(cp.lat, cp.lng, z, evt)) || null;
}
function addZone(evt, zone){
  evt.zones = evt.zones || [];
  const z = withZoneDefaults(zone);
  evt.zones.push(z);
  return z;
}
function removeZone(evt, id){
  evt.zones = (evt.zones || []).filter(z => z.id !== id);
}
function getZone(evt, id){
  return (evt.zones || []).find(z => z.id === id) || null;
}
function updateZone(evt, id, patch){
  const z = getZone(evt, id);
  if(!z) return null;
  Object.assign(z, patch);
  return z;
}

/* ---------------- geometry ---------------- */
function isPointInCircle(lat, lng, centerLat, centerLng, radiusMeters){
  if(![lat, lng, centerLat, centerLng, radiusMeters].every(Number.isFinite)) return false;
  return haversineDistanceKm(lat, lng, centerLat, centerLng) * 1000 <= radiusMeters;
}
function isPointInPolygon(lat, lng, points){
  if(!Number.isFinite(lat) || !Number.isFinite(lng) || !Array.isArray(points) || points.length < 3) return false;
  let inside = false;
  for(let i = 0, j = points.length - 1; i < points.length; j = i++){
    const yi = points[i].lat, xi = points[i].lng;
    const yj = points[j].lat, xj = points[j].lng;
    const intersects = ((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if(intersects) inside = !inside;
  }
  return inside;
}
function isPointInZone(lat, lng, zone, evt){
  if(!zone) return false;
  if(zone.type === 'polygon') return isPointInPolygon(lat, lng, zone.points);
  if(!zone.center || !Number.isFinite(zone.center.lat) || !Number.isFinite(zone.center.lng)) return false;
  return isPointInCircle(lat, lng, zone.center.lat, zone.center.lng, effectiveZoneRadius(zone, evt));
}
function polygonCentroid(points){
  if(!Array.isArray(points) || !points.length) return null;
  return {
    lat: points.reduce((s, p) => s + p.lat, 0) / points.length,
    lng: points.reduce((s, p) => s + p.lng, 0) / points.length
  };
}


/* ---------------- event locations: HQ & Afterparty ----------------
   Sonderorte sind Informationspunkte ohne Check-in-Logik, kein Checkpoint
   im eigentlichen Sinn (Spec 15.1). Höchstens ein Eintrag pro `type` —
   anders als zones.js (beliebig viele Zonen) ist "mehrere Headquarters"
   kein sinnvoller Anwendungsfall, daher hier bewusst kein Array-CRUD mit
   IDs im UI, sondern get/ensure/remove pro Typ. */
function withEventLocationDefaults(loc){
  return Object.assign({
    id: uid('loc'),
    type: 'headquarters', // 'headquarters' | 'afterparty'
    name: '',
    lat: null,
    lng: null,
    address: '',
    notes: '',
    linkedCheckpointId: null
  }, loc);
}
function getEventLocation(evt, type){
  return (evt.eventLocations || []).find(l => l.type === type) || null;
}
function ensureEventLocation(evt, type){
  evt.eventLocations = evt.eventLocations || [];
  let loc = getEventLocation(evt, type);
  if(!loc){
    loc = withEventLocationDefaults({type});
    evt.eventLocations.push(loc);
  }
  return loc;
}
function removeEventLocation(evt, type){
  evt.eventLocations = (evt.eventLocations || []).filter(l => l.type !== type);
}
function eventLocationHasPosition(loc){
  return !!loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lng);
}
function mapsDeepLink(lat, lng){
  return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
}
function mapsDirectionsLink(origin, dest){
  return `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${dest.lat},${dest.lng}`;
}
/* "HQ oder letzter Checkpoint → Afterparty" per Spec 15.1 — HQ ist der
   bevorzugte Startpunkt (falls gesetzt), sonst der letzte Checkpoint nach
   Reihenfolge als sinnvoller Fallback-Ausgangspunkt für die Anfahrt. */
function afterpartyRouteOrigin(evt){
  const hq = getEventLocation(evt, 'headquarters');
  if(eventLocationHasPosition(hq)) return {lat: hq.lat, lng: hq.lng};
  const ordered = (evt.checkpoints || []).slice().sort((a, b) => b.order - a.order);
  const last = ordered[0];
  if(last && Number.isFinite(last.lat) && Number.isFinite(last.lng)) return {lat: last.lat, lng: last.lng};
  return null;
}

/* ---------------- HQ <-> checkpoint link ---------------- */
function isCheckpointHq(evt, cpId){

/* Returns false if the user cancelled a required confirm (switching HQ from

function setCheckpointAsHq(evt, cpId, checked){

  if(checked){
    if(existing && existing.linkedCheckpointId && existing.linkedCheckpointId !== cpId){
      const otherCp = evt.checkpoints.find(c => c.id === existing.linkedCheckpointId);
      if(!confirm(t('eventLocations.switchHqConfirm', {name: otherCp ? (otherCp.name || t('checkpoint.noName')) : t('eventLocations.unknownCheckpoint')}))) return false;

}

/* ---------------- orga pins: data model ----------------
   Purely internal planning markers (Baustellen, gefährliche Kreuzungen,
   Sammelpunkte) per Spec 18.4 — array-based like zones.js (any number of
   pins, unlike the single-per-type HQ/Afterparty above), but small enough
   to live alongside the other "special map object" data here rather than
   its own module. Never rendered on rider-facing exports or the beamer —
   there's deliberately no per-pin visibility flag for that (the spec's own
   `visible_on_hq_only` field would always be true in practice, since pins
   are categorically HQ-only; a flag that never varies is dead config). */
function withOrgaPinDefaults(p){

    id: uid('pin'),
    type: 'note', // 'warning' | 'danger' | 'note' | 'info'
    title: '',
    notes: '',
    lat: null,
    lng: null
  }, p);
}
function addOrgaPin(evt, pin){

  const p = withOrgaPinDefaults(pin);
  evt.orgaPins.push(p);
  return p;
}
function getOrgaPin(evt, id){

}
function removeOrgaPin(evt, id){

/* ---------------- logistics: TSP route estimator ----------------
   Paket 4 Teil B, Schritt 1. Planning-only aid — never touches
   evt.checkpoints[].order or checkpointOrderMode, purely computes an
   estimated minimal-distance visiting order via nearest-neighbor +
   2-opt local search (a classic, good-enough heuristic at the small n
   this app operates at — a handful to a few dozen checkpoints; no need
   for anything more sophisticated like Lin-Kernighan). Modeled as an
   open path (fixed start, free end) rather than a closed tour, since
   alleycats don't loop back to the start. */
function tourDistanceKm(points, tour){
  let total = 0;
  for(let i = 0; i < tour.length - 1; i++){
    total += haversineDistanceKm(points[tour[i]].lat, points[tour[i]].lng, points[tour[i + 1]].lat, points[tour[i + 1]].lng);
  }
  return total;
}
function nearestNeighborTour(points, startIdx){
  const n = points.length;
  const visited = new Array(n).fill(false);
  const tour = [startIdx];
  visited[startIdx] = true;
  for(let step = 1; step < n; step++){
    const last = tour[tour.length - 1];
    let best = -1, bestDist = Infinity;
    for(let i = 0; i < n; i++){
      if(visited[i]) continue;
      const d = haversineDistanceKm(points[last].lat, points[last].lng, points[i].lat, points[i].lng);
      if(d < bestDist){ bestDist = d; best = i; }
    }
    tour.push(best);
    visited[best] = true;
  }
  return tour;
}
function twoOptSwap(tour, i, k){
  return [...tour.slice(0, i), ...tour.slice(i, k + 1).reverse(), ...tour.slice(k + 1)];
}
/* Index 0 (the fixed start — HQ or the first checkpoint) is deliberately
   never touched by the swap range (i starts at 1), so it stays fixed
   across every improvement pass. */
function twoOptImprove(points, tour){
  let best = tour.slice();
  let bestDist = tourDistanceKm(points, best);
  const n = best.length;
  let improved = true;
  while(improved){
    improved = false;
    for(let i = 1; i < n - 2; i++){
      for(let k = i + 1; k < n - 1; k++){
        const candidate = twoOptSwap(best, i, k);
        const candidateDist = tourDistanceKm(points, candidate);
        if(candidateDist < bestDist - 1e-9){
          best = candidate;
          bestDist = candidateDist;
          improved = true;
        }
      }
    }
  }
  return {tour: best, distanceKm: bestDist};
}
/* HQ (if set) is the fixed starting point — that's genuinely where the race
   begins; otherwise the checkpoint with order 1 anchors the estimate. */
function estimateOptimalRoute(evt){
  const checkpoints = (evt.checkpoints || []).filter(cp => Number.isFinite(cp.lat) && Number.isFinite(cp.lng)).slice().sort((a, b) => a.order - b.order);
  if(checkpoints.length < 2) return null;
  const hq = getEventLocation(evt, 'headquarters');
  const points = [];
  if(eventLocationHasPosition(hq)) points.push({lat: hq.lat, lng: hq.lng, id: '__hq__'});
  checkpoints.forEach(cp => points.push({lat: cp.lat, lng: cp.lng, id: cp.id}));
  if(points.length < 2) return null;

  const currentOrderTour = points.map((p, i) => i);
  const currentDistanceKm = tourDistanceKm(points, currentOrderTour);

  const nnTour = nearestNeighborTour(points, 0);
  const {tour, distanceKm} = twoOptImprove(points, nnTour);

  return {
    points,
    currentDistanceKm,
    optimizedDistanceKm: distanceKm,
    optimizedOrderIds: tour.map(idx => points[idx].id),
    savingsKm: Math.max(0, currentDistanceKm - distanceKm)
  };
}
function estimateRouteTimeMinutes(km, avgSpeedKmh){
  if(!Number.isFinite(avgSpeedKmh) || avgSpeedKmh <= 0) return 0;
  return (km / avgSpeedKmh) * 60;
}
function formatEstimatedDuration(minutes){
  const totalMin = Math.round(minutes);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}
/* Average speed is a per-organizer device preference, not event data —
   same localStorage pattern as alleycat:sidebarWidth. */
function currentAvgSpeedKmh(){
  try{
    const v = parseFloat(localStorage.getItem('alleycat:avgSpeedKmh'));
    if(!isNaN(v) && v > 0) return v;
  }catch(e){}
  return 18;
}

/* ---------------- proximity buffer rings + clustering warning ----------------
   Paket 4 Teil B, Schritt 2. Purely geometric — flags any two checkpoints
   closer together than a configurable buffer radius, since tightly clustered
   checkpoints are a common raceday confusion source (riders/marshals at the
   wrong one, GPS jitter mixing them up). Two severities, same convention
   offline-tiles.js already established for cache staleness: 'warn' for any
   pair inside the buffer, 'danger' for pairs so close they're almost
   certainly an accidental duplicate placement. */
const PROXIMITY_DANGER_METERS = 5;
function findProximityClusters(evt, thresholdMeters){
  const checkpoints = (evt.checkpoints || []).filter(cp => Number.isFinite(cp.lat) && Number.isFinite(cp.lng));
  const pairs = [];
  for(let i = 0; i < checkpoints.length; i++){
    for(let j = i + 1; j < checkpoints.length; j++){
      const distanceMeters = haversineDistanceKm(checkpoints[i].lat, checkpoints[i].lng, checkpoints[j].lat, checkpoints[j].lng) * 1000;
      if(distanceMeters < thresholdMeters) pairs.push({a: checkpoints[i], b: checkpoints[j], distanceMeters});
    }
  }
  return pairs;
}
function proximityClusterSeverity(pairs){
  if(!pairs.length) return null;
  return pairs.some(p => p.distanceMeters < PROXIMITY_DANGER_METERS) ? 'danger' : 'warn';
}
function clusteredCheckpointIds(pairs){
  const ids = new Set();
  pairs.forEach(p => { ids.add(p.a.id); ids.add(p.b.id); });
  return ids;
}
/* Buffer radius is a per-organizer device preference, not event data — same
   localStorage pattern as alleycat:avgSpeedKmh above. */
function currentProximityBufferMeters(){
  try{
    const v = parseFloat(localStorage.getItem('alleycat:proximityBufferMeters'));
    if(!isNaN(v) && v > 0) return v;
  }catch(e){}
  return 30;
}
function onProximityBufferMetersChange(value){
  const m = Math.max(1, parseFloat(value) || 1);
  try{ localStorage.setItem('alleycat:proximityBufferMeters', String(m)); }catch(e){}
  renderSidebar();
  if(state.showProximityBuffers) redrawProximityBuffers();
}
function toggleProximityBuffersOnMap(){
  state.showProximityBuffers = !state.showProximityBuffers;
  redrawProximityBuffers();
  renderSidebar();
}
function renderProximitySection(evt){
  const bufferMeters = currentProximityBufferMeters();
  const clusterPairs = findProximityClusters(evt, bufferMeters);
  const severity = proximityClusterSeverity(clusterPairs);
  return `
    <div class="logistics-subheading">${t('logistics.proximityHeading')}</div>
    <div class="settings-hint">${t('logistics.proximityHint')}</div>
    <div class="logistics-speed-row">
      <label>${t('logistics.proximityRadiusLabel')}</label>
      <input type="number" min="1" step="5" value="${bufferMeters}" onchange="onProximityBufferMetersChange(this.value)"> m
    </div>
    <label class="checkbox-row"><input type="checkbox" ${state.showProximityBuffers ? 'checked' : ''} onchange="toggleProximityBuffersOnMap()">${t('logistics.proximityShowOnMap')}</label>
    ${clusterPairs.length ? `<div class="logistics-cluster-warning ${severity === 'danger' ? 'danger' : ''}">${t('logistics.proximityClusterWarning', {count: clusterPairs.length, radius: bufferMeters})}</div>` : ''}
  `;
}

          <div class="settings-hint">${t('logistics.hint')}</div>
          <button type="button" class="btn btn-sm" onclick="runRouteEstimate()">${t('logistics.estimateButton')}</button>
          ${routeBody}
          ${renderProximitySection(evt)}
        </div>
      ` : ''}

}


/* ---------------- geo import: GPX / GeoJSON / KML reference layers ----------------
   Spec 18.5. Hand-rolled parsers (DOMParser for GPX/KML, JSON.parse for
   GeoJSON) — all native browser APIs, no new dependency, consistent with
   PROJEKT-UEBERSICHT.md §9's "kein Fremd-Framework" policy (Leaflet.draw is
   the one documented exception, and this isn't a Leaflet plugin at all).
   Purely a *reference* layer for planning (e.g. a city's main bike network,
   a Komoot pre-plan) — not a data model the rest of the app reads from;
   the only bridge back into real event data is the explicit "convert to
   checkpoint" action on an imported waypoint.

   Per spec, an imported layer can be "temporär oder persistent": temporary
   layers live in `state.geoImportLayers` (session-only, lost on reload —
   the sensible default for a large imported track nobody wants bloating
   every future save of the event JSON) and persistent ones move into
   `evt.importedGeoLayers` via setGeoImportLayerPersistent(). Both arrays
   share the same layer shape and are merged for rendering via
   allGeoImportLayers() — callers never need to care which array a given
   layer currently lives in. */
const GEO_IMPORT_COLORS = ['#3fa9f5', '#c76bd6', '#5c8a5c', '#d9a406'];
function withGeoImportLayerDefaults(l){
  return Object.assign({
    id: uid('geo'),
    name: '',
    filename: '',
    format: 'gpx', // 'gpx' | 'geojson' | 'kml'
    color: '#3fa9f5',
    visible: true,
    tracks: [],  // [[{lat,lng}, ...], ...]
    points: []   // [{lat,lng,name}, ...]
  }, l);
}
function allGeoImportLayers(evt){
  return [...(evt.importedGeoLayers || []), ...(state.geoImportLayers || [])];
}
function findGeoImportLayer(evt, id){
  return allGeoImportLayers(evt).find(l => l.id === id) || null;
}
function removeGeoImportLayer(evt, id){
  evt.importedGeoLayers = (evt.importedGeoLayers || []).filter(l => l.id !== id);
  state.geoImportLayers = (state.geoImportLayers || []).filter(l => l.id !== id);
}
function setGeoImportLayerPersistent(evt, id, persistent){
  evt.importedGeoLayers = evt.importedGeoLayers || [];
  state.geoImportLayers = state.geoImportLayers || [];
  if(persistent){
    const idx = state.geoImportLayers.findIndex(l => l.id === id);
    if(idx >= 0) evt.importedGeoLayers.push(state.geoImportLayers.splice(idx, 1)[0]);
  } else {
    const idx = evt.importedGeoLayers.findIndex(l => l.id === id);
    if(idx >= 0) state.geoImportLayers.push(evt.importedGeoLayers.splice(idx, 1)[0]);
  }
}
function isGeoImportLayerPersistent(evt, id){
  return (evt.importedGeoLayers || []).some(l => l.id === id);
}

/* ---------------- parsers ----------------
   Uniform output: {tracks: [[{lat,lng},...],...], points: [{lat,lng,name},...]}
   or null if the file couldn't be parsed as that format. Every point is
   filtered on Number.isFinite so a malformed coordinate drops silently
   rather than producing a broken marker at (NaN, NaN) — same defensive
   convention as zones.js's isPointInCircle(). */
function parseGpxFile(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.querySelector('parsererror')) return null;
  const tracks = [];
  const trkPtsOf = (seg) => Array.from(seg.querySelectorAll('trkpt'))
    .map(pt => ({lat: parseFloat(pt.getAttribute('lat')), lng: parseFloat(pt.getAttribute('lon'))}))
    .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  doc.querySelectorAll('trk > trkseg').forEach(seg => { const pts = trkPtsOf(seg); if(pts.length >= 2) tracks.push(pts); });
  doc.querySelectorAll('rte').forEach(rte => {
    const pts = Array.from(rte.querySelectorAll('rtept'))
      .map(pt => ({lat: parseFloat(pt.getAttribute('lat')), lng: parseFloat(pt.getAttribute('lon'))}))
      .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    if(pts.length >= 2) tracks.push(pts);
  });
  const points = Array.from(doc.querySelectorAll('wpt')).map(pt => {
    const nameEl = pt.querySelector('name');
    return {lat: parseFloat(pt.getAttribute('lat')), lng: parseFloat(pt.getAttribute('lon')), name: nameEl ? nameEl.textContent.trim() : ''};
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  if(!tracks.length && !points.length) return null;
  return {tracks, points};
}
function parseGeoJsonFile(text){
  let json;
  try{ json = JSON.parse(text); }catch(e){ return null; }
  const tracks = [], points = [];
  const lineFromCoords = (coords) => coords.map(c => ({lat: c[1], lng: c[0]})).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  const handleGeometry = (geom, props) => {
    if(!geom || !geom.type) return;
    if(geom.type === 'Point'){
      const [lng, lat] = geom.coordinates || [];
      if(Number.isFinite(lat) && Number.isFinite(lng)) points.push({lat, lng, name: (props && (props.name || props.title)) || ''});
    } else if(geom.type === 'LineString'){
      const pts = lineFromCoords(geom.coordinates || []);
      if(pts.length >= 2) tracks.push(pts);
    } else if(geom.type === 'MultiLineString'){
      (geom.coordinates || []).forEach(line => { const pts = lineFromCoords(line); if(pts.length >= 2) tracks.push(pts); });
    } else if(geom.type === 'Polygon'){
      const pts = lineFromCoords((geom.coordinates || [])[0] || []);
      if(pts.length >= 2) tracks.push(pts);
    } else if(geom.type === 'MultiPolygon'){
      (geom.coordinates || []).forEach(poly => { const pts = lineFromCoords(poly[0] || []); if(pts.length >= 2) tracks.push(pts); });
    } else if(geom.type === 'GeometryCollection'){
      (geom.geometries || []).forEach(g => handleGeometry(g, props));
    }
  };
  if(json.type === 'FeatureCollection') (json.features || []).forEach(f => handleGeometry(f.geometry, f.properties));
  else if(json.type === 'Feature') handleGeometry(json.geometry, json.properties);
  else if(json.type) handleGeometry(json, null);
  else return null;
  if(!tracks.length && !points.length) return null;
  return {tracks, points};
}
function parseKmlFile(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.querySelector('parsererror')) return null;
  const tracks = [], points = [];
  const parseCoordText = (raw) => (raw || '').trim().split(/\s+/).filter(Boolean).map(tuple => {
    const parts = tuple.split(',').map(Number);
    return {lat: parts[1], lng: parts[0]};
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  doc.querySelectorAll('Placemark').forEach(pm => {
    const nameEl = pm.querySelector('name');
    const name = nameEl ? nameEl.textContent.trim() : '';
    const pointCoords = pm.querySelector('Point > coordinates');
    if(pointCoords){
      const pts = parseCoordText(pointCoords.textContent);
      if(pts.length) points.push({lat: pts[0].lat, lng: pts[0].lng, name});
    }
    pm.querySelectorAll('LineString > coordinates, LinearRing > coordinates').forEach(coordEl => {
      const pts = parseCoordText(coordEl.textContent);
      if(pts.length >= 2) tracks.push(pts);
    });
  });
  if(!tracks.length && !points.length) return null;
  return {tracks, points};
}
/* Dispatches on file extension (case-insensitive) — .json also accepted as
   GeoJSON since exports from common tools (geojson.io, QGIS) often use it. */
function parseGeoImportFile(filename, text){
  const ext = (filename.split('.').pop() || '').toLowerCase();
  let format, result;
  if(ext === 'gpx'){ format = 'gpx'; result = parseGpxFile(text); }
  else if(ext === 'geojson' || ext === 'json'){ format = 'geojson'; result = parseGeoJsonFile(text); }
  else if(ext === 'kml'){ format = 'kml'; result = parseKmlFile(text); }
  else return null;
  if(!result) return null;
  return Object.assign({format}, result);
}

/* ---------------- action log (generic undo) ----------------
   Beyond the check-in view's own dedicated undo (unconfirmRiderAtFinish
   in checkin.js, which has always worked as a one-off toast), this is a
   small, reusable mechanism for other destructive/easy-to-fat-finger
   actions elsewhere in the app: rider deleted, category assignment
   changed, category group/option deleted. evt.actionLog holds the last
   few entries ({id, label, at}) so they stay visible even after the
   originating toast has timed out; the actual undo closures only live
   for the current session in state.actionUndoHandlers (functions can't
   be persisted), so a page reload clears undo-ability but keeps the
   log entries themselves as an audit trail. */
function logUndoableAction(evt, label, undoFn){
  evt.actionLog = evt.actionLog || [];
  const id = uid('action');
  evt.actionLog.push({id, label, at: toLocalDateTimeInputValue(new Date())});
  if(evt.actionLog.length > 5) evt.actionLog = evt.actionLog.slice(-5);
  state.actionUndoHandlers = state.actionUndoHandlers || {};
  state.actionUndoHandlers[id] = undoFn;
  debouncedSave();
  showToast({
    message: label,
    actionLabel: t('actionLog.undoAction'),
    onAction: () => undoLoggedAction(id)
  });
}
function undoLoggedAction(id){
  const evt = state.currentEvent;
  if(!evt) return;
  const handler = state.actionUndoHandlers && state.actionUndoHandlers[id];
  if(!handler) return;
  handler();
  evt.actionLog = (evt.actionLog || []).filter(e => e.id !== id);
  delete state.actionUndoHandlers[id];
  debouncedSave();
}
function renderActionLogPanel(evt){
  const entries = (evt.actionLog || []).slice().reverse();
  if(!entries.length) return '';
  return `
    <div class="action-log-panel">
      <div class="action-log-title">${t('actionLog.panelTitle')}</div>
      <ul class="action-log-list">
        ${entries.map(e => `
          <li>
            <span class="action-log-time">${formatTimeOnly(e.at)}</span>
            <span class="action-log-label">${escapeHtml(e.label)}</span>
            ${state.actionUndoHandlers && state.actionUndoHandlers[e.id] ? `<button type="button" class="btn btn-ghost btn-sm" onclick="undoLoggedAction('${e.id}'); renderRiders();">${t('actionLog.undoAction')}</button>` : ''}
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}


/* ---------------- bulk import (CSV Fahrerliste) ----------------
   3-step inline panel (rendered into rider.js's toolbar area, no
   modal/overlay needed — matches the pdf-blocks panel pattern):
   upload -> mapping -> review. Validates before import (missing/
   invalid/duplicate Startnummer) and surfaces an error list instead
   of silently skipping rows (spec 4.17) — only rows that pass
   validation are ever written to evt.riders/teams. The whole apply
   step is wrapped in logUndoableAction() so an accidental import can
   be undone like any other action-log entry. */
function detectCsvDelimiter(text){
  const firstLine = (text.split(/\r\n|\n|\r/)[0] || '');
  const semi = (firstLine.match(/;/g) || []).length;
  const comma = (firstLine.match(/,/g) || []).length;
  return semi >= comma ? ';' : ',';
}
function parseCsvText(text){
  const delimiter = detectCsvDelimiter(text);
  const src = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < src.length; i++){
    const c = src[i];
    if(inQuotes){
      if(c === '"'){
        if(src[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
      continue;
    }
    if(c === '"'){ inQuotes = true; }
    else if(c === delimiter){ row.push(field); field = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && src[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else field += c;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c && c.trim() !== ''));
}
function guessBulkImportMapping(headerRow){
  const norm = s => (s || '').toLowerCase().trim();
  const find = (patterns) => {
    const idx = (headerRow || []).findIndex(h => patterns.some(p => norm(h).includes(p)));
    return idx > -1 ? String(idx) : '';
  };
  return {
    bib: find(['startnummer', 'bib', 'nr.', 'nr', 'nummer']),
    name: find(['name']),
    team: find(['team']),
    emergency: find(['notfall', 'emergency', 'kontakt'])
  };
}
function toggleBulkImportPanel(){
  state.bulkImportOpen = !state.bulkImportOpen;
  state.bulkImportStep = 'upload';
  state.bulkImportRows = [];
  state.bulkImportErrors = [];
  state.bulkImportValidRows = [];
  renderRiders();
}
async function onBulkImportFileChange(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const text = await file.text();
  const rows = parseCsvText(text);
  input.value = '';
  if(!rows.length){ alert(t('bulkImport.errorEmptyFile')); return; }
  state.bulkImportRows = rows;
  state.bulkImportHasHeader = true;
  state.bulkImportMapping = guessBulkImportMapping(rows[0]);
  state.bulkImportStep = 'mapping';
  renderRiders();
}
function onBulkImportHeaderToggle(checked){
  state.bulkImportHasHeader = checked;
  state.bulkImportMapping = guessBulkImportMapping(checked ? state.bulkImportRows[0] : []);
  renderRiders();
}
function onBulkImportMappingChange(field, value){
  state.bulkImportMapping[field] = value;
}
function backToBulkImportMapping(){
  state.bulkImportStep = 'mapping';
  renderRiders();
}
function runBulkImportValidation(){
  const rows = state.bulkImportRows;
  const map = state.bulkImportMapping;
  const dataRows = state.bulkImportHasHeader ? rows.slice(1) : rows;
  const lineOffset = state.bulkImportHasHeader ? 2 : 1;
  const errors = [];
  const valid = [];
  if(!map.bib){
    state.bulkImportErrors = [{line: 0, message: t('bulkImport.errorNoBibColumn')}];
    state.bulkImportValidRows = [];
    state.bulkImportStep = 'review';
    renderRiders();
    return;
  }
  const seenBibs = new Set();
  dataRows.forEach((row, i) => {
    const line = i + lineOffset;
    const bibRaw = (row[Number(map.bib)] || '').trim();
    if(!/^\d+$/.test(bibRaw) || parseInt(bibRaw, 10) <= 0){
      errors.push({line, message: t('bulkImport.errorInvalidBib', {value: bibRaw || '—'})});
      return;
    }
    const bib = parseInt(bibRaw, 10);
    if(seenBibs.has(bib)){
      errors.push({line, message: t('bulkImport.errorDuplicateBib', {bib})});
      return;
    }
    seenBibs.add(bib);
    valid.push({
      bib,
      name: map.name !== '' ? (row[Number(map.name)] || '').trim() : '',
      teamName: map.team !== '' ? (row[Number(map.team)] || '').trim() : '',
      emergencyContact: map.emergency !== '' ? (row[Number(map.emergency)] || '').trim() : ''
    });
  });
  state.bulkImportErrors = errors;
  state.bulkImportValidRows = valid;
  state.bulkImportStep = 'review';
  renderRiders();
}
function applyBulkImportRows(){
  const evt = state.currentEvent;
  const rows = state.bulkImportValidRows;
  if(!rows.length) return;
  const ridersSnapshot = JSON.parse(JSON.stringify(evt.riders || []));
  const teamsSnapshot = JSON.parse(JSON.stringify(evt.teams || []));
  const expectedSnapshot = evt.expectedRiders || 0;
  evt.riders = evt.riders || [];
  evt.teams = evt.teams || [];
  let created = 0, updated = 0;
  rows.forEach(row => {
    let r = evt.riders.find(x => x.bib === row.bib);
    if(!r){
      r = withRiderDefaults({bib: row.bib});
      evt.riders.push(r);
      created++;
    } else updated++;
    if(row.name) r.name = row.name;
    if(row.emergencyContact) r.emergencyContact = row.emergencyContact;
    if(row.teamName){
      let team = evt.teams.find(tm => tm.name === row.teamName);
      if(!team){
        team = {id: uid('team'), name: row.teamName, color: TEAM_COLOR_PALETTE[evt.teams.length % TEAM_COLOR_PALETTE.length]};
        evt.teams.push(team);
      }
      r.teamId = team.id;
    }
  });
  evt.riders.sort((a, b) => a.bib - b.bib);
  const maxBib = evt.riders.reduce((m, r) => Math.max(m, r.bib), 0);
  if(maxBib > (evt.expectedRiders || 0)) evt.expectedRiders = maxBib;
  state.bulkImportOpen = false;
  state.bulkImportStep = 'upload';
  state.bulkImportRows = [];
  state.bulkImportValidRows = [];
  state.bulkImportErrors = [];
  renderRiders();
  logUndoableAction(evt, t('actionLog.bulkImportApplied', {created, updated}), () => {
    evt.riders = ridersSnapshot;
    evt.teams = teamsSnapshot;
    evt.expectedRiders = expectedSnapshot;
    renderRiders();
  });
}
function bulkImportColumnOptions(selectedValue){
  const rows = state.bulkImportRows;
  const headerRow = rows[0] || [];
  return `<option value="">${t('bulkImport.columnNone')}</option>` + headerRow.map((h, i) => {
    const label = state.bulkImportHasHeader && h ? h : (t('bulkImport.columnFallback') + ' ' + (i + 1));
    return `<option value="${i}" ${String(selectedValue) === String(i) ? 'selected' : ''}>${escapeHtml(label)}</option>`;
  }).join('');
}
function renderBulkImportPanel(){

        <div><label>${t('bulkImport.fieldName')}</label><select onchange="onBulkImportMappingChange('name', this.value)">${bulkImportColumnOptions(map.name)}</select></div>
        <div><label>${t('bulkImport.fieldTeam')}</label><select onchange="onBulkImportMappingChange('team', this.value)">${bulkImportColumnOptions(map.team)}</select></div>
        <div><label>${t('bulkImport.fieldEmergency')}</label><select onchange="onBulkImportMappingChange('emergency', this.value)">${bulkImportColumnOptions(map.emergency)}</select></div>

    body = `

        ${errors.length ? `<span class="bulk-import-summary-err">${t('bulkImport.summaryErrors', {count: errors.length})}</span>` : ''}
      </div>
      ${errors.length ? `

      ${valid.length ? `

          </tbody>
        </table>
        ${valid.length > 8 ? `<div class="riders-hint" style="padding:0;">${t('bulkImport.previewMore', {count: valid.length - 8})}</div>` : ''}
      ` : ''}
      <div class="form-actions">
        <button class="btn btn-primary" onclick="applyBulkImportRows()" ${valid.length ? '' : 'disabled'}>${t('bulkImport.applyButton', {count: valid.length})}</button>
        <button class="btn btn-ghost" onclick="backToBulkImportMapping()">${t('common.back')}</button>
        <button class="btn btn-ghost" onclick="toggleBulkImportPanel()">${t('common.cancel')}</button>
      </div>
    `;
  }
  return `<div class="bulk-import-panel">${body}</div>`;
}


/* ---------------- feature registry ---------------- */
/* Zentrale Übersicht schaltbarer Features (Settings-Hub, Obsidian-Community-Plugins-Stil).
   scope:'device' -> gespeichert in state.appSettings.featureToggles (per-Browser via app:settings,
   gleiches Speicherprinzip wie appSettings.theme/iconPack). scope:'event' -> gespeichert in
   evt.featureFlags, rein additive Sichtbarkeits-Flags, rühren NICHT an den bestehenden
   Datenmodellen (evt.categoryGroups/evt.gameModes bleiben unangetastet, ein deaktiviertes
   Feature blendet nur dessen UI aus). battle_royale/districts folgen erst mit dem Zonen-System
   (Paket 4) und sind hier bewusst noch nicht eingetragen. */
const FEATURE_REGISTRY = [
  {id: 'social_share_cards', scope: 'device', icon: '🎉', name: () => t('featureRegistry.socialShareName'), description: () => t('featureRegistry.socialShareDesc'), defaultEnabled: true, configScreen: null},
  {id: 'sound_hook', scope: 'device', icon: '🔊', name: () => t('featureRegistry.soundHookName'), description: () => t('featureRegistry.soundHookDesc'), defaultEnabled: true, configScreen: 'sound-settings'},
  {id: 'offline_map_cache', scope: 'device', icon: '🗺', name: () => t('featureRegistry.offlineCacheName'), description: () => t('featureRegistry.offlineCacheDesc'), defaultEnabled: false, configScreen: 'offline-settings'},
  {id: 'categories', scope: 'event', icon: '🎫', name: () => t('featureRegistry.categoriesName'), description: () => t('featureRegistry.categoriesDesc'), defaultEnabled: true, configScreen: 'category-settings'},
  {id: 'game_modes', scope: 'event', icon: '🏆', name: () => t('featureRegistry.gameModesName'), description: () => t('featureRegistry.gameModesDesc'), defaultEnabled: true, configScreen: 'game-modes-settings'}
];
function featureRegistryEntry(id){
  return FEATURE_REGISTRY.find(f => f.id === id);
}
function isFeatureEnabled(id, evt){
  const entry = featureRegistryEntry(id);
  if(!entry) return true;
  if(entry.scope === 'device'){
    const toggles = state.appSettings.featureToggles || {};
    return toggles[id] !== undefined ? toggles[id] : entry.defaultEnabled;
  }
  const flags = (evt || state.currentEvent) ? (evt || state.currentEvent).featureFlags || {} : {};
  return flags[id] !== undefined ? flags[id] : entry.defaultEnabled;
}
function toggleFeature(id){
  const entry = featureRegistryEntry(id);
  if(!entry) return;
  const next = !isFeatureEnabled(id);
  if(entry.scope === 'device'){
    if(!state.appSettings.featureToggles) state.appSettings.featureToggles = {};
    state.appSettings.featureToggles[id] = next;
    saveAppSettings();
  } else {
    if(!state.currentEvent) return;
    state.currentEvent.featureFlags = state.currentEvent.featureFlags || {};
    state.currentEvent.featureFlags[id] = next;
    debouncedSave();
  }
  render();
}
function jumpToFeatureConfig(screen){
  if(!screen) return;
  const targets = {
    'sound-settings': {open: () => openOverview(), anchor: 'overview-beamer-section'},
    'offline-settings': {open: () => { openSettings(); selectSettingsSection('dataSafety'); }, anchor: 'offline-readiness-section'},
    'category-settings': {open: () => { openRiders(); selectRidersSection('categories'); }, anchor: null},
    'game-modes-settings': {open: () => { openOverview(); state.gameModesSectionOpen = true; }, anchor: 'overview-gamemodes-section'}
  };
  const target = targets[screen];
  if(!target) return;
  target.open();
  render();
  setTimeout(() => {
    const el = document.getElementById(target.anchor);
    if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  }, 30);
}
function featureRegistryGroups(evt){
  const q = (state.featureRegistrySearch || '').trim().toLowerCase();
  const matches = (entry) => !q || entry.name().toLowerCase().includes(q) || entry.description().toLowerCase().includes(q);
  return {
    device: FEATURE_REGISTRY.filter(f => f.scope === 'device' && matches(f)),
    event: FEATURE_REGISTRY.filter(f => f.scope === 'event' && matches(f))
  };
}
function onFeatureRegistrySearchInput(value){
  state.featureRegistrySearch = value;
  renderSettings();
}
function renderFeatureRegistryRow(entry, evt){
  const enabled = isFeatureEnabled(entry.id, evt);
  return `
    <div class="feature-row">
      <span class="feature-row-icon">${entry.icon}</span>
      <div class="feature-row-info">
        <div class="feature-row-name">${escapeHtml(entry.name())}</div>
        <div class="feature-row-desc">${escapeHtml(entry.description())}</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleFeature('${entry.id}')">
        <span class="toggle-switch-track"></span>
      </label>
      ${entry.configScreen ? `<button type="button" class="btn btn-sm feature-row-gear" title="${t('featureRegistry.configureTitle')}" onclick="jumpToFeatureConfig('${entry.configScreen}')">⚙</button>` : ''}
    </div>
  `;
}
function renderFeatureRegistrySection(){
  const evt = state.currentEvent;
  const groups = featureRegistryGroups(evt);
  const deviceRows = groups.device.map(f => renderFeatureRegistryRow(f, evt)).join('');
  const eventRows = evt ? groups.event.map(f => renderFeatureRegistryRow(f, evt)).join('') : '';
  const nothingFound = !groups.device.length && !groups.event.length;
  return `
    <div class="settings-section feature-registry-section">
      <h3>${t('featureRegistry.heading')}</h3>
      <div class="settings-section-desc">${t('featureRegistry.desc')}</div>
      <input type="text" class="feature-registry-search" placeholder="${t('featureRegistry.searchPlaceholder')}" value="${escapeHtml(state.featureRegistrySearch || '')}" oninput="onFeatureRegistrySearchInput(this.value)">
      ${nothingFound ? `<div class="riders-hint">${t('featureRegistry.noMatches')}</div>` : ''}
      ${groups.device.length ? `
        <div class="feature-group-heading">${t('featureRegistry.groupDevice')}</div>
        <div class="feature-row-list">${deviceRows}</div>
      ` : ''}
      ${evt && groups.event.length ? `
        <div class="feature-group-heading">${t('featureRegistry.groupEvent', {name: evt.name || t('common.unnamedEvent')})}</div>
        <div class="feature-row-list">${eventRows}</div>
