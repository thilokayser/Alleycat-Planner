}


/* ---------------- empty states ---------------- */
/* Wiederverwendbare Komponente statt Einzellösungen pro Screen (16.3). Generalisiert das
   bestehende .empty-state (bisher nur Dashboard/Fahrerliste) um einen optionalen Icon-Slot
   und eine zweite Aktion — ersetzt keine der schlankeren Inline-Hinweis-Klassen
   (.cp-list-empty/.leaderboard-empty/.overview-widget-empty etc.), die bewusst knapper
   bleiben, wo kein eigener Screen dahintersteht (z. B. eine leere Tabellenzeile). */
function emptyStateHtml({icon, title, description, primaryAction, secondaryAction, compact}){
  const actions = (primaryAction || secondaryAction) ? `
    <div class="empty-state-actions">
      ${primaryAction ? `<button type="button" class="btn btn-primary" onclick="${primaryAction.onclick}">${escapeHtml(primaryAction.label)}</button>` : ''}
      ${secondaryAction ? `<button type="button" class="btn btn-ghost" onclick="${secondaryAction.onclick}">${escapeHtml(secondaryAction.label)}</button>` : ''}
    </div>
  ` : '';
  return `
    <div class="empty-state${compact ? ' empty-state-compact' : ''}">
      ${icon ? `<div class="empty-state-icon">${icon}</div>` : ''}
      <div class="display">${escapeHtml(title)}</div>
      ${description ? `<p>${escapeHtml(description)}</p>` : ''}
      ${actions}
    </div>
  `;
}


/* ---------------- social share cards ----------------
   Canvas-Rendering, rein clientseitig, kein Server-Call (16.4). Trigger ist ausschließlich
   ein manueller Button (Dashboard bei Status "Abgeschlossen") — kein automatisches Auslösen.
   Nutzt die aktuell aktive Theme-Palette (CSS-Variablen) statt eines eigenen Karten-Designs,
   und das Logo des ersten aktivierten Sponsoren-PDF-Blocks (pdf-blocks.js), falls vorhanden. */
let socialShareCanvas = null;
function computeSocialShareTopRiders(evt){
  const finished = (evt.riders || []).filter(r => r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated');
  const sorted = evt.scoringMode === 'points' ? sortRidersByPoints(finished, evt) : sortRidersForOverview(finished);
  return sorted.slice(0, 3);
}
function socialShareThemeColors(){
  const cs = getComputedStyle(document.documentElement);
  const read = (name, fallback) => (cs.getPropertyValue(name) || '').trim() || fallback;
  return {
    bg: read('--asphalt', '#1c1c1c'),
    ink: read('--chalk', '#f4f1ea'),
    accent: read('--hivis', '#ff5f1f'),
    steel: read('--steel', '#8a8a8a')
  };
}
function firstSponsorLogoDataUrl(evt){
  const block = (evt.pdfBlocks || []).find(b => b.type === 'sponsors' && b.enabled && (b.config.logos || []).length);
  return block ? block.config.logos[0].dataUrl : null;
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(' ');
  let line = '', lines = [];
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; } else { line = test; }
  });
  if(line) lines.push(line);
  const startY = y - (lines.length - 1) * lineHeight / 2;
  lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineHeight));
}
async function renderSocialShareCanvas(evt){
  const W = 1080, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const c = socialShareThemeColors();
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = c.accent;
  ctx.fillRect(0, 0, W, 14);

  ctx.textAlign = 'center';
  ctx.fillStyle = c.ink;
  ctx.font = '700 54px Oswald, sans-serif';
  wrapCanvasText(ctx, evt.name || t('common.unnamedEvent'), W / 2, 150, W - 160, 60);

  ctx.font = '400 26px "JetBrains Mono", monospace';
  ctx.fillStyle = c.steel;
  ctx.fillText(formatDateOnly(evt.date) || '', W / 2, 210);

  ctx.font = '700 34px "JetBrains Mono", monospace';
  ctx.fillStyle = c.accent;
  ctx.fillText(t('socialShare.podiumHeading'), W / 2, 300);

  const top = computeSocialShareTopRiders(evt);
  const medals = ['🥇', '🥈', '🥉'];
  if(!top.length){
    ctx.font = '400 28px "JetBrains Mono", monospace';
    ctx.fillStyle = c.steel;
    ctx.fillText(t('socialShare.noFinishersYet'), W / 2, 420);
  } else {
    top.forEach((r, i) => {
      const rowY = 420 + i * 130;
      ctx.textAlign = 'left';
      ctx.font = '600 46px sans-serif';
      ctx.fillStyle = c.ink;
      ctx.fillText(`${medals[i]}  #${r.bib}  ${r.name || ''}`, 90, rowY);
      ctx.font = '400 26px "JetBrains Mono", monospace';
      ctx.fillStyle = c.steel;
      ctx.fillText(formatTimeOnly(r.finishTime) || '', 90, rowY + 40);
    });
  }

  const logoUrl = firstSponsorLogoDataUrl(evt);
  if(logoUrl){
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const maxW = 260, maxH = 130;
        const scale = Math.min(maxW / img.width, maxH / img.height, 1);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (W - w) / 2, H - h - 60, w, h);
        resolve();
      };
      img.onerror = resolve;
      img.src = logoUrl;
    });
  }
  return canvas;
}
async function openSocialShareCard(){
  const evt = state.currentEvent;
  if(!evt || !isFeatureEnabled('social_share_cards', evt)) return;
  socialShareCanvas = await renderSocialShareCanvas(evt);
  state.socialShareOpen = true;
  renderSocialShareCard();
}
function closeSocialShareCard(){
  state.socialShareOpen = false;
  socialShareCanvas = null;
  const root = document.getElementById('social-share-root');
  if(root) root.innerHTML = '';
}
function downloadSocialShareCard(){
  if(!socialShareCanvas) return;
  const evt = state.currentEvent;
  const a = document.createElement('a');
  a.download = `${(evt.name || 'alleycat').replace(/[^a-z0-9]+/gi, '-')}-ergebnis.png`;
  a.href = socialShareCanvas.toDataURL('image/png');
  a.click();
}
async function shareSocialShareCard(){
  if(!socialShareCanvas || !navigator.share) return;
  const evt = state.currentEvent;
  socialShareCanvas.toBlob(async (blob) => {
    if(!blob) return;
    const file = new File([blob], 'alleycat-ergebnis.png', {type: 'image/png'});
    try{
      if(navigator.canShare && !navigator.canShare({files: [file]})){ downloadSocialShareCard(); return; }
      await navigator.share({files: [file], title: evt.name || t('common.unnamedEvent')});
    }catch(e){ /* Nutzer hat Share-Sheet abgebrochen — kein Fehlerzustand */ }
  }, 'image/png');
}
function renderSocialShareCard(){
  const root = document.getElementById('social-share-root');
  if(!root) return;
  if(!state.socialShareOpen || !socialShareCanvas){ root.innerHTML = ''; return; }
  const canShareFiles = !!navigator.share;
  root.innerHTML = `
    <div class="socialshare-overlay">
      <div class="socialshare-box">
        <div class="socialshare-head">
          <span>${t('socialShare.previewTitle')}</span>
          <span class="socialshare-spacer"></span>
          ${canShareFiles ? `<button type="button" class="btn btn-sm btn-primary" onclick="shareSocialShareCard()">${t('socialShare.shareButton')}</button>` : ''}
          <button type="button" class="btn btn-sm ${canShareFiles ? '' : 'btn-primary'}" onclick="downloadSocialShareCard()">${t('socialShare.downloadButton')}</button>
          <button type="button" class="btn btn-sm btn-ghost" onclick="closeSocialShareCard()">${t('pdfPreview.close')}</button>
        </div>
        <img class="socialshare-image" src="${socialShareCanvas.toDataURL('image/png')}" alt="${t('socialShare.previewTitle')}">
      </div>
    </div>
  `;
}

  redrawZones();
  redrawEventLocations();

  startZoneShrinkTick();
}

/* ---------------- logistics: proximity buffer rings ----------------
   Faint ring around every geo-referenced checkpoint at the configured
   buffer radius; rings for checkpoints involved in a clustering warning
   are recolored so the problem pairs are visually obvious at a glance,
   not just listed as text in the sidebar. */
function redrawProximityBuffers(){
  if(proximityBufferLayer){ map.removeLayer(proximityBufferLayer); proximityBufferLayer = null; }
  if(!state.showProximityBuffers || !state.currentEvent || !map) return;
  const evt = state.currentEvent;
  const bufferMeters = currentProximityBufferMeters();
  const clustered = clusteredCheckpointIds(findProximityClusters(evt, bufferMeters));
  proximityBufferLayer = L.layerGroup().addTo(map);
  (evt.checkpoints || []).filter(cp => Number.isFinite(cp.lat) && Number.isFinite(cp.lng)).forEach(cp => {
    const flagged = clustered.has(cp.id);
    L.circle([cp.lat, cp.lng], {
      radius: bufferMeters,
      color: flagged ? '#e0435b' : '#8a8065',
      weight: 1,
      dashArray: '2 4',
      fillOpacity: flagged ? 0.1 : 0.04,
      interactive: false
    }).addTo(proximityBufferLayer);
  });
}

/* ---------------- logistics: route-estimate map overlay ----------------
   Draws the 2-opt-optimized path from logistics.js as a distinct dashed
   line — separate from the real order-based routeLine so the two are
   never visually confused, since one reflects actual planned checkpoint
   order and the other a pure distance-minimizing suggestion. */
function redrawRouteEstimate(){
  if(routeEstimateLine){ map.removeLayer(routeEstimateLine); routeEstimateLine = null; }
  const legendEl = document.getElementById('map-legend-route-estimate');
  if(!state.showRouteEstimateOnMap || !state.routeEstimate || !map){
    if(legendEl) legendEl.innerHTML = '';
    return;
  }
  const est = state.routeEstimate;
  const byId = new Map(est.points.map(p => [p.id, p]));
  const orderedPoints = est.optimizedOrderIds.map(id => byId.get(id)).filter(Boolean);
  if(orderedPoints.length >= 2){
    routeEstimateLine = L.polyline(orderedPoints.map(p => [p.lat, p.lng]), {
      color: '#3fa9f5', weight: 3, dashArray: '3 6', opacity: 0.85, lineJoin: 'round'
    }).addTo(map);
    routeEstimateLine.bringToBack();
  }
  if(legendEl) legendEl.innerHTML = `<span class="line map-legend-line-estimate"></span> ${t('logistics.legendLabel')}`;
}

/* ---------------- zone shrink: live ticking redraw ----------------
   Continuous circle-only radius shrink (zones.js's effectiveZoneRadius())
   is time-based, not event-based, so nothing calls redrawZones() as it
   progresses — a self-stopping interval is needed, same pattern as
   dashboard.js's startOverviewTick()/checkin.js's startLiveCountdown().
   Only runs at all when at least one zone actually has shrink enabled. */
function startZoneShrinkTick(){
  stopZoneShrinkTick();
  if(!state.currentEvent || !(state.currentEvent.zones || []).some(z => z.shrinkEnabled)) return;
  zoneShrinkTickInterval = setInterval(updateZoneShrinkTick, 5000);
}
function stopZoneShrinkTick(){
  if(zoneShrinkTickInterval){ clearInterval(zoneShrinkTickInterval); zoneShrinkTickInterval = null; }
}
function updateZoneShrinkTick(){
  if(state.view !== 'editor'){ stopZoneShrinkTick(); return; }
  redrawZones();
}

/* ---------------- zones: Leaflet.draw control + layer ----------------
   Kept separate from zones.js on purpose — zones.js is the pure data
   model/geometry module, this is the Leaflet-specific rendering and
   interaction layer, mirroring how checkpoint markers are handled here
   (redrawMarkers()) while checkpoint.js owns the data/sidebar side. */
function initZoneDrawControl(){
  if(typeof L.Control === 'undefined' || !L.Control.Draw) return; // CDN unavailable — degrade gracefully, sidebar list still works
  const drawControl = new L.Control.Draw({
    position: 'topright',
    draw: {
      circle: {shapeOptions: {color: '#ff5f1f', weight: 2}, showRadius: true, metric: true},
      polygon: {shapeOptions: {color: '#ff5f1f', weight: 2}, allowIntersection: false, showArea: false},
      marker: false, rectangle: false, polyline: false, circlemarker: false
    },
    edit: {featureGroup: zonesLayer, remove: true}
  });
  map.addControl(drawControl);
  map.on(L.Draw.Event.CREATED, onZoneDrawCreated);
  map.on(L.Draw.Event.EDITED, onZoneDrawEdited);
  map.on(L.Draw.Event.DELETED, onZoneDrawDeleted);
}
function onZoneDrawCreated(e){
  const evt = state.currentEvent;
  if(!evt) return;
  if(e.layerType === 'circle'){
    const c = e.layer.getLatLng();
    addZone(evt, {type: 'circle', name: t('zones.defaultName', {n: evt.zones.length + 1}), center: {lat: c.lat, lng: c.lng}, radiusMeters: Math.round(e.layer.getRadius())});
  } else if(e.layerType === 'polygon'){
    const points = e.layer.getLatLngs()[0].map(ll => ({lat: ll.lat, lng: ll.lng}));
    addZone(evt, {type: 'polygon', name: t('zones.defaultName', {n: evt.zones.length + 1}), points});
  } else {
    return;
  }
  debouncedSave();
  redrawZones();
  renderSidebar();
}
function onZoneDrawEdited(e){
  const evt = state.currentEvent;
  if(!evt) return;
  e.layers.eachLayer(layer => {
    const zone = getZone(evt, layer._zoneId);
    if(!zone) return;
    if(zone.type === 'circle'){
      const c = layer.getLatLng();
      updateZone(evt, zone.id, {center: {lat: c.lat, lng: c.lng}, radiusMeters: Math.round(layer.getRadius())});
    } else if(zone.type === 'polygon'){
      updateZone(evt, zone.id, {points: layer.getLatLngs()[0].map(ll => ({lat: ll.lat, lng: ll.lng}))});
    }
  });
  debouncedSave();
  renderSidebar();
}
function onZoneDrawDeleted(e){
  const evt = state.currentEvent;
  if(!evt) return;
  e.layers.eachLayer(layer => { if(layer._zoneId) removeZone(evt, layer._zoneId); });
  debouncedSave();
  renderSidebar();
}
function redrawZones(){
  if(!zonesLayer || !state.currentEvent) return;
  zonesLayer.clearLayers();
  const evt = state.currentEvent;
  (evt.zones || []).filter(z => z.visibleOnHqMap !== false).forEach(zone => {
    let layer = null;
    if(zone.type === 'circle' && zone.center){
      layer = L.circle([zone.center.lat, zone.center.lng], {radius: effectiveZoneRadius(zone, evt), color: zone.color, weight: 2, fillOpacity: 0.12});
    } else if(zone.type === 'polygon' && zone.points && zone.points.length >= 3){
      layer = L.polygon(zone.points.map(p => [p.lat, p.lng]), {color: zone.color, weight: 2, fillOpacity: 0.12});
    }
    if(!layer) return;
    layer._zoneId = zone.id;
    layer.bindTooltip(zone.name || t('zones.unnamed'), {direction: 'center', className: 'zone-tooltip'});
    layer.addTo(zonesLayer);
  });
  updateZoneLegend();
}
function updateZoneLegend(){
  const el = document.getElementById('map-legend-zones');
  if(!el || !state.currentEvent) return;
  const zones = (state.currentEvent.zones || []).filter(z => z.visibleOnHqMap !== false);
  el.innerHTML = zones.length ? zones.map(z => `<span class="legend-zone-swatch" style="background:${escapeHtml(z.color)}"></span>${escapeHtml(z.name || t('zones.unnamed'))}`).join(' &middot; ') : '';
}
function toggleZonesPanel(){
  state.zonesPanelOpen = !state.zonesPanelOpen;
  renderSidebar();

/* ---------------- map right-click context menu ----------------

/* ---------------- imported geo layers: map rendering + drag & drop ----------------
   Parsing/data model lives in geo-import.js, same split as zones/event-
   locations/orga-pins above. Tracks render as dashed polylines (visually
   distinct from the real, order-based routeLine and the logistics route-
   estimate line — three different dash patterns/colors so none get
   confused on a busy map), points as small circle markers whose popup
   offers the spec's "Als Checkpoint übernehmen" one-click conversion. */
function redrawImportedGeo(){
  if(!importedGeoLayer || !state.currentEvent) return;
  importedGeoLayer.clearLayers();
  const evt = state.currentEvent;
  allGeoImportLayers(evt).filter(l => l.visible !== false).forEach(layer => {
    layer.tracks.forEach(track => {
      L.polyline(track.map(p => [p.lat, p.lng]), {color: layer.color, weight: 3, opacity: 0.75, dashArray: '1 6'}).addTo(importedGeoLayer);
    });
    layer.points.forEach((pt, idx) => {
      const marker = L.circleMarker([pt.lat, pt.lng], {radius: 6, color: layer.color, weight: 2, fillColor: layer.color, fillOpacity: 0.7});
      const label = pt.name ? `<b>${escapeHtml(pt.name)}</b><br>` : '';
      marker.bindPopup(`${label}<button type="button" class="geo-import-popup-btn" onclick="convertGeoImportPointToCheckpoint('${layer.id}', ${idx})">${t('geoImport.convertToCheckpoint')}</button>`);
      marker.addTo(importedGeoLayer);
    });
  });
}
function convertGeoImportPointToCheckpoint(layerId, idx){
  const evt = state.currentEvent;
  const layer = findGeoImportLayer(evt, layerId);
  const pt = layer && layer.points[idx];
  if(!pt) return;
  const cp = addCheckpointAt(pt.lat, pt.lng);
  if(cp && pt.name){ cp.name = pt.name; debouncedSave(); renderSidebar(); }
  if(map) map.closePopup();
}
/* Bound to .map-wrap (not #map itself) so the drop target still covers the
   legend/search/context-menu overlay area — self-guarding via a dataset
   flag since initMap() can re-run invalidateSize() paths without wanting a
   second set of listeners. dragCounter handles the classic "dragleave
   fires when entering a child element" flicker (same problem the browser's
   own drag-and-drop docs call out), so the highlight only clears once the
   pointer has actually left .map-wrap entirely. */
function initGeoImportDragDrop(){
  const mapWrap = document.querySelector('.map-wrap');
  if(!mapWrap || mapWrap.dataset.geoDropBound) return;
  mapWrap.dataset.geoDropBound = '1';
  mapWrap.setAttribute('data-drop-hint', t('geoImport.dropHint'));
  let dragCounter = 0;
  mapWrap.addEventListener('dragenter', (e) => {
    if(!state.currentEvent) return;
    e.preventDefault();
    dragCounter++;
    mapWrap.classList.add('map-drag-over');
  });
  mapWrap.addEventListener('dragover', (e) => { if(state.currentEvent) e.preventDefault(); });
  mapWrap.addEventListener('dragleave', () => {
    dragCounter = Math.max(0, dragCounter - 1);
    if(dragCounter === 0) mapWrap.classList.remove('map-drag-over');
  });
  mapWrap.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragCounter = 0;
    mapWrap.classList.remove('map-drag-over');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) await handleGeoImportFileDrop(file);
  });
}
/* Split out from the 'drop' listener above so it's directly callable (and
   testable) with a plain File object, without needing to simulate a real
   DragEvent/DataTransfer — same reasoning as addCheckpointAt() being
   pulled out of onMapClick(). Returns the created layer, or null if there
   was no current event or the file couldn't be parsed. */
async function handleGeoImportFileDrop(file){
  if(!state.currentEvent) return null;
  const text = await file.text();
  const parsed = parseGeoImportFile(file.name, text);
  if(!parsed){ alert(t('geoImport.parseError')); return null; }
  const layer = withGeoImportLayerDefaults({
    name: file.name.replace(/\.[^.]+$/, ''),
    filename: file.name,
    format: parsed.format,
    color: GEO_IMPORT_COLORS[allGeoImportLayers(state.currentEvent).length % GEO_IMPORT_COLORS.length],
    tracks: parsed.tracks,
    points: parsed.points
  });
  state.geoImportLayers = state.geoImportLayers || [];
  state.geoImportLayers.push(layer);
  state.geoImportPanelOpen = true;
  redrawImportedGeo();
  renderSidebar();
  return layer;
}

/* ---------------- mobile: collapsible map panel ----------------
   Below SIDEBAR_BREAKPOINT the editor already stacks map-above-list (see
   the @media rule in base.css); on a phone that leaves very little room
   for the checkpoint/Sonderorte/Zonen lists below a large map. This lets
   the organizer collapse the map down to a thin toggle bar so the list
   gets the space instead — persisted per device, independent of the
   desktop sidebar-collapse feature above. Deliberately ignored while the
   map itself is the input surface (drawing a zone, placing a checkpoint
   or a freestanding HQ/Afterparty marker) — collapsing it there would
   hide the exact thing the organizer is trying to interact with. */
const MAP_COLLAPSE_BREAKPOINT = 768;
function isMapForceExpanded(){
  return !!(state.zonesPanelOpen || state.addMode || state.locationPlacementMode);
}
function isMobileMapCollapsed(){
  if(window.innerWidth > SIDEBAR_BREAKPOINT || isMapForceExpanded()) return false;
  try{
    const stored = localStorage.getItem('alleycat:mapCollapsed');
    if(stored === '1') return true;
    if(stored === '0') return false;
  }catch(e){}
  return window.innerWidth < MAP_COLLAPSE_BREAKPOINT;
}
function applyMobileMapCollapsed(){
  const viewEditor = document.getElementById('view-editor');
  const toggle = document.getElementById('mobile-map-toggle');
  if(!viewEditor || !toggle) return;
  const active = window.innerWidth <= SIDEBAR_BREAKPOINT;
  toggle.style.display = active ? 'flex' : 'none';
  if(!active){
    viewEditor.classList.remove('mobile-map-collapsed');
    if(map && state.view === 'editor') map.invalidateSize();
    return;
  }
  const collapsed = isMobileMapCollapsed();
  viewEditor.classList.toggle('mobile-map-collapsed', collapsed);
  toggle.disabled = isMapForceExpanded();
  toggle.textContent = collapsed ? t('map.showMap') : t('map.hideMap');
  /* Synchron statt setTimeout — dieselbe Begründung wie bei
     applyEditorSidebarCollapsed() weiter unten: eine verzögerte
     invalidateSize() nach einem Zwischen-View-Wechsel würde eine
     0x0-Größe cachen. */
  if(!collapsed && map && state.view === 'editor') map.invalidateSize();
}
function toggleMobileMapCollapsed(){
  if(isMapForceExpanded()) return;
  const next = !isMobileMapCollapsed();
  try{ localStorage.setItem('alleycat:mapCollapsed', next ? '1' : '0'); }catch(e){}
  applyMobileMapCollapsed();
}

/* ---------------- sidebar resize ---------------- */
const SIDEBAR_MIN = 280, SIDEBAR_MAX = 640, SIDEBAR_BREAKPOINT = 820;
function applySidebarWidth(){
  const sidebar = document.getElementById('sidebar');
  if(!sidebar) return;
  if(window.innerWidth <= SIDEBAR_BREAKPOINT){ sidebar.style.width = ''; return; }
  let saved = 340;
  try{
    const v = parseInt(localStorage.getItem('alleycat:sidebarWidth'), 10);
    if(!isNaN(v)) saved = v;
  }catch(e){}
  sidebar.style.width = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, saved)) + 'px';
}
function setSidebarWidth(px){
  const sidebar = document.getElementById('sidebar');
  if(!sidebar) return;
  const clamped = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, px));
  sidebar.style.width = clamped + 'px';
  try{ localStorage.setItem('alleycat:sidebarWidth', String(clamped)); }catch(e){}
  if(map) map.invalidateSize();
}
function isEditorSidebarCollapsed(){
  try{ return localStorage.getItem('alleycat:sidebarCollapsed') === '1'; }catch(e){ return false; }
}
function applyEditorSidebarCollapsed(){
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize-handle');
  const toggle = document.getElementById('sidebar-collapse-toggle');
  if(!sidebar || !toggle) return;
  const collapsed = window.innerWidth > SIDEBAR_BREAKPOINT && isEditorSidebarCollapsed();
  sidebar.style.display = collapsed ? 'none' : '';
  if(handle) handle.style.display = collapsed ? 'none' : '';
  toggle.textContent = collapsed ? '‹' : '›';
  toggle.title = collapsed ? t('map.expandSidebar') : t('map.collapseSidebar');
  /* Synchron statt setTimeout: die Sichtbarkeits-/Breitenänderung oben ist zu
     diesem Zeitpunkt bereits im CSSOM angewendet, ein verzögerter Aufruf lief
     Gefahr, erst nach einem zwischenzeitlichen View-Wechsel zu feuern und dann
     eine 0x0-Größe in Leaflet zu cachen (bricht spätere flyTo()-Aufrufe mit
     "Invalid LatLng (NaN, NaN)"). Nur aufrufen, während die Karte sichtbar ist. */
  if(map && state.view === 'editor') map.invalidateSize();
}
function toggleEditorSidebarCollapsed(){
  const next = !isEditorSidebarCollapsed();
  try{ localStorage.setItem('alleycat:sidebarCollapsed', next ? '1' : '0'); }catch(e){}
  applyEditorSidebarCollapsed();
}
function initSidebarResize(){
  const handle = document.getElementById('sidebar-resize-handle');
  if(!handle || handle.dataset.bound) return;
  handle.dataset.bound = '1';
  let dragging = false;
  handle.addEventListener('pointerdown', (e) => {
    if(window.innerWidth <= SIDEBAR_BREAKPOINT) return;
    dragging = true;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  });
  handle.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const viewEditor = document.getElementById('view-editor');
    const rect = viewEditor.getBoundingClientRect();
    setSidebarWidth(rect.right - e.clientX);
  });
  function stopDrag(e){
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
  }
  handle.addEventListener('pointerup', stopDrag);
  handle.addEventListener('pointercancel', stopDrag);
  window.addEventListener('resize', () => {
    if(state.view === 'editor'){
      applySidebarWidth();
      applyEditorSidebarCollapsed();
      applyMobileMapCollapsed();
      if(map) map.invalidateSize();
    }
  });
}
function onMapClick(e){
  if(state.locationPlacementMode && state.currentEvent){
    const type = state.locationPlacementMode;
    state.locationPlacementMode = null;
    const loc = placeEventLocationAt(state.currentEvent, type, e.latlng.lat, e.latlng.lng);
    if(loc){ debouncedSave(); redrawEventLocations(); }
    renderSidebar();
    applyMobileMapCollapsed();
    return;
  }
  if(!state.addMode || !state.currentEvent || isCpLocked(state.currentEvent)) return;
  addCheckpointAt(e.latlng.lat, e.latlng.lng);
}
/* Shared by the add-mode map click above and the right-click context menu's
   "Checkpoint hier anlegen" action below — same checkpoint object shape
   either way, only the trigger differs. */
function addCheckpointAt(lat, lng){
  if(!state.currentEvent || isCpLocked(state.currentEvent)) return null;
  const order = state.currentEvent.checkpoints.length + 1;
  const cp = {
    id: uid('cp'),
    order,
    lat, lng,
    name: t('map.defaultCheckpointName', {order}),
    clue: '',
    mandatory: true,
    type: getCheckpointTypes()[0].key,
    customQuestion: '',
    punchCode: String(Math.floor(1000 + Math.random()*9000)),
    timeWindowEnabled: false,
    timeWindowStart: '',
    timeWindowEnd: ''
  };
  state.currentEvent.checkpoints.push(cp);
  debouncedSave();
  state.editingId = cp.id;
  renderSidebar();
  redrawMarkers();
  return cp;
}

function redrawMarkers(){
  if(!markersLayer || !state.currentEvent) return;
  markersLayer.clearLayers();
  cpMarkers = {};
  // Leaflet 1.9.x leaves permanent-tooltip DOM nodes behind when their marker
  // is removed via a LayerGroup — clean them up explicitly to avoid duplicates.
  document.querySelectorAll('.leaflet-tooltip.cp-time-tooltip').forEach(el => el.remove());
  state.currentEvent.checkpoints.forEach((cp, idx) => {
    const rot = idx % 2 === 0 ? -5 : 4;
    const staffed = (cp.staff || []).length > 0;
    const staffingTitle = staffed ? t('logistics.staffedHint') : t('logistics.unstaffedHint');
    const icon = L.divIcon({
      className:'',
      html: `<div class="cp-marker ${cp.mandatory ? '' : 'optional'}" style="transform:rotate(${rot}deg);">${cp.order}<span class="cp-marker-type">${typeIconHtml(cp.type)}</span><span class="cp-marker-staffing ${staffed ? '' : 'unstaffed'}" title="${escapeHtml(staffingTitle)}"></span></div>`,
      iconSize:[32,32], iconAnchor:[16,16]
    });
    const marker = L.marker([cp.lat, cp.lng], {icon, draggable:true});
    cpMarkers[cp.id] = marker;
    marker.on('click', () => selectCp(cp.id));
    marker.on('mouseover', () => setCpRowHoverSync(cp.id, true));
    marker.on('mouseout', () => setCpRowHoverSync(cp.id, false));
    marker.on('dragend', (ev) => {
      const pos = ev.target.getLatLng();
      cp.lat = pos.lat; cp.lng = pos.lng;
      syncHqLocationFromCheckpoint(state.currentEvent, cp);
      debouncedSave();
      renderSidebar();
      redrawEventLocations();
    });
    if(cp.timeWindowEnabled){
      marker.bindTooltip(`${formatTimeOnly(cp.timeWindowStart)}–${formatTimeOnly(cp.timeWindowEnd)}`, {
        permanent: true, direction: 'top', offset: [0, -18], className: 'cp-time-tooltip'
      });
    }
    /* Clue-Vorschau (Spec 18.6): only bound while the mode is active — in
       normal mode markers have never had a popup (order number + type icon
       on the marker itself already identifies the checkpoint), so adding
       one unconditionally would be new, unrequested clutter. */
    if(state.cluePreviewMode){
      marker.bindPopup(cp.clue ? escapeHtml(cp.clue).replace(/\n/g, '<br>') : `<i>${t('cluePreview.noClue')}</i>`);
    }
    marker.addTo(markersLayer);
  });

  if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
  const ordered = [...state.currentEvent.checkpoints].sort((a,b) => a.order - b.order);
  if(ordered.length > 1){
    routeLine = L.polyline(ordered.map(c => [c.lat, c.lng]), {
      color: '#ff5f1f',
      weight: 3,
      dashArray: '7 7',
      opacity: 0.8,
      lineJoin: 'round'
    }).addTo(map);
    routeLine.bringToBack();
  }
}

/* ---------------- clue preview mode (Spec 18.6) ----------------
   Toggle-only, no persistence (localStorage or evt) — this is a one-off
   proofreading pass right before print, not a device/event preference
   worth remembering across sessions, same category as state.addMode. Swaps
   checkpoint names for their clue text in both the sidebar rows
   (checkpoint.js's renderCpListRows()) and new marker popups. */
function toggleCluePreviewMode(){
  state.cluePreviewMode = !state.cluePreviewMode;
  const btn = document.getElementById('clue-preview-toggle');
  if(btn) btn.classList.toggle('active', state.cluePreviewMode);
  redrawMarkers();
  renderSidebar();
}

/* ---------------- map search (Nominatim) ---------------- */
function toggleMapSearch(forceOpen){
  const open = typeof forceOpen === 'boolean' ? forceOpen : !state.mapSearchOpen;
  state.mapSearchOpen = open;
  const wrap = document.getElementById('map-search-wrap');
  if(wrap) wrap.classList.toggle('open', open);
  if(open){
    const input = document.getElementById('map-search-input');
    if(input) setTimeout(() => input.focus(), 20);
  } else {
    clearSearch();
  }
}
function onSearchInput(value){
  clearTimeout(searchDebounce);
  document.getElementById('map-search-clear').style.display = value ? 'inline-block' : 'none';
  const q = value.trim();
  if(q.length < 3){
    searchResultsData = [];
    renderSearchResults(false);
    return;
  }
  renderSearchResults(true);
  searchDebounce = setTimeout(() => performSearch(q), 450);
}
async function performSearch(query){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&q=' + encodeURIComponent(query);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    searchResultsData = Array.isArray(data) ? data : [];
  }catch(e){
    console.error('Ortssuche fehlgeschlagen', e);
    searchResultsData = [];
  }
  renderSearchResults(false);
}
function renderSearchResults(isLoading){
  const el = document.getElementById('map-search-results');
  if(!el) return;
  if(isLoading){
    el.style.display = 'block';
    el.innerHTML = `<div class="map-search-loading">${t('map.searching')}</div>`;
    return;
  }
  if(!searchResultsData.length){
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = searchResultsData.map((r, i) => `
    <div class="map-search-result" onclick="selectSearchResult(${i})">${escapeHtml(r.display_name)}</div>
  `).join('');
}
function selectSearchResult(i){
  const r = searchResultsData[i];
  if(!r || !map) return;
  map.flyTo([parseFloat(r.lat), parseFloat(r.lon)], 16, {duration:0.8});
  searchResultsData = [];
  renderSearchResults(false);
  const input = document.getElementById('map-search-input');
  if(input) input.value = r.display_name;
}
function clearSearch(){
  const input = document.getElementById('map-search-input');
  if(input) input.value = '';
  document.getElementById('map-search-clear').style.display = 'none';
  searchResultsData = [];
  renderSearchResults(false);
}

function withRiderDefaults(rider){

    name: '',

    raceStatus: '',
    categories: {},

  }, rider);
}

function onExpectedRidersInput(value){
  state.currentEvent.expectedRiders = Math.max(0, parseInt(value, 10) || 0);
  debouncedSave();
}
function generateRiderSlots(){
  const evt = state.currentEvent;
  const n = evt.expectedRiders || 0;
  const existing = evt.riders || [];
  const willLose = existing.filter(r => r.bib > n && (r.finishTime || (r.completed && r.completed.length)));
  if(willLose.length && !confirm(t('rider.reduceConfirm', {
    count: willLose.length,
    noun: willLose.length === 1 ? t('rider.checkinSingular') : t('rider.checkinPlural'),
    bibs: willLose.map(r=>r.bib).join(', ')
  }))) return;
  const next = [];
  for(let i = 1; i <= n; i++){
    /* Bestehende Slots werden wiederverwendet, nicht ersetzt — sonst würde ein
       Regenerieren die riderToken wechseln und jede bereits gedruckte
       Spokecard entwerten. */
    next.push(existing.find(r => r.bib === i) || {
      bib: i, name: '', emergencyContact: '', finishTime: '', completed: [], scores: {}, checkpointTimes: {},
      riderToken: generateRiderToken(), riderCode: generateRiderCode(), riderStatus: '', pendingData: null, gpsFlags: {}
    });
  }
  evt.riders = next;
  ensureRiderTokens(evt);
  debouncedSave();
  renderRiders();
}
/* Rüstet Slots aus Events nach, die vor der Rider-App angelegt wurden. Statt
   eines eigenen Migrationsschritts: läuft beim Publish und beim Slot-Erzeugen,
   ergänzt nur Fehlendes und fasst vorhandene Token nie an. Gibt true zurück,
   wenn etwas ergänzt wurde — der Aufrufer weiß dann, dass er speichern muss. */
function ensureRiderTokens(evt){
  let changed = false;
  (evt.riders || []).forEach(r => {
    if(!r.riderToken){ r.riderToken = generateRiderToken(); changed = true; }
    if(!r.riderCode){ r.riderCode = generateRiderCode(); changed = true; }
  });
  return changed;
}
function onRiderNameInput(bib, value){
  const r = (state.currentEvent.riders || []).find(r => r.bib === bib);
  if(!r) return;
  r.name = value;
  debouncedSave();
}
function onRiderEmergencyInput(bib, value){
  const r = (state.currentEvent.riders || []).find(r => r.bib === bib);
  if(!r) return;
  r.emergencyContact = value;

}
/* ---------------- riders: sidebar navigation (Paket 11) ----------------
   Same "full Settings pattern" as the Settings-Hub redesign — a sidebar
   replaces the old row of collapsible-panel toggle buttons, right pane
   shows only the active screen. Unlike Settings, this page has one clearly
   dominant section (the roster itself), so — deliberately different from

   'roster' rather than persisting the choice; jumpToFeatureConfig's
   category deep-link overrides that default explicitly via

function ridersNavGroups(evt){

      {id: 'bulkImport', icon: '📋', label: () => t('rider.navBulkImport')}
    ]},
    {id: 'config', label: () => t('rider.navGroupConfig'), items: [

function ridersNavItem(evt, id){

function deleteRider(bib){
  const evt = state.currentEvent;
  const idx = (evt.riders || []).findIndex(r => r.bib === bib);
  if(idx === -1) return;
  if(!confirm(t('rider.deleteConfirm', {bib}))) return;
  const removed = evt.riders[idx];
  evt.riders.splice(idx, 1);
  renderRiders();
  logUndoableAction(evt, t('actionLog.riderDeleted', {bib, name: removed.name || ''}), () => {
    evt.riders.splice(idx, 0, removed);
    renderRiders();
  });
}


function renderQrDataUrl(text, sizePx){
  return new Promise((resolve) => {
    const holder = document.createElement('div');
    holder.style.position = 'fixed';
    holder.style.left = '-9999px';
    holder.style.top = '0';
    document.body.appendChild(holder);
    new QRCode(holder, {text, width: sizePx, height: sizePx, colorDark: '#241f18', colorLight: '#ffffff'});
    setTimeout(() => {
      const canvas = holder.querySelector('canvas');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
      document.body.removeChild(holder);
      resolve(dataUrl);
    }, 20);
  });
}

/* ---------------- riders: roster search + sort/group (Paket 11) ----------------
   Applies to what's rendered AND what gets printed (#print-root wraps
   whatever renderRiderRosterGrid() returns) — deliberate: "print what's on
   screen" matches how a filtered/sorted table print is expected to behave
   elsewhere, and grouped-by-team headings printing too is a feature (easier
   physical sorting), not a bug. Grouping by category is intentionally not
   offered — an event can have multiple independent category groups (Antrieb,
   Gender, ...), so "group by category" has no single unambiguous axis. */
function filteredRosterRiders(evt){
  const q = (state.riderRosterSearch || '').trim().toLowerCase();
  const riders = evt.riders || [];
  if(!q) return riders.slice();
  return riders.filter(r => (r.name || '').toLowerCase().includes(q) || String(r.bib).includes(q));
}
let riderRosterSearchRenderTimeout;
function onRiderRosterSearchInput(value){
  state.riderRosterSearch = value;
  clearTimeout(riderRosterSearchRenderTimeout);
  riderRosterSearchRenderTimeout = setTimeout(() => {
    const active = document.activeElement;
    const cursor = active && active.classList.contains('riders-search-input') ? active.selectionStart : null;
    renderRiders();
    restoreInputFocus('.riders-search-input', cursor);
  }, 150);
}
function onRiderSortByChange(value){
  state.riderSortBy = value;
  renderRiders();
}
function renderRiderRosterGrid(evt){
  const filtered = filteredRosterRiders(evt);
  if(!filtered.length){
    return `<div class="riders-hint">${t('rider.searchNoResults', {query: state.riderRosterSearch})}</div>`;
  }
  if(state.riderSortBy === 'team'){
    const teams = evt.teams || [];
    const blocks = teams.map(tm => ({tm, members: filtered.filter(r => r.teamId === tm.id)})).filter(g => g.members.length).map(g => `
      <div class="rider-group-heading">${escapeHtml(g.tm.name)} <span class="rider-group-count">${g.members.length}</span></div>
      <div class="rider-grid">${renderRiderCardsHtml(evt, g.members)}</div>
    `);
    const withoutTeam = filtered.filter(r => !r.teamId || !teams.some(tm => tm.id === r.teamId));
    if(withoutTeam.length) blocks.push(`
      <div class="rider-group-heading">${t('rider.noTeam')} <span class="rider-group-count">${withoutTeam.length}</span></div>
      <div class="rider-grid">${renderRiderCardsHtml(evt, withoutTeam)}</div>
    `);
    return blocks.join('');
  }
  const sorted = filtered.slice().sort((a, b) => state.riderSortBy === 'name'
    ? (a.name || '').localeCompare(b.name || '', 'de')
    : a.bib - b.bib);
  return `<div class="rider-grid">${renderRiderCardsHtml(evt, sorted)}</div>`;
}

let audioCtx = null;
function playConfirmFeedback(){
  if(navigator.vibrate){ try{ navigator.vibrate(120); }catch(e){} }
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }catch(e){ /* Web Audio nicht verfügbar */ }
}
function confirmRiderAtFinish(){
  const rider = getActiveCheckinRider(); if(!rider) return;

/* ---------------- live countdown ---------------- */
function updateLiveCountdown(){
  if(state.view !== 'checkin'){ stopLiveCountdown(); return; }
  const el = document.getElementById('live-countdown');
  if(!el || !state.currentEvent) return;
  const evt = state.currentEvent;
  const now = new Date();
  let text = '', cls = '';

  if(evt.startMode === 'scheduled' && evt.startTime){
    const start = new Date(evt.startTime);
    if(!isNaN(start.getTime()) && now < start){
      text = t('checkin.startIn', {countdown: formatCountdown(start - now)});
      cls = 'start';
    }
  }
  if(!text && evt.curfewTime){
    const curfew = new Date(evt.curfewTime);
    if(!isNaN(curfew.getTime())){
      if(now < curfew){
        text = t('checkin.curfewIn', {countdown: formatCountdown(curfew - now)});
        cls = 'curfew';
      } else if(evt.curfewMode === 'soft'){
        text = t('checkin.overCurfew', {countdown: formatCountdown(now - curfew)});
        cls = 'over';
      } else {
        text = t('checkin.curfewReached');
        cls = 'over';
      }
    }
  }
  el.textContent = text;
  el.className = 'live-countdown' + (cls ? ' ' + cls : '');
}
function startLiveCountdown(){
  stopLiveCountdown();
  updateLiveCountdown();
  liveCountdownInterval = setInterval(updateLiveCountdown, 1000);
}
function stopLiveCountdown(){
  if(liveCountdownInterval){ clearInterval(liveCountdownInterval); liveCountdownInterval = null; }
}

/* ---------------- QR camera scan ---------------- */
async function startQrScan(){
  state.qrScanError = '';
  state.qrScannerActive = true;
  renderCheckin();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.qrScanError = t('checkin.cameraUnsupported');
    renderCheckin();
    return;
  }
  if(typeof jsQR !== 'function'){
    state.qrScanError = t('checkin.qrLibFailed');
    renderCheckin();
    return;
  }
  try{
    qrScanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
  }catch(e){
    state.qrScanError = t('checkin.cameraAccessDenied');
    renderCheckin();
    return;
  }
  const video = document.getElementById('qr-scan-video');
  if(!video){ stopQrScan(); return; }
  video.srcObject = qrScanStream;
  try{ await video.play(); }catch(e){}

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  function tick(){
    if(!qrScanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        onQrScanSuccess(code.data);
        return;
      }
    }
    qrScanRAF = requestAnimationFrame(tick);
  }
  qrScanRAF = requestAnimationFrame(tick);
}
function stopQrScan(){
  if(qrScanRAF){ cancelAnimationFrame(qrScanRAF); qrScanRAF = null; }
  if(qrScanStream){
    qrScanStream.getTracks().forEach(t => t.stop());
    qrScanStream = null;
  }
  state.qrScannerActive = false;
  state.qrScanError = '';
  renderCheckin();
}
function onQrScanSuccess(data){
  stopQrScan();
  state.checkinBibInput = String(data).trim();
  findCheckinRider();
}

function checkOrderBeforeComplete(cpId){
  const evt = state.currentEvent;
  const rider = getActiveCheckinRider();
  if(!evt || !rider || evt.checkpointOrderMode !== 'fest') return true;
  const cp = findCp(cpId);
  if(!cp) return true;
  const completed = rider.completed || [];
  const earlierIncomplete = evt.checkpoints.filter(c => c.order < cp.order && !completed.includes(c.id));
  if(!earlierIncomplete.length) return true;
  const names = earlierIncomplete.map(c => c.name || (t('leaderboard.cpPrefix') + String(c.order).padStart(2, '0'))).join(', ');
  if(!confirm(t('checkpointOrder.outOfOrderConfirm', {names}))) return false;
  rider.checkpointOrderOverrides = rider.checkpointOrderOverrides || [];
  rider.checkpointOrderOverrides.push({checkpointId: cpId, at: toLocalDateTimeInputValue(new Date())});
  return true;
}
/* Paket 6: Paket-Zustellung ohne bestätigte Abholung — gleiches
   Confirm-und-Override-Muster wie checkOrderBeforeComplete() (aus fest 3d),
   bewusst kein hartes Blockieren, da ein Marshal am Zustell-Checkpoint die
   Abholung z. B. wegen eines Geräteproblems am Abholung-Checkpoint auch
   nachträglich bestätigen könnte. */
function checkPickupBeforeDropoff(cpId){
  const evt = state.currentEvent;
  const rider = getActiveCheckinRider();
  if(!evt || !rider) return true;
  const cp = findCp(cpId);
  if(!cp || cp.type !== 'dropoff') return true;
  const pickup = pickupForDropoff(evt, cpId);
  if(!pickup) return true;
  if((rider.completed || []).includes(pickup.id)) return true;
  if(!confirm(t('checkin.dropoffWithoutPickupConfirm', {name: pickup.name || t('checkpoint.noName')}))) return false;
  rider.checkpointOrderOverrides = rider.checkpointOrderOverrides || [];
  rider.checkpointOrderOverrides.push({checkpointId: cpId, at: toLocalDateTimeInputValue(new Date())});
  return true;
}
function onCheckinToggleCheckpoint(cpId, checked){
  const rider = getActiveCheckinRider(); if(!rider) return;
  const evt = state.currentEvent;
  rider.completed = rider.completed || [];
  if(checked){
    if(!rider.completed.includes(cpId)){
      if(!checkOrderBeforeComplete(cpId)){ renderCheckin(); return; }
      if(!checkPickupBeforeDropoff(cpId)){ renderCheckin(); return; }
      const cp = findCp(cpId);
      const timestamp = toLocalDateTimeInputValue(new Date());
      const ruleResult = evaluateRules(evt, 'on_checkin', {rider, checkpoint: cp, timestamp});
      if(ruleResult.blocked){ alert(ruleResult.message); renderCheckin(); return; }
      rider.completed.push(cpId);
      rider.checkpointTimes = rider.checkpointTimes || {};
      if(!rider.checkpointTimes[cpId]) rider.checkpointTimes[cpId] = timestamp;
    }
  } else {
    rider.completed = rider.completed.filter(id => id !== cpId);
    removeLedgerEntries(evt, p => p.riderBib === rider.bib && p.checkpointId === cpId && p.source === 'first_n');
  }
  debouncedSave();
  renderCheckin();
}
function onCheckinSetScore(cpId, score){
  const rider = getActiveCheckinRider(); if(!rider) return;
  const evt = state.currentEvent;
  rider.completed = rider.completed || [];
  rider.scores = rider.scores || {};
  if(rider.scores[cpId] === score){
    delete rider.scores[cpId];
    rider.completed = rider.completed.filter(id => id !== cpId);
    removeLedgerEntries(evt, p => p.riderBib === rider.bib && p.checkpointId === cpId && p.source === 'first_n');
  } else {
    if(!checkOrderBeforeComplete(cpId)){ renderCheckin(); return; }
    const cp = findCp(cpId);
    const timestamp = toLocalDateTimeInputValue(new Date());
    const ruleResult = evaluateRules(evt, 'on_checkin', {rider, checkpoint: cp, timestamp});
    if(ruleResult.blocked){ alert(ruleResult.message); renderCheckin(); return; }
    rider.scores[cpId] = score;
    if(!rider.completed.includes(cpId)) rider.completed.push(cpId);
    rider.checkpointTimes = rider.checkpointTimes || {};
    if(!rider.checkpointTimes[cpId]) rider.checkpointTimes[cpId] = timestamp;
  }
  debouncedSave();
  renderCheckin();
}
function onCheckinCheckpointTimeChange(cpId, value){
  const rider = getActiveCheckinRider(); if(!rider) return;
  rider.checkpointTimes = rider.checkpointTimes || {};
  rider.checkpointTimes[cpId] = value;
  debouncedSave();
  renderCheckin();
}
function computeCurfewResult(evt, finishTimeValue){
  if(!evt.curfewTime || !finishTimeValue) return null;
  const finish = new Date(finishTimeValue);
  const curfew = new Date(evt.curfewTime);
  if(isNaN(finish.getTime()) || isNaN(curfew.getTime())) return null;
  const diffMin = Math.round((finish - curfew) / 60000);
  if(diffMin <= 0) return {onTime: true, diffMin: 0, penalty: 0};
  if(evt.curfewMode === 'soft') return {onTime: false, diffMin, penalty: Math.round(diffMin * (evt.curfewPenaltyPerMin ?? 1))};
  return {onTime: false, diffMin, penalty: null};
}
function riderStatusBadgeHtml(evt, rider){
  if(rider.raceStatus === 'eliminated') return `<span class="lb-status danger">${t('gameModes.eliminatedStatus')}</span>`;
  if(rider.raceStatus === 'dnf') return `<span class="lb-status danger">${t('checkin.statusDnf')}</span>`;
  if(rider.raceStatus === 'dns') return `<span class="lb-status missing">${t('checkin.statusDns')}</span>`;
  if(!rider.finishTime) return `<span class="lb-status missing">${t('checkin.statusMissing')}</span>`;
  const curfew = computeCurfewResult(evt, rider.finishTime);
  if(!curfew || curfew.onTime) return `<span class="lb-status arrived">${t('checkin.statusArrived')}</span>`;
  if(evt.curfewMode === 'soft') return `<span class="lb-status warn">${t('checkin.statusPenalty', {penalty: curfew.penalty})}</span>`;
  return `<span class="lb-status danger">${t('checkin.statusCutoff')}</span>`;
}

function computeTimeWindowResult(cp, timeValue){
  if(!cp.timeWindowEnabled || !timeValue) return null;
  const t = new Date(timeValue);
  if(isNaN(t.getTime())) return null;
  const start = cp.timeWindowStart ? new Date(cp.timeWindowStart) : null;
  const end = cp.timeWindowEnd ? new Date(cp.timeWindowEnd) : null;
  if(start && !isNaN(start.getTime()) && t < start) return {ok: false, reason: 'early'};
  if(end && !isNaN(end.getTime()) && t > end) return {ok: false, reason: 'late'};
  return {ok: true};
}


/* ---------------- render: check-in ---------------- */
function renderCheckin(){
  const el = document.getElementById('view-checkin');
  const evt = state.currentEvent;
  if(!evt){
    el.innerHTML = `<div class="loading-row">${t('checkin.noEventSelected')}</div>`;
    return;
  }
  const rider = getActiveCheckinRider();
  const riders = evt.riders || [];
  let body = '';

  if(!rider){
    body = `
      <div class="checkin-search-hint">${state.checkinNotFound ? t('checkin.riderNotFound', {bib: escapeHtml(state.checkinBibInput)}) : t('checkin.enterBibHint')}</div>
    `;
  } else {
    const completed = rider.completed || [];
    const scores = rider.scores || {};
    const cpTimes = rider.checkpointTimes || {};
    const visibleCps = evt.checkpoints.filter(cp => isCpRevealed(evt, cp));
    const jokerCpId = rider.gameFlags && rider.gameFlags.jokerCpId;
    const cpRows = visibleCps.map(cp => {
      const done = completed.includes(cp.id);
      const isJoker = !done && jokerCpId === cp.id;
      const closedByZone = isGameModeEnabled(evt, 'zone_active') && isCpClosedByZone(evt, cp);
      const cpType = getCheckpointType(cp.type);
      const controlsHtml = isJoker
        ? `<div class="checkin-joker-satisfied">${t('gameModes.jokerSatisfiesCp')}</div>`
        : cpType.isScored
        ? `<div class="checkin-score-row">${Array.from({length: cpType.scoreMax + 1}, (_, s) => s).map(s => `<button type="button" class="score-btn ${scores[cp.id] === s ? 'active' : ''}" onclick="onCheckinSetScore('${cp.id}', ${s})">${s}</button>`).join('')}</div>`
        : `<label class="checkin-cp-check">
             <input type="checkbox" ${done ? 'checked' : ''} onchange="onCheckinToggleCheckpoint('${cp.id}', this.checked)">
             ${t('checkin.done')}
           </label>`;
      let timeWindowHtml = '';
      if(cp.timeWindowEnabled && done){
        const twResult = computeTimeWindowResult(cp, cpTimes[cp.id]);
        const badge = twResult
          ? (twResult.ok ? `<span class="tw-badge ok">${t('checkin.inTimeWindowBadge')}</span>` : `<span class="tw-badge warn">${twResult.reason === 'early' ? t('checkin.tooEarly') : t('checkin.tooLate')}</span>`)
          : '';
        timeWindowHtml = `
          <div class="checkin-timewindow">
            <label>${t('checkin.arrivalWindowLabel', {start: formatTimeOnly(cp.timeWindowStart), end: formatTimeOnly(cp.timeWindowEnd)})}</label>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <input type="datetime-local" value="${escapeHtml(cpTimes[cp.id] || '')}" onchange="onCheckinCheckpointTimeChange('${cp.id}', this.value)">
              ${badge}
            </div>
          </div>`;
      }
      let packageHtml = '';
      if(cp.type === 'dropoff'){
        const pickup = pickupForDropoff(evt, cp.id);
        if(pickup){
          const pickupDone = completed.includes(pickup.id);
          packageHtml = `<div class="checkin-timewindow"><span class="tw-badge ${pickupDone ? 'ok' : 'warn'}">${pickupDone ? t('checkin.pickupDoneBadge') : t('checkin.pickupPendingBadge')}</span></div>`;
        }
      } else if(cp.type === 'pickup' && cp.pairedDropoffCpId){
        const dropoff = findCp(cp.pairedDropoffCpId);
        if(dropoff) packageHtml = `<div class="checkin-timewindow">${t('checkin.pickupHint', {name: dropoff.name || t('checkpoint.noName')})}</div>`;
      }
      return `
        <div class="checkin-cp-row ${cp.mandatory ? '' : 'optional'}">
          <div class="checkin-cp-head">
            <span class="cp-no">${cp.order}</span>
            <span class="cp-name">${escapeHtml(cp.name || t('checkpoint.noName'))}</span>
            ${cp.mandatory ? '' : `<span class="tag-bonus">${t('exportPdf.bonusBadge')}</span>`}
            ${closedByZone ? `<span class="tag-bonus danger">${t('gameModes.zoneClosedBadge')}</span>` : ''}
          </div>
          ${controlsHtml}
          ${timeWindowHtml}
          ${packageHtml}
        </div>`;
    }).join('');
    const mandatoryCps = visibleCps.filter(c => c.mandatory);
    const missingMandatory = mandatoryCps.filter(cp => !isCpSatisfiedForRider(rider, cp));
    const curfew = computeCurfewResult(evt, rider.finishTime);
    let curfewBlock = '';
    if(curfew){
      if(curfew.onTime){
        curfewBlock = `<div class="checkin-status ok">${t('checkin.onTimeStatus')}</div>`;
      } else if(evt.curfewMode === 'soft'){
        curfewBlock = `<div class="checkin-status warn">${t('checkin.softCurfewStatus', {diffMin: curfew.diffMin, penalty: curfew.penalty})}</div>`;
      } else {
        curfewBlock = `<div class="checkin-status danger">${t('checkin.hardCurfewStatus', {diffMin: curfew.diffMin})}</div>`;
      }
    }
    let mandatoryBlock = '';
    if(mandatoryCps.length){
      mandatoryBlock = missingMandatory.length
        ? `<div class="checkin-status warn">${t(missingMandatory.length === 1 ? 'checkin.missingMandatorySingular' : 'checkin.missingMandatoryPlural', {count: missingMandatory.length})}</div>`
        : `<div class="checkin-status ok">${t('checkin.allMandatoryDone')}</div>`;
    }
    body = `
      <div class="checkin-card">
        <div class="checkin-card-head">
          <div class="checkin-bib">#${rider.bib}</div>
          <div class="checkin-name-col">
            <input type="text" class="checkin-name-input" placeholder="${t('rider.namePlaceholder')}" value="${escapeHtml(rider.name || '')}" oninput="onCheckinNameChange(this.value)">
            ${teamBadgeHtml(evt, rider.teamId)}
            <input type="text" class="checkin-emergency-input" placeholder="${t('rider.emergencyPlaceholder')}" value="${escapeHtml(rider.emergencyContact || '')}" oninput="onCheckinEmergencyChange(this.value)">
          </div>
          <button class="btn btn-primary btn-sm" onclick="finishCheckin()" title="${t('checkin.saveAndCloseTitle')}">${t('checkin.saveAndClose')}</button>
        </div>
        ${isGameModeEnabled(evt, 'rider_flag') ? `
          <div class="checkin-joker-row">
            <label>${t('gameModes.assignJokerLabel')}</label>
            <select onchange="assignJokerCheckpoint(this.value)">
              <option value="">${t('gameModes.jokerNone')}</option>
              ${evt.checkpoints.map(cp => `<option value="${cp.id}" ${jokerCpId === cp.id ? 'selected' : ''}>${escapeHtml(cp.name || t('checkpoint.noName'))}</option>`).join('')}
            </select>
          </div>
        ` : ''}
        ${rider.raceStatus === 'eliminated' ? `
          <div class="checkin-status danger">
            <span>${t('gameModes.eliminatedStatus')}</span>
            <button class="btn btn-ghost btn-sm" onclick="setRiderRaceStatus('eliminated')">${t('common.cancel')}</button>
          </div>
        ` : rider.raceStatus === 'dnf' || rider.raceStatus === 'dns' ? `
          <div class="checkin-status danger">
            <span>${rider.raceStatus === 'dnf' ? t('checkin.dnfSet') : t('checkin.dnsSet')}</span>
            <button class="btn btn-ghost btn-sm" onclick="setRiderRaceStatus('${rider.raceStatus}')">${t('common.cancel')}</button>
          </div>
        ` : !rider.finishTime ? `
          <div class="checkin-confirm-row">
            <button class="btn btn-primary checkin-confirm-btn" onclick="confirmRiderAtFinish()">${t('checkin.confirmAtFinish')}</button>
            <div class="checkin-confirm-hint">${t('checkin.notYetConfirmedHint')}</div>
            <div class="checkin-dnf-dns-row">
              <button class="btn btn-ghost btn-sm" onclick="setRiderRaceStatus('dnf')">${t('checkin.markDnf')}</button>
              <button class="btn btn-ghost btn-sm" onclick="setRiderRaceStatus('dns')">${t('checkin.markDns')}</button>
            </div>
          </div>
        ` : `
          <div class="checkin-timing">
            <div>
              <label>${t('checkin.finishTimeLabel')}</label>
              <input type="datetime-local" value="${escapeHtml(rider.finishTime || '')}" onchange="onCheckinFinishTimeChange(this.value)">
            </div>
            ${curfewBlock}
            <button class="btn btn-ghost btn-sm" onclick="unconfirmRiderAtFinish()" title="${t('checkin.resetTitle')}">${t('checkin.reset')}</button>
          </div>
        `}
        ${evt.checkpoints.length === 0 ? `<div class="cp-list-empty">${t('checkin.noCheckpointsInEvent')}</div>` : `<div class="checkin-cp-list">${cpRows}</div>`}
        ${mandatoryBlock}
      </div>
    `;
  }

  const finishedCount = riders.filter(r => r.finishTime).length;
  const overviewRows = sortRidersForOverview(riders).map(r => `
    <div class="checkin-overview-row ${state.checkinActiveBib === r.bib ? 'active' : ''}" onclick="selectCheckinRiderByBib(${r.bib})">
      <span class="lb-bib">#${r.bib}</span>
      ${r.teamId ? `<span class="team-dot" title="${escapeHtml(getTeam(evt, r.teamId)?.name || '')}" style="background:${escapeHtml(getTeam(evt, r.teamId)?.color || '#7c8388')}"></span>` : ''}
      <span class="lb-name">${escapeHtml(r.name || '—')}</span>
      ${riderStatusBadgeHtml(evt, r)}
    </div>
  `).join('');

  el.innerHTML = `
    <div class="checkin-main">
      <div class="checkin-main-inner">
        <div id="live-countdown" class="live-countdown"></div>
        <div class="checkin-search">
          <label>${t('checkin.bibNumberLabel')}</label>
          <div class="checkin-search-row">
            <input type="text" id="checkin-bib-input" inputmode="numeric" placeholder="${t('checkin.bibPlaceholder')}" value="${escapeHtml(state.checkinBibInput)}" oninput="onCheckinBibInput(this.value)" onkeydown="if(event.key==='Enter') findCheckinRider()">
            <button class="btn btn-primary" onclick="findCheckinRider()">${t('checkin.search')}</button>
            <button class="btn" onclick="startQrScan()" title="${t('checkin.scanQrTitle')}">${t('checkin.scan')}</button>
          </div>
        </div>
        ${body}
      </div>
    </div>
    <div class="checkin-side">
      <div class="checkin-side-head">
        <span>${t('checkin.allRiders')}</span>
        <span class="checkin-side-count">${finishedCount} / ${riders.length}</span>
      </div>
      ${riders.length ? `<div class="checkin-overview-list">${overviewRows}</div>` : `<div class="checkin-side-empty">${t('checkin.noRiderListYet')}</div>`}
    </div>
    ${state.qrScannerActive ? `
      <div class="qr-scan-overlay">
        ${state.qrScanError ? `
          <div class="qr-scan-status error">${escapeHtml(state.qrScanError)}</div>
          <button class="btn btn-primary" onclick="startQrScan()">${t('checkin.retry')}</button>
        ` : `
          <div class="qr-scan-video-wrap">
            <video id="qr-scan-video" autoplay playsinline muted></video>
            <div class="qr-scan-frame"></div>
          </div>
          <div class="qr-scan-status">${t('checkin.holdQrToCamera')}</div>
        `}
        <button class="btn btn-ghost" onclick="stopQrScan()">${t('common.cancel')}</button>
      </div>
    ` : ''}
  `;
  updateLiveCountdown();
  if(state.qrScannerActive && qrScanStream){
    const video = document.getElementById('qr-scan-video');
    if(video) video.srcObject = qrScanStream;
  }
}



/* ---------------- leaderboard ---------------- */
function sortRidersForOverview(riders){
  return riders.slice().sort((a, b) => {
    if(!!a.finishTime !== !!b.finishTime) return a.finishTime ? -1 : 1;
    if(a.finishTime && b.finishTime) return new Date(a.finishTime) - new Date(b.finishTime);
    return a.bib - b.bib;
  });
}
function sortRidersByPoints(riders, evt){
  return riders.slice().sort((a, b) => {
    const pa = pointsForRider(evt, a.bib), pb = pointsForRider(evt, b.bib);
    if(pa !== pb) return pb - pa;
    if(!!a.finishTime !== !!b.finishTime) return a.finishTime ? -1 : 1;
    if(a.finishTime && b.finishTime) return new Date(a.finishTime) - new Date(b.finishTime);
    return a.bib - b.bib;
  });
}
function showPointsLedger(bib){
  const evt = state.currentEvent;
  const entries = ledgerEntriesForRider(evt, bib);
  if(!entries.length){ alert(t('gameModes.ledgerEmpty')); return; }
  const lines = entries.map(e => `${e.amount > 0 ? '+' : ''}${e.amount} — ${e.reason} (${formatDateTime(e.createdAt)})`);
  alert(t('gameModes.ledgerTitle', {bib}) + '\n\n' + lines.join('\n'));
}

}
function onLeaderboardStatusFilterChange(value){

  renderLeaderboard();

function onLeaderboardCategoryFilterChange(groupId, value){

  if(value) state.leaderboardCategoryFilters[groupId] = value;
  else delete state.leaderboardCategoryFilters[groupId];
  renderLeaderboard();

function removeLeaderboardFilter(kind, groupId){
  if(kind === 'team') state.leaderboardTeamFilter = '';
  else if(kind === 'status') state.leaderboardStatusFilter = '';
  else if(kind === 'category') delete state.leaderboardCategoryFilters[groupId];

}
function clearLeaderboardFilters(){
  state.leaderboardSearch = '';
  state.leaderboardTeamFilter = '';
  state.leaderboardStatusFilter = '';
  state.leaderboardCategoryFilters = {};
  renderLeaderboard();
}
function riderMatchesStatusFilter(r, filter){
  if(!filter) return true;
  if(filter === 'dnf') return r.raceStatus === 'dnf';
  if(filter === 'dns') return r.raceStatus === 'dns';
  if(filter === 'eliminated') return r.raceStatus === 'eliminated';
  if(filter === 'arrived') return !!r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated';
  if(filter === 'underway') return !r.finishTime && r.raceStatus !== 'dnf' && r.raceStatus !== 'dns' && r.raceStatus !== 'eliminated';
  return true;
}
function setLeaderboardTab(tab){
  state.leaderboardTab = tab;
  renderLeaderboard();
}
function renderLeaderboard(){
  const el = document.getElementById('view-leaderboard');
  const evt = state.currentEvent;
  if(!evt){
    el.innerHTML = `<div class="loading-row">${t('leaderboard.noEventSelected')}</div>`;
    return;
  }
  const allRiders = evt.riders || [];
  const teams = evt.teams || [];
  const groups = (evt.categoryGroups || []).slice().sort((a,b) => a.sortOrder - b.sortOrder);
  const catFilters = state.leaderboardCategoryFilters || {};
  const cps = evt.checkpoints.slice().sort((a,b) => a.order - b.order);
  const mandatoryCps = cps.filter(c => c.mandatory);

  const q = state.leaderboardSearch.trim().toLowerCase();
  const filteredRiders = allRiders.filter(r =>
    (!q || String(r.bib).includes(q) || (r.name || '').toLowerCase().includes(q)) &&
    (!state.leaderboardTeamFilter || r.teamId === state.leaderboardTeamFilter) &&
    riderMatchesStatusFilter(r, state.leaderboardStatusFilter) &&
    groups.every(g => !catFilters[g.id] || (r.categories && r.categories[g.id] === catFilters[g.id]))
  );
  const riders = evt.scoringMode === 'points' ? sortRidersByPoints(filteredRiders, evt) : sortRidersForOverview(filteredRiders);

  const activeFilters = [];
  if(state.leaderboardTeamFilter){
    const tm = teams.find(t => t.id === state.leaderboardTeamFilter);
    if(tm) activeFilters.push({label: tm.name, onclick: `removeLeaderboardFilter('team')`});
  }
  if(state.leaderboardStatusFilter){
    const statusLabels = {underway: t('leaderboard.statusUnderway'), arrived: t('checkin.statusArrived'), dnf: t('checkin.statusDnf'), dns: t('checkin.statusDns')};
    activeFilters.push({label: statusLabels[state.leaderboardStatusFilter] || state.leaderboardStatusFilter, onclick: `removeLeaderboardFilter('status')`});
  }
  groups.forEach(g => {
    if(catFilters[g.id]) activeFilters.push({label: `${g.name}: ${catFilters[g.id]}`, onclick: `removeLeaderboardFilter('category', '${g.id}')`});
  });
  const filterChipsHtml = activeFilters.length ? `
    <div class="leaderboard-filter-chips">
      ${activeFilters.map(f => `<span class="filter-chip">${escapeHtml(f.label)} <button type="button" onclick="${f.onclick}">&times;</button></span>`).join('')}
      <button type="button" class="filter-chip-reset" onclick="clearLeaderboardFilters()">${t('leaderboard.resetFilters')}</button>
    </div>
  ` : '';

  const arrivedCount = allRiders.filter(r => r.finishTime).length;
  const arrivalPct = allRiders.length ? Math.round((arrivedCount / allRiders.length) * 100) : 0;

  /* Check-ins, deren Startnummer oder Checkpoint es im Event nicht mehr
     gibt — etwa weil ein Checkpoint nach dem Kartendruck gelöscht wurde.
     Sie werden angezeigt statt verworfen: ein Fahrer, der nachweislich
     an einem Punkt war, darf nicht durch einen Konfigurationsfehler aus
     der Wertung fallen. */
  const orphanHtml = (evt.orphanCheckins || []).length ? `
    <div class="leaderboard-orphan-note">
      <strong>${t('riderApp.orphanHeading', {count: evt.orphanCheckins.length})}</strong>
      <div>${t('riderApp.orphanDesc')}</div>
      <ul>
        ${evt.orphanCheckins.slice(0, 10).map(o =>
          `<li>${t('riderApp.orphanRow', {bib: o.bib, cp: escapeHtml(o.cp_id || '—')})}</li>`
        ).join('')}
      </ul>
    </div>
  ` : '';

  const tabsHtml = `
    <div class="leaderboard-tabs">
      <button class="lb-tab-btn ${state.leaderboardTab === 'individual' ? 'active' : ''}" onclick="setLeaderboardTab('individual')">${t('leaderboard.individualTab')}</button>
      <button class="lb-tab-btn ${state.leaderboardTab === 'teams' ? 'active' : ''}" onclick="setLeaderboardTab('teams')">${t('leaderboard.teamsTab')}</button>
    </div>
  `;

  if(allRiders.length === 0){
    el.innerHTML = `
      <div class="leaderboard-page-head">
        <div class="leaderboard-page-stamp">🏆</div>
        <h2>${t('leaderboard.title')}</h2>
      </div>
      ${emptyStateHtml({
        icon: '🏆',
        title: t('leaderboard.noRidersYet'),
        description: t('leaderboard.setUpRidersFirst'),
        primaryAction: {label: t('ui.navRiders'), onclick: 'openRiders()'}
      })}
    `;
    return;
  }
  if((evt.status === 'planning' || evt.status === 'ready') && !allRiders.some(r => r.finishTime || r.raceStatus)){
    el.innerHTML = `
      <div class="leaderboard-page-head">
        <div class="leaderboard-page-stamp">🏆</div>
        <h2>${t('leaderboard.title')}</h2>
      </div>
      ${emptyStateHtml({
        icon: '⏳',
        title: t('leaderboard.raceNotStartedTitle'),
        description: t('leaderboard.raceNotStartedDesc')
      })}
    `;
    return;
  }

  if(state.leaderboardTab === 'teams'){
    const teamStats = computeTeamStats(evt);
    const relevantTime = ts => teamStats.scoringMode === 'allMustFinish' ? ts.worstTime : ts.bestTime;
    const teamRowsHtml = teamStats.teams.map(ts => `
      <tr>
        <td class="lb-rider">${teamBadgeHtml(evt, ts.team.id)}</td>
        <td>${ts.memberCount}</td>
        <td>${ts.arrived}</td>
        <td>${relevantTime(ts) ? formatDateTime(relevantTime(ts)) : '—'}</td>
        <td><span class="lb-progress-tag">${ts.doneMandatory}/${ts.memberCount * teamStats.mandatoryTotal} ${t('common.mandatory')}</span></td>
        ${teamStats.hasScoredCheckpoints ? `<td><span class="lb-progress-tag points${ts.totalScore === 0 ? ' zero' : ''}">${ts.totalScore} Pkt.</span></td>` : ''}
      </tr>
    `).join('');
    el.innerHTML = `
      <div class="leaderboard-page-head">
        <div class="leaderboard-page-stamp">🏆</div>
        <h2>${t('leaderboard.title')}</h2>
      </div>
      ${tabsHtml}
      ${orphanHtml}
      <div class="leaderboard-toolbar">
        <div class="leaderboard-stats"><span>${t(teamStats.teams.length === 1 ? 'leaderboard.teamCountSingular' : 'leaderboard.teamCountPlural', {count: teamStats.teams.length})}</span> <span class="lb-scoring-mode-tag">${teamStats.scoringMode === 'allMustFinish' ? t('rider.teamScoringAllMustFinish') : t('rider.teamScoringBestTime')}</span></div>
        <button class="btn" onclick="exportLeaderboardCSV()">${t('leaderboard.exportCsv')}</button>

function csvEscape(v){
  let s = String(v == null ? '' : v);
  if(/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildLeaderboardCsvLines(evt, ridersSubset, rankMap, cps, mandatoryCps, hasScoredCheckpoints){
  const header = [t('exportCsv.colRank'), t('exportCsv.colBib'), t('exportCsv.colName'), t('exportCsv.colTeam'), t('exportCsv.colFinishTime'), t('exportCsv.colStatus'),
    ...cps.map(cp => t('leaderboard.cpPrefix') + String(cp.order).padStart(2, '0') + ' ' + (cp.name || '')),
    t('exportCsv.colMandatoryDone'), t('exportCsv.colTotalDone'), ...(hasScoredCheckpoints ? [t('exportCsv.colTotalPoints')] : [])];
  const lines = [header.map(csvEscape).join(';')];
  sortRidersForOverview(ridersSubset).forEach(r => {
    const completed = r.completed || [];
    const scores = r.scores || {};
    const doneMandatory = mandatoryCps.filter(cp => completed.includes(cp.id)).length;
    const totalScore = Object.values(scores).reduce((sum, v) => sum + (Number(v) || 0), 0);
    const cpValues = cps.map(cp => {
      if(!completed.includes(cp.id)) return '';
      const type = getCheckpointType(cp.type);
      return type.isScored && scores[cp.id] !== undefined ? String(scores[cp.id]) : 'x';
    });
    const row = [
      rankMap.get(r.bib) || '',
      r.bib,
      r.name || '',
      getTeam(evt, r.teamId)?.name || '',
      r.finishTime ? formatDateTime(r.finishTime) : '',
      riderStatusBadgeHtml(evt, r).replace(/<[^>]*>/g, ''),
      ...cpValues,
      `${doneMandatory}/${mandatoryCps.length}`,
      `${completed.length}/${cps.length}`,
      ...(hasScoredCheckpoints ? [totalScore] : [])
    ];
    lines.push(row.map(csvEscape).join(';'));
  });
  return lines;
}
function buildLeaderboardSplitBuckets(evt, splitKey){
  const allRiders = evt.riders || [];
  if(splitKey === 'team'){
    const buckets = (evt.teams || []).map(tm => ({label: tm.name, riders: allRiders.filter(r => r.teamId === tm.id)}));
    buckets.push({label: t('rider.noTeam'), riders: allRiders.filter(r => !r.teamId)});
    return buckets;
  }
  const group = (evt.categoryGroups || []).find(g => g.id === splitKey);
  if(!group) return null;
  const buckets = group.options.map(opt => ({label: `${group.name}: ${opt}`, riders: allRiders.filter(r => r.categories && r.categories[group.id] === opt)}));
  buckets.push({label: `${group.name}: ${t('category.noCategory')}`, riders: allRiders.filter(r => !r.categories || !r.categories[group.id])});
  return buckets;
}
function exportLeaderboardCSV(splitKey){
  const evt = state.currentEvent;
  const allRiders = evt ? (evt.riders || []) : [];
  if(!allRiders.length){ alert(t('leaderboard.noRidersYet')); return; }

  const cps = evt.checkpoints.slice().sort((a, b) => a.order - b.order);
  const mandatoryCps = cps.filter(c => c.mandatory);
  const hasScoredCheckpoints = cps.some(cp => getCheckpointType(cp.type).isScored);
  const arrivedSorted = allRiders.filter(r => r.finishTime).sort((a, b) => new Date(a.finishTime) - new Date(b.finishTime));
  const rankMap = new Map(arrivedSorted.map((r, i) => [r.bib, i + 1]));

  const buckets = splitKey ? buildLeaderboardSplitBuckets(evt, splitKey) : null;
  let lines = [];
  if(buckets){
    buckets.forEach(bucket => {
      if(!bucket.riders.length) return;
      if(lines.length) lines.push('');
      lines.push(csvEscape(bucket.label));
      lines = lines.concat(buildLeaderboardCsvLines(evt, bucket.riders, rankMap, cps, mandatoryCps, hasScoredCheckpoints));
    });
  } else {
    lines = buildLeaderboardCsvLines(evt, allRiders, rankMap, cps, mandatoryCps, hasScoredCheckpoints);
  }

  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  downloadBlob(blob, (evt.name || 'leaderboard').replace(/\s+/g, '_').toLowerCase() + '-ergebnisse.csv');
}

/* ---------------- PDF-Baukasten ----------------
   Anhängbare Content-Blöcke pro Event, die als zusätzliche Seiten an
   PDF-Exporte angehängt werden (Manifest und/oder Spokecards) — kein
   Ersatz für die bestehende Tabellen-/Karten-Logik dieser Dokumente,
   sondern eine ergänzende Sektion (Waiver, Regeln, Sponsoren, ...).
   evt.pdfBlocks = [{id, type, targetDocuments[], enabled, sortOrder,
   content, config{}}]. Block-Titel laufen über t(), Block-Inhalt bleibt
   unübersetzte Organizer-Freitext-Eingabe wie Checkpoint-/Kategorie-Namen —
   einzige Ausnahme ist der optionale customTitle bei custom_text, der
   ebenfalls Rohtext ist. */
const PDF_BLOCK_TYPES = ['waiver', 'rules', 'sponsors', 'checkpoint_list', 'notes', 'custom_text', 'emergency_info', 'event_locations', 'image', 'table', 'variable_text'];
/* width: 'full'|'half'|'third' + pageBreakBefore (bool) drive layoutBlocks()'s
   auto-flow row packing (Paket 5 Teil B). Defaulted here (not a rigid
   document_type field per the spec's raw schema — kept the pre-existing,
   more flexible targetDocuments[] array instead, see roadmap doc) so any
   block loaded from storage without these keys (pre-Teil-B events) behaves
   exactly as before: one full-width block per row. */
const PDF_BLOCK_WIDTHS = ['full', 'half', 'third'];
const PDF_BLOCK_WIDTH_VALUES = {full: 1, half: 0.5, third: 0.33};
const PDF_DOCUMENT_TYPES = ['manifest', 'spokecards'];
/* Personal-Briefing/Aushang-Endergebnis deliberately excluded — Phase 14
   already drew this exact boundary (appendPdfBlocks() is only ever called
   for manifest/spokecards) and Aushang-Endergebnis has no export function
   at all yet; building one is out of scope for the roadmap's Teil-B
   checklist, which only asks for templates on document types the Baukasten
   already supports. */
const PDF_DOCUMENT_TEMPLATES = {
  manifest: [
    {type: 'checkpoint_list', width: 'half'},
    {type: 'image', width: 'half'},
    {type: 'rules', width: 'full'},
    {type: 'waiver', width: 'full'},
    {type: 'sponsors', width: 'full'}
  ],
  spokecards: [
    {type: 'emergency_info', width: 'full'},
    {type: 'sponsors', width: 'full'}
  ]
};
function pdfBlockLogosPerRow(width){
  return width === 'third' ? 1 : width === 'half' ? 2 : 3;
}
function pdfBlockTypeLabel(type){
  return t('pdfBlocks.type.' + type) || type;
}
function pdfBlockTitle(b){
  if((b.type === 'custom_text' || b.type === 'variable_text') && b.config.customTitle) return b.config.customTitle;
  return pdfBlockTypeLabel(b.type);
}
function withPdfBlockDefaults(b){
  const merged = Object.assign({
    id: uid('block'), type: 'custom_text', targetDocuments: ['manifest'],
    enabled: true, sortOrder: 0, content: '', config: {},
    width: 'full', pageBreakBefore: false
  }, b);
  if(!PDF_BLOCK_WIDTHS.includes(merged.width)) merged.width = 'full';
  merged.pageBreakBefore = merged.pageBreakBefore === true;
  merged.config = Object.assign({}, merged.config);
  return merged;
}
/* Auto-flow row packing — verbatim from spec 17.2. A block forces a new row
   either explicitly (pageBreakBefore) or because it no longer fits in the
   current row's remaining width (the >1.001 slack absorbs float error from
   summing 'third' widths (0.33) three times, which lands at 0.99). */
function layoutBlocks(blocks){
  const rows = [];
  let currentRow = [];
  let currentWidth = 0;
  for(const block of blocks){
    const w = PDF_BLOCK_WIDTH_VALUES[block.width] || 1;
    if(block.pageBreakBefore || currentWidth + w > 1.001){
      if(currentRow.length) rows.push(currentRow);
      currentRow = [];
      currentWidth = 0;
    }
    currentRow.push(block);
    currentWidth += w;
  }
  if(currentRow.length) rows.push(currentRow);
  return rows;
}
function defaultPdfBlocksForNewEvent(){
  const blocks = [];
  let order = 0;
  PDF_DOCUMENT_TYPES.forEach(docType => {
    (PDF_DOCUMENT_TEMPLATES[docType] || []).forEach(def => {
      blocks.push(withPdfBlockDefaults({type: def.type, width: def.width, targetDocuments: [docType], sortOrder: order++}));
    });
  });
  return blocks;
}
function resetPdfBlocksToDefault(docType){
  const evt = state.currentEvent;
  if(!evt || !PDF_DOCUMENT_TEMPLATES[docType]) return;
  if(!confirm(t('pdfBlocks.resetConfirm'))) return;
  evt.pdfBlocks = (evt.pdfBlocks || []).reduce((acc, b) => {
    if(!b.targetDocuments.includes(docType)){ acc.push(b); return acc; }
    const remaining = b.targetDocuments.filter(d => d !== docType);
    if(remaining.length){ b.targetDocuments = remaining; acc.push(b); }
    return acc;
  }, []);
  const startOrder = evt.pdfBlocks.length;
  PDF_DOCUMENT_TEMPLATES[docType].forEach((def, i) => {
    evt.pdfBlocks.push(withPdfBlockDefaults({type: def.type, width: def.width, targetDocuments: [docType], sortOrder: startOrder + i}));
  });
  debouncedSave();
  renderManifest();
}
function findPdfBlock(id){
  return ((state.currentEvent && state.currentEvent.pdfBlocks) || []).find(b => b.id === id);
}

  const evt = state.currentEvent;

  evt.pdfBlocks = evt.pdfBlocks || [];

function togglePdfBlockEnabled(id, checked){

  if(!b) return;
  b.enabled = checked;

function togglePdfBlockTargetDocument(id, docType, checked){
  const b = findPdfBlock(id);
  if(!b) return;
  const set = new Set(b.targetDocuments);
  if(checked) set.add(docType); else set.delete(docType);
  b.targetDocuments = Array.from(set);
  debouncedSave();
  renderManifest();
}
function movePdfBlock(id, dir){
  const evt = state.currentEvent;
  if(!evt) return;
  const list = evt.pdfBlocks;
  const idx = list.findIndex(b => b.id === id);
  const newIdx = idx + dir;
  if(idx === -1 || newIdx < 0 || newIdx >= list.length) return;
  const tmp = list[idx]; list[idx] = list[newIdx]; list[newIdx] = tmp;
  list.forEach((b, i) => { b.sortOrder = i; });
  debouncedSave();
  renderManifest();
}

function onPdfBlockTitleChange(id, value){

function setPdfBlockWidth(id, width){

function togglePdfBlockPageBreak(id, checked){
  const b = findPdfBlock(id);

function onPdfBlockConfigToggle(id, key, checked){

function onPdfBlockSponsorLogoUpload(id, input){
